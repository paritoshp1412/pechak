<!doctype html>
<html lang="en" data-theme="swiss">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0b"/>
<title>Pechak — personal finance, run like a firm</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230a0a0b'/%3E%3Cpolygon points='22,32 31,9 38,32' fill='%23f2f2ef'/%3E%3Cpolygon points='78,32 69,9 62,32' fill='%23f2f2ef'/%3E%3Cellipse cx='50' cy='54' rx='31' ry='27' fill='%23f2f2ef'/%3E%3Ccircle cx='37' cy='49' r='10' fill='%230a0a0b'/%3E%3Ccircle cx='63' cy='49' r='10' fill='%230a0a0b'/%3E%3Ccircle cx='39' cy='47' r='3' fill='%23f2f2ef'/%3E%3Ccircle cx='65' cy='47' r='3' fill='%23f2f2ef'/%3E%3Cpolygon points='46,62 54,62 50,71' fill='%23d6524f'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pechak">
<link rel="stylesheet" href="fonts/fonts.css">
<script type="module" src="/src/xlsx-loader.js"></script>
<style>
/* NOIR - black & white, one red signal (default) */
/* NOIR - black & white, one red signal */
:root{
  --bg:#0a0a0b; --surface:#141416; --surface2:#1c1c1f; --line:#2a2a2e; --line2:#3a3a40;
  --ink:#f4f4f2; --ink2:#b2b2b4; --ink3:#77777b;
  --accent:#f2f2ef; --accent-dim:#242428; --on-accent:#0a0a0b;
  --gilt:#909095; --gilt-dim:#2c2c30; --rule:#909095;
  --pos:#ececea; --neg:#d6524f; --warn:#d6524f; --blue:#8a8a8f;
  --t-eq:#d3d7da; --t-debt:#8f97a0; --t-gold:#c7a25e; --t-cash:#8fb1a4; --t-other:#b29bb4;
  --t-ess:#8fb1a4; --t-disc:#cf8f6a;
  --logo-bg:#0a0a0b; --logo-body:#f2f2ef; --logo-signal:#d6524f;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 16px 40px -12px rgba(0,0,0,.7);
  --radius:13px;
}
/* SWISS - white ground, primary blue #3A63F9, red #EB1000 + yellow #F3C600 (Bauhaus) */
[data-theme="swiss"]{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f2f4f8; --line:#e4e7ee; --line2:#cfd4de;
  --ink:#0b0d12; --ink2:#474d59; --ink3:#8b91a0;
  --accent:#3A63F9; --accent-dim:#e4eaff; --on-accent:#ffffff;
  --gilt:#EB1000; --gilt-dim:#f7d7d0; --rule:#0b0d12;
  --pos:#3A63F9; --neg:#EB1000; --warn:#EB1000; --blue:#111827;
  --t-eq:#3A63F9; --t-debt:#111827; --t-gold:#F3C600; --t-cash:#3aa0ff; --t-other:#EB1000;
  --t-ess:#3A63F9; --t-disc:#EB1000;
  --logo-bg:#3A63F9; --logo-body:#ffffff; --logo-signal:#EB1000;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 10px 26px -14px rgba(15,23,42,.16);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 700px at 78% -8%, color-mix(in srgb,var(--accent) 5%,transparent), transparent 60%);
  background-attachment:fixed;
}
::selection{background:var(--accent-dim);color:var(--ink)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;margin:0;font-weight:600;letter-spacing:-.015em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---- app frame ---- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{
  background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 78%,var(--bg)));
  border-right:1px solid var(--line);padding:24px 14px 20px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;box-shadow:1px 0 0 color-mix(in srgb,var(--gilt) 18%,transparent);
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 18px}
.seal{width:38px;height:38px;flex:0 0 38px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.wm{display:flex;flex-direction:column;gap:1px;line-height:1}
.wm b{font-family:"Space Grotesk";font-size:20px;font-weight:700;letter-spacing:-.03em}
.wm .tag{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gilt);font-weight:600;margin-top:3px}
.navlabel{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);font-weight:600;
  padding:0 12px;margin:16px 0 7px;display:flex;align-items:center;gap:9px}
.navlabel::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:none;border:0;color:var(--ink2);padding:9px 13px;border-radius:9px;cursor:pointer;
  font-size:13.5px;font-weight:500;transition:background .16s,color .16s}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--surface2);color:var(--ink);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--gilt)}
.nav button.on .k{color:var(--accent)}
.nav .k{width:17px;text-align:center;color:var(--ink3);font-size:13px;transition:color .16s}
/* ---- expandable nav groups (Reports / Settings): a toggle button that expands a
   nested list of direct sub-destinations in place, instead of landing on an
   in-page tab switcher. ---- */
.navgroup{display:flex;flex-direction:column}
.navgroup-btn{justify-content:space-between}
.navgroup-btn .chev{margin-left:auto;font-size:9px;color:var(--ink3);transition:transform .18s}
.navgroup.open .navgroup-btn .chev{transform:rotate(90deg)}
.navsub{display:flex;flex-direction:column;gap:1px;max-height:0;overflow:hidden;transition:max-height .22s ease}
.navgroup.open .navsub{max-height:280px}
.navsub button{padding:8px 13px 8px 35px;font-size:12.5px}
.navsub button .k{display:none}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:6px}

/* ---- header ---- */
.main{padding:28px 34px 64px;max-width:1200px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;
  flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);position:relative}
.top::after{content:"";position:absolute;left:0;bottom:-1px;width:56px;height:2px;background:var(--gilt)}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gilt);font-weight:600;margin-bottom:9px}
.top h1{font-size:25px}
.top .sub{color:var(--ink3);font-size:12.5px;margin-top:4px}
.actions{display:flex;gap:8px;align-items:center}

/* ---- buttons ---- */
.btn{background:var(--surface);border:1px solid var(--line2);color:var(--ink);padding:9px 13px;border-radius:9px;
  cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;
  transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.p:hover{filter:brightness(1.05);color:var(--on-accent)}
.btn.sm{padding:6px 10px;font-size:12px}

/* ---- grid + cards ---- */
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow);overflow-x:auto}
.card h3{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:13px}
.kpi{transition:transform .16s,border-color .16s}
.kpi:hover{transform:translateY(-2px);border-color:var(--line2)}
.kpi .label{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.11em;font-weight:600}
.kpi .val{font-family:"JetBrains Mono";font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:9px;line-height:1}
.kpi .note{font-size:12px;color:var(--ink2);margin-top:9px}
.hero{position:relative;overflow:hidden;grid-column:span 2;
  background:linear-gradient(150deg,var(--surface),var(--surface2));border-color:var(--line2)}
.hero::after{content:"";position:absolute;right:18px;top:18px;width:34px;height:34px;border-radius:50%;
  border:1.4px solid var(--gilt);opacity:.45}
.hero::before{content:"";position:absolute;right:24px;top:24px;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--gilt);opacity:.3}
.hero .val{font-size:41px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.chip{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:20px;background:var(--surface2);
  color:var(--ink2);border:1px solid var(--line);letter-spacing:.02em}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600;
  position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right;font-family:"JetBrains Mono";font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface2)}
.tablewrap{max-height:600px;overflow:auto;border-radius:11px;border:1px solid var(--line)}
.muted{color:var(--ink3)}
.sec-row td{background:var(--surface2);font-weight:600;font-family:"Space Grotesk";text-transform:none;
  color:var(--ink);border-top:1px solid var(--line2);position:relative;letter-spacing:-.01em}
.sec-row td:first-child{box-shadow:inset 3px 0 0 var(--gilt)}
.sub-row td{font-weight:600;background:color-mix(in srgb,var(--accent) 8%,transparent);border-top:1px solid var(--gilt-dim)}
.tot-row td{font-weight:700;border-top:3px double var(--line2)}
.stmt td,.stmt th{padding:9px 14px;white-space:nowrap}
.stmt td:first-child:not([colspan]),.stmt th:first-child{position:sticky;left:0;background:var(--surface);z-index:2;min-width:172px;
  width:220px;max-width:260px;white-space:normal;overflow-wrap:anywhere;box-shadow:1px 0 0 var(--line)}
.stmt .sec-row td:first-child,.stmt .sub-row td:first-child,.stmt .tot-row td:first-child{background:var(--surface2)}
.stmt tbody tr:hover td{background:var(--surface2)}
.stmt .n{min-width:80px}
.stmt td.n+td.n{border-left:1px solid transparent}
.stmt td:last-child,.stmt th:last-child{border-left:1px solid var(--gilt-dim);font-weight:600}

/* ---- forms ---- */
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:span 2}
label{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
input,select{background:var(--bg);border:1px solid var(--line2);color:var(--ink);padding:9px 11px;border-radius:8px;
  font-size:13px;font-family:inherit;width:100%;transition:border-color .15s}
/* The width:100% above is meant for text/number/select fields -- a bare checkbox
   has no business inheriting it. Without this, a checkbox placed next to a
   flex:1 sibling (e.g. the wizard's account-rename rows) ends up with its own
   flex-basis effectively 100% of the row, ballooning to 200px+ wide and
   starving the actual text field down to ~20px. Caught by rendering the wizard
   in a real browser and measuring the boxes, not by reading the CSS and assuming
   it looked fine. */
input[type=checkbox]{width:auto;flex:none}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
input.mono{font-family:"JetBrains Mono"}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;padding:0;border:0;background:var(--line2);border-radius:4px;width:200px}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--surface)}
.check{font-size:12.5px;padding:9px 13px;border-radius:8px;margin-top:14px}
.check.ok{background:var(--accent-dim);color:var(--ink)}
.check.bad{background:color-mix(in srgb,var(--neg) 18%,transparent);color:var(--neg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px;align-items:center}
.filters input,.filters select{width:auto;min-width:112px}
.filters label{align-self:center}

/* ---- quick add (mobile capture) ---- */
.cap-wrap{max-width:480px}
#capBody .card{margin-bottom:14px}
.cap-tabs{margin-bottom:16px}
.cap-amt{position:relative}
.cap-amt .rup{position:absolute;left:14px;top:32px;color:var(--ink3);font-size:20px;font-family:"JetBrains Mono"}
.cap-amt input{font-family:"JetBrains Mono";font-size:22px;font-weight:600;padding:12px 12px 12px 32px}
.cap-daterow{display:flex;gap:8px}
.cap-daterow input{flex:1}
.cap-chip{flex:0 0 auto;background:var(--surface2);border:1px solid var(--line2);color:var(--ink2);border-radius:8px;padding:0 12px;font-size:12px;font-weight:600;cursor:pointer}
.txn-presets{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}
.txn-preset{flex:0 0 auto;border:1px solid var(--line2);background:var(--surface2);color:var(--ink2);border-radius:9px;padding:7px 10px;font-size:11.5px;cursor:pointer}
.txn-preset:hover{border-color:var(--accent);color:var(--ink)}
.txn-effect{margin:12px 0;padding:10px 12px;border-radius:9px;background:color-mix(in srgb,var(--accent) 8%,var(--surface2));font-size:12px;color:var(--ink2)}
.cap-row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.cap-row:last-child{border-bottom:0}
.cap-row .l{flex:1;min-width:0}
.cap-row .kind{font-size:13px;font-weight:600}
.cap-row .meta{color:var(--ink3);font-size:11.5px;margin-top:2px}
.cap-row .amt{font-family:"JetBrains Mono";font-weight:600;font-size:14px;white-space:nowrap}
.cap-row .amt.exp{color:var(--neg)}
.cap-row .acts{display:flex;gap:6px;margin-top:5px}
.cap-row .acts span{font-size:11px;color:var(--ink3);border:1px solid var(--line2);border-radius:7px;padding:2px 7px;cursor:pointer}
.cap-kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.cap-kv:last-child{border-bottom:0}
.cap-kv .k{color:var(--ink3)}
.cap-kv .v{font-family:"JetBrains Mono"}
.cap-danger{border:1px solid color-mix(in srgb,var(--neg) 40%,var(--line));border-radius:var(--radius);padding:16px;background:color-mix(in srgb,var(--neg) 6%,var(--surface));margin-bottom:14px}
.cap-danger h3{color:var(--neg)}

/* ---- bars / legend / charts ---- */
.bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2);margin-top:12px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
canvas{max-width:100%}

/* ---- views / states ---- */
.view{display:none}
.view.on{display:block;animation:viewIn .34s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.empty{text-align:center;padding:76px 20px;color:var(--ink3)}
.empty h2{font-size:20px;color:var(--ink);margin-bottom:9px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 19px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:.25s;
  pointer-events:none;z-index:50;box-shadow:0 10px 30px -6px rgba(0,0,0,.5)}
.toast.show{opacity:1}
.storage-warn{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:var(--neg);color:#fff;
  padding:10px 16px;font-size:12.5px;font-weight:600;align-items:center;justify-content:center;gap:14px;
  flex-wrap:wrap;box-shadow:0 4px 16px -4px rgba(0,0,0,.4)}
.storage-warn.show{display:flex}
.storage-warn .btn{background:#fff;color:var(--neg);border-color:#fff}
.storage-warn .btn:hover{filter:brightness(.95);color:var(--neg)}
.sync-remind{display:none;position:fixed;top:0;left:0;right:0;z-index:98;background:var(--surface2);color:var(--ink);
  border-bottom:1px solid var(--line2);padding:10px 16px;font-size:12.5px;font-weight:500;align-items:center;
  justify-content:center;gap:14px;flex-wrap:wrap}
.sync-remind.show{display:flex}
.sync-remind .btn{padding:5px 12px}
.sync-remind .x{cursor:pointer;color:var(--ink3);font-size:15px;line-height:1;padding:2px 4px}
.sync-remind .x:hover{color:var(--ink)}
.switch{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.switch button{border:0;background:none;color:var(--ink2);padding:6px 13px;border-radius:6px;font-size:12px;cursor:pointer;
  font-weight:500;transition:background .15s,color .15s}
.switch button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.act{cursor:pointer;color:var(--ink3);padding:2px 6px;border-radius:6px;transition:color .15s,background .15s}
.act:hover{color:var(--accent);background:var(--surface2)}
.act.del:hover{color:var(--neg)}
th.srt{cursor:pointer;user-select:none;transition:color .15s}
th.srt:hover{color:var(--accent)}
.exp-toggle{cursor:pointer;user-select:none;color:var(--ink3);display:inline-block;width:15px}
.exp-toggle:hover{color:var(--accent)}
.sub-detail td{color:var(--ink2);font-size:12.5px;background:color-mix(in srgb,var(--ink) 2%,transparent)}
.sub-detail td:first-child{padding-left:30px}
.cat-card{padding:14px 16px;margin-bottom:10px}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cat-subs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.subchip{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.subchip.addchip{background:none;border:1px dashed var(--line2);color:var(--ink3)}
.subchip.addchip:hover{color:var(--accent);border-color:var(--accent)}
.cat-editrow{border-top:1px solid var(--line);margin-top:10px}

/* ---- mobile app header ---- */
.mheader{display:none;align-items:center;gap:12px;padding:14px 16px;position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.mheader .hbtn{background:none;border:0;color:var(--ink);font-size:21px;line-height:1;padding:4px 8px;
  cursor:pointer;border-radius:8px}
.mheader .hbtn:hover{background:var(--surface2)}
.mheader .mwm{display:flex;align-items:baseline;gap:8px;cursor:pointer;user-select:none}
.mheader .mwm b{font-family:"Space Grotesk";font-weight:700;font-size:16.5px}
.mheader .mwm .mwm-sub{font-size:11.5px;color:var(--ink3)}

/* ---- hamburger drawer ---- */
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:75}
.drawer-backdrop.on{display:block}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(78vw,296px);background:var(--surface);
  border-right:1px solid var(--line);z-index:80;padding:22px 14px 18px;display:flex;flex-direction:column;gap:2px;
  transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;box-shadow:8px 0 30px -10px rgba(0,0,0,.4)}
.drawer.on{transform:translateX(0)}
.mobile-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;height:64px;padding:4px 6px calc(4px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line2)}
.mobile-nav button{flex:1;min-width:0;min-height:48px;border:0;background:none;color:var(--ink3);border-radius:9px;
  font:600 10.5px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.mobile-nav button .mi{font-size:18px;line-height:1}
.mobile-nav button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}

/* ---- floating action buttons ---- */
.fab{position:fixed;bottom:24px;width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;z-index:55;
  display:flex;align-items:center;justify-content:center;font-size:23px;line-height:1;
  box-shadow:0 10px 26px -8px rgba(0,0,0,.45);transition:transform .15s,filter .15s}
.fab:hover{transform:translateY(-2px)}
.fab-add{right:24px;background:var(--accent);color:var(--on-accent)}
.data-safety{position:fixed;left:24px;bottom:24px;z-index:55;display:none;align-items:center;gap:8px;
  max-width:calc(100vw - 104px);min-height:44px;padding:8px 13px;border:1px solid var(--line2);
  border-radius:22px;background:var(--surface);color:var(--ink);box-shadow:0 10px 26px -8px rgba(0,0,0,.45);
  font:600 11.5px Inter,sans-serif;text-align:left;cursor:pointer}
.data-safety:hover{transform:translateY(-2px)}
.data-safety .status-dot{width:8px;height:8px;border-radius:50%;background:var(--pos);flex:0 0 auto}
.explain-link{border:0;background:none;color:var(--accent);padding:4px 0;font:600 11px Inter,sans-serif;cursor:pointer}
.explain-link:hover{text-decoration:underline}
.calc-overlay{display:none;position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
.calc-overlay.on{display:flex}
.calc-sheet{width:min(620px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line2);
  border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(0,0,0,.3)}
.calc-sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.calc-grid{display:grid;grid-template-columns:130px 1fr;gap:9px 12px;font-size:12.5px}
.calc-grid .k{color:var(--ink3)}
.fab-badge{position:absolute;top:-3px;right:-3px;background:var(--gilt);color:#fff;border-radius:50%;
  min-width:19px;height:19px;padding:0 4px;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace}
@media(max-width:900px){.fab,.data-safety{bottom:calc(76px + env(safe-area-inset-bottom))}}

/* ---- Add-transaction overlay ---- */
.addoverlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:95;overflow-y:auto}
.addoverlay.on{display:block}
.addoverlay-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg);z-index:1}
.addoverlay-head h3{font-family:"Space Grotesk";font-size:16px}
.addoverlay-body{padding:16px;max-width:640px;margin:0 auto 40px}
.cc-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90}
.cc-card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:91;
  width:min(92vw,380px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:0 10px 40px -8px rgba(0,0,0,.5)}
.cc-msg{font-size:14px;line-height:1.5;color:var(--ink);white-space:pre-line;margin-bottom:16px}
.cc-acts{display:flex;gap:10px}
.cc-acts .btn{flex:1}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:20px 16px 86px}
  .g4,.g3,.g2,.hero{grid-template-columns:1fr}
  .hero{grid-column:auto}
  .form{grid-template-columns:1fr 1fr}
  .field.wide{grid-column:auto}
  .mheader{display:flex}
  .mobile-nav{display:flex}
  .stmt td:first-child:not([colspan]),.stmt th:first-child{min-width:132px;width:min(42vw,180px);max-width:min(42vw,180px)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- theme picker ---- */
.themepick{display:flex;gap:6px}
.themepick .tp{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--surface);
  border:1px solid var(--line2);color:var(--ink2);padding:8px 9px;border-radius:9px;cursor:pointer;
  font-size:12.5px;font-weight:500;transition:color .15s,border-color .15s,box-shadow .15s}
.themepick .tp:hover{color:var(--ink);border-color:var(--ink3)}
.themepick .tp.on{color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.themepick .sw{width:14px;height:14px;border-radius:4px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sw-noir{background:linear-gradient(135deg,#0a0a0b 0 50%,#f2f2ef 50% 100%)}
.sw-swiss{background:linear-gradient(135deg,#ffffff 0 40%,#3A63F9 40% 62%,#EB1000 62% 82%,#F3C600 82% 100%)}

/* ---- coloured tags ---- */
.chip[class*='t-']{color:var(--ink)}
.chip.t-eq::before,.chip.t-debt::before,.chip.t-gold::before,.chip.t-cash::before,.chip.t-other::before,.chip.t-ess::before,.chip.t-disc::before{content:'';display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chip.t-eq{border-color:color-mix(in srgb,var(--t-eq) 40%,transparent);background:color-mix(in srgb,var(--t-eq) 13%,transparent)}
.chip.t-eq::before{background:var(--t-eq)}
.chip.t-debt{border-color:color-mix(in srgb,var(--t-debt) 40%,transparent);background:color-mix(in srgb,var(--t-debt) 13%,transparent)}
.chip.t-debt::before{background:var(--t-debt)}
.chip.t-gold{border-color:color-mix(in srgb,var(--t-gold) 40%,transparent);background:color-mix(in srgb,var(--t-gold) 13%,transparent)}
.chip.t-gold::before{background:var(--t-gold)}
.chip.t-cash{border-color:color-mix(in srgb,var(--t-cash) 40%,transparent);background:color-mix(in srgb,var(--t-cash) 13%,transparent)}
.chip.t-cash::before{background:var(--t-cash)}
.chip.t-other{border-color:color-mix(in srgb,var(--t-other) 40%,transparent);background:color-mix(in srgb,var(--t-other) 13%,transparent)}
.chip.t-other::before{background:var(--t-other)}
.chip.t-ess{border-color:color-mix(in srgb,var(--t-ess) 40%,transparent);background:color-mix(in srgb,var(--t-ess) 13%,transparent)}
.chip.t-ess::before{background:var(--t-ess)}
.chip.t-disc{border-color:color-mix(in srgb,var(--t-disc) 40%,transparent);background:color-mix(in srgb,var(--t-disc) 13%,transparent)}
.chip.t-disc::before{background:var(--t-disc)}

/* ---- charts ---- */
.cx{width:100%;margin-top:4px}
.cx-svg{display:block;width:100%;height:auto;overflow:visible}
.cx-svg text{font-family:"JetBrains Mono",ui-monospace,monospace}
.cx-v{font-size:9.5px;font-weight:600;text-anchor:middle}
.cx-x{font-size:9.5px;fill:var(--ink3);text-anchor:middle}
.cx-lg{font-size:10.5px;fill:var(--ink2);font-family:Inter,sans-serif}
.cx-end{font-size:10px;font-weight:600;text-anchor:start}
.sh{margin-top:6px}
.sh-bar{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.sh-seg{display:flex;align-items:center;justify-content:center;min-width:2px;transition:filter .15s}
.sh-seg:hover{filter:brightness(1.12)}
.sh-seg span{font:600 10px "JetBrains Mono",monospace}
.sh-leg{margin-top:14px;display:flex;flex-direction:column;gap:1px}
.sh-row{display:grid;grid-template-columns:14px 1fr auto auto;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line)}
.sh-row:last-child{border-bottom:0}
.sh-sw{width:11px;height:11px;border-radius:3px}
.sh-lb{font-size:12.5px;color:var(--ink)}
.sh-vl{font-size:12.5px;color:var(--ink);min-width:82px;text-align:right}
.sh-pc{font-size:12px;color:var(--ink3);min-width:50px;text-align:right}

/* ---- Swiss (Bauhaus) highlight accents ---- */
[data-theme="swiss"] .top::after{width:132px;height:4px;background:linear-gradient(90deg,var(--accent) 0 38%,#EB1000 38% 70%,#F3C600 70% 100%)}
[data-theme="swiss"] .card h3::before{content:"";display:inline-block;width:15px;height:3px;background:#EB1000;margin-right:9px;vertical-align:middle;position:relative;top:-3px}
[data-theme="swiss"] .hero{border-left:4px solid var(--accent)}
[data-theme="swiss"] .hero::before{display:none}
[data-theme="swiss"] .hero::after{width:22px;height:22px;border-radius:0;border:0;background:#F3C600;opacity:1;top:16px;right:16px}
[data-theme="swiss"] .nav button.on::before{background:var(--accent)}
[data-theme="swiss"] .kpi .val{letter-spacing:-.03em}
</style>
</head>

import { createStorageAdapter } from "/src/adapters/storageAdapter.js";
import { createDocumentAdapter } from "/src/adapters/documentAdapter.js";

const documentAdapter=createDocumentAdapter();
const shareAdapter=createShareAdapter(documentAdapter);
window.storageAdapter=storageAdapter;window.documentAdapter=documentAdapter;window.shareAdapter=shareAdapter;
const APP_VERSION=packageMetadata.version;
/* ===== CONFIG ===== */
const KINDS={
 "Spend - Bank/Cash":{t:"Expense",cf:"Operating",cr:1},"Spend - Credit Card":{t:"Expense",cf:"Operating",cr:1},
 "Spend - Friend Paid (I owe)":{t:"Expense",cf:"Operating",cr:1},"Salary / Recurring Income":{t:"Income",cf:"Operating",cr:1},
 "Windfall Income":{t:"Income",cf:"Operating",cr:1},"Transfer - Between My Accounts":{t:"Transfer",cf:"Internal",cr:0},
 "Cash Withdrawal":{t:"Transfer",cf:"Internal",cr:0},"Credit Card Bill Payment":{t:"Transfer",cf:"Financing",cr:0},
 "Invest - Buy":{t:"Transfer",cf:"Investing",cr:0},"Divest - Sell":{t:"Transfer",cf:"Investing",cr:0},
 "Reimbursable Spend (Claim)":{t:"Transfer",cf:"Operating",cr:0},"Claim Reimbursed":{t:"Transfer",cf:"Operating",cr:0},
 "I Paid for Others (Splitwise)":{t:"Transfer",cf:"Internal",cr:0},"Splitwise Settle - I Receive":{t:"Transfer",cf:"Internal",cr:0},
 "Splitwise Settle - I Pay":{t:"Transfer",cf:"Internal",cr:0},"Loan / Credit Taken":{t:"Transfer",cf:"Financing",cr:0},
 "Loan Repayment":{t:"Transfer",cf:"Financing",cr:0},"Capital Loss (realized)":{t:"Expense",cf:"Investing",cr:1}
};
const EXT="External / World";
/* Kind -> recommended Class/Liquidity, derived from what's already in the real
   workbook (every Kind maps to exactly one Class/Liquidity pair there). Used to
   pre-fill (not lock) the Add/Edit Account form so the person doesn't have to know
   the classification scheme from scratch. */
const ACCT_KIND_DEFAULTS={

// Read defined names, subcategory lists, and Stock-data-type display names straight from the xlsx XML.
async function extractRichNames(buf){
  const out={rich:{},defnames:{},subcats:{}};
  try{
    if(typeof DecompressionStream==="undefined")return out;
    const files=await unzipParts(buf,n=>n==="xl/metadata.xml"||n.startsWith("xl/richData/")||n==="xl/workbook.xml"||n==="xl/_rels/workbook.xml.rels"||n==="xl/sharedStrings.xml"||n.startsWith("xl/worksheets/"));

    const relMap={};[...T("xl/_rels/workbook.xml.rels").matchAll(/Id="([^"]+)"[^>]*Target="([^"]+)"/g)].forEach(x=>relMap[x[1]]=x[2]);
    const wbx=T("xl/workbook.xml");
    // ---- defined names (independent of rich data) ----
    [...wbx.matchAll(/<definedName name="([^"]+)"[^>]*>([^<]+)<\/definedName>/g)].forEach(x=>out.defnames[x[1]]=ent(x[2]));
    const sheets=[...wbx.matchAll(/<sheet[^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)].map(x=>[ent(x[1]),x[2]]);
    const resolve=rid=>{let t=relMap[rid];if(!t)return"";t=t.replace(/^\//,"");return t.startsWith("xl/")?t:"xl/"+t;};
    // ---- shared strings ----
    const sst=[...T("xl/sharedStrings.xml").matchAll(/<si>([\s\S]*?)<\/si>/g)].map(si=>ent([...si[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(t=>t[1]).join("")));
    // ---- subcategories: read each defined-name column straight from the Lists sheet cells ----
    const listEntry=sheets.find(([nm])=>nm.toLowerCase().includes("list"));
    if(listEntry){
      const lx=T(resolve(listEntry[1]));
      const cellVal={};
      [...lx.matchAll(/<c r="([A-Z]+\d+)"([^>]*)>\s*<v>([\s\S]*?)<\/v>\s*<\/c>/g)].forEach(mm=>{const addr=mm[1],attrs=mm[2],v=mm[3];cellVal[addr]=/t="s"/.test(attrs)?(sst[+v]||""):ent(v);});
      Object.entries(out.defnames).forEach(([nm,ref])=>{if(!/Lists/.test(ref))return;const rng=ref.replace(/\$/g,"").split("!").pop();const m2=rng.match(/([A-Z]+)(\d+)/);if(!m2)return;const col=m2[1],r0=+m2[2];const vals=[];for(let k=0;k<300;k++){const val=cellVal[col+(r0+k)];if(val==null||String(val).trim()==="")break;vals.push(String(val).trim());}if(vals.length)out.subcats[nm]=vals;});
    }
    // ---- Stock data-type display names (rich data; may be absent) ----
    const md=T("xl/metadata.xml");if(!md)return out;
    const vmMap=[...(md.split("<valueMetadata")[1]||"").matchAll(/<bk>[\s\S]*?<rc t="(\d+)" v="(\d+)"[\s\S]*?<\/bk>/g)].map(x=>[+x[1],+x[2]]);
    const rvb=[...md.matchAll(/rvb i="(\d+)"/g)].map(x=>+x[1]);
    const structs=[...T("xl/richData/rdrichvaluestructure.xml").matchAll(/<s (?:t="[^"]*")?>([\s\S]*?)<\/s>/g)].map(x=>[...x[1].matchAll(/<k n="([^"]+)"/g)].map(k=>k[1]));
    const rvs=[...T("xl/richData/rdrichvalue.xml").matchAll(/<rv s="(\d+)">([\s\S]*?)<\/rv>/g)].map(x=>[+x[1],[...x[2].matchAll(/<v>([\s\S]*?)<\/v>/g)].map(v=>v[1])]);
    if(!rvs.length)return out;
    const rvDict=i=>{const[s,vals]=rvs[i];const keys=structs[s]||[];const d={};keys.forEach((k,j)=>d[k]=vals[j]);return d;};
    const nameFor=(i,dep)=>{if(dep>4||i<0||i>=rvs.length)return "";const d=rvDict(i);if("%cvi" in d)return nameFor(+d["%cvi"],dep+1);return d["Name"]||d["_DisplayString"]||"";};
    sheets.forEach(([nm,rid])=>{
      const sx=T(resolve(rid));if(!sx)return;const map={};
      [...sx.matchAll(/<c r="[A-Z]+(\d+)"[^>]*vm="(\d+)"/g)].forEach(x=>{const row=+x[1],vm=+x[2],ee=vmMap[vm-1];if(!ee)return;const fi=ee[1];if(fi>=rvb.length)return;const name=ent(nameFor(rvb[fi],0));if(name)map[row]=name;});
      out.rich[nm]=map;
    });

  const rm=sheetRows(wb,"read me");
  if(rm){
    const g=(r,c)=>{const row=rm[r-1]||[];return row[c];};
    const statementStart=toYMD(g(6,2)),asOfDateSheet=toYMD(g(7,2)),modelYear=num(g(8,2));
    S.modelSettings=S.modelSettings||{};
    if(statementStart)S.modelSettings.statementStart=statementStart;
    if(asOfDateSheet)S.modelSettings.asOfDate=asOfDateSheet;
    if(modelYear!=null)S.modelSettings.modelYear=modelYear;
    if(asOfDateSheet&&!(S.taxSettings&&S.taxSettings.asOfDate)){
      S.taxSettings=S.taxSettings||{regimeMode:"auto",regimeManual:"new"};
      S.taxSettings.asOfDate=asOfDateSheet;
    }
  }
  /* Tax Payments (data-entry only -- ensureTaxPaymentState()/taxPaymentsForFy()/
     computeAdvanceTax() are untouched, still work over S.taxPayments however it got
     populated). The sheet has no per-row FY column -- it's a single active-year log,
     same "one block, roll it forward" convention as Tax Rules -- so every imported
     row is tagged with whichever FY S.taxRules now holds (post the block above).
     Section/Payer/Income-Head are richer than S.taxPayments' own type/amount/date/fy
     shape; carried through as extra fields for future display, ignored by every
     existing consumer (plain JS objects, no schema to violate). */
  const tp=sheetRows(wb,"tax payments");
  if(tp){
    const tph=headerIdx(tp,["date","type","amount"]);
    if(tph>=0){
      const tm=colMap(tp[tph]);
      const tc={date:pick(tm,"date"),type:pick(tm,"type"),sec:pick(tm,"section"),payer:pick(tm,"payer","description"),head:pick(tm,"income head","head"),amt:pick(tm,"amount")};
      const fyLabel=(S.taxRules&&S.taxRules.fy)||TAX_RULES_DEFAULT.fy;
      const payments=[];
      for(let i=tph+1;i<tp.length;i++){
        const r=tp[i]||[];
        const dt=toYMD(r[tc.date]),type=clean(r[tc.type]),amt=num(r[tc.amt]);
        if(!dt||!type)continue; // blank buffer row or a summary row below it (TDS total/Advance-tax total/etc, which have no Date+Type together)
        payments.push({id:capUid(),type,amount:amt||0,date:dt,fy:fyLabel,section:clean(r[tc.sec])||null,payer:clean(r[tc.payer])||null,incomeHead:clean(r[tc.head])||null});
      }
      if(payments.length){
        // Merge on type+date+amount+section together (the closest thing a payment
        // row has to a natural key), NOT a wholesale overwrite: keep every existing
        // payment the user added in-app (untagged) untouched regardless of what's
        // in the sheet; for anything previously imported FROM the sheet (tagged
        // sheet-import), keep it only if that exact payment still exists in the
        // sheet -- drop it otherwise, since that's a real sheet-side correction or
        // removal; then add whatever fresh sheet rows aren't already covered.
        const prevAll=S.taxPayments||[];
        const dupeKey=p=>`${p.type}|${p.date}|${Math.round((p.amount||0)*100)}|${p.section||""}`;
        const freshKeys=new Set(payments.map(dupeKey));
        const kept=prevAll.filter(p=>p.source!=="sheet-import"||freshKeys.has(dupeKey(p)));
        const keptKeys=new Set(kept.map(dupeKey));
        const additions=payments.filter(p=>!keptKeys.has(dupeKey(p))).map(p=>({...p,source:"sheet-import"}));
        S.taxPayments=[...kept,...additions];
      }
    }
  }
  /* Capital Gains sheet (often fed from a broker statement) and the app's own
     Sell-driven S.capGainsEvents (Phase 0's consumeLotsFifo) are two different
     sources describing sales that can genuinely overlap -- additive by design:
     import sheet rows as new events, keep every app-generated event as-is, and
     de-dupe on Name+Account+Sale Date+Proceeds together (the closest thing to a
     natural key a sale has here), keeping the app's own event on a match since it
     may carry FX/lot detail a sheet row never has. Imported events are classified
     via classifyFromSheetClass() above (the sheet's own 7-class Asset Class column
     is ground truth), not the app-native type/cls/mfCategory path -- so they
     deliberately carry no type/cls/mfCategory at all, only sheetClass. */
  const cgSheet=sheetRows(wb,"capital gains");
  if(cgSheet){
    const cgh=headerIdx(cgSheet,["asset class","sale date"]);
    if(cgh>=0){
      const cm=colMap(cgSheet[cgh]);
      const cc={cls:pick(cm,"asset class"),nm:pick(cm,"name"),acct:pick(cm,"account"),acq:pick(cm,"acq date"),qty:pick(cm,"qty"),cost:pick(cm,"cost basis"),sale:pick(cm,"sale date"),proc:pick(cm,"proceeds")};
      const imported=[];
      for(let i=cgh+1;i<cgSheet.length;i++){
        const r=cgSheet[i]||[];
        const cls=clean(r[cc.cls]);
        if(!cls)break; // blank Asset Class = end of the real rows (the TOTAL row has none)
        const saleDate=toYMD(r[cc.sale]),proceeds=num(r[cc.proc]);
        if(!saleDate||proceeds==null)continue; // not a completed sale yet -- mirrors the sheet's own ID formula ("blank until Proceeds is filled in")
        imported.push({id:capUid(),holdName:clean(r[cc.nm])||null,acct:clean(r[cc.acct])||null,
          sheetClass:cls,qty:num(r[cc.qty]),costBasis:num(r[cc.cost]),
          acqDate:toYMD(r[cc.acq]),saleDate,proceeds,source:"sheet-import"});
      }
      if(imported.length){
        const existing=S.capGainsEvents||[];
        const dupeKey=e=>`${e.holdName}|${e.acct}|${e.saleDate}|${Math.round((e.proceeds||0)*100)}`;
        const existingKeys=new Set(existing.map(dupeKey));
        const fresh=imported.filter(e=>!existingKeys.has(dupeKey(e)));
        S.capGainsEvents=[...existing,...fresh];
      }
    }
  }
  /* Fixed Deposits sheet (data-entry only -- fdInterestForFY()/fixedDepositsBreakdown()
     above are untouched and keep computing independently over S.fixedDeposits however
     it got populated; the app still works with zero workbook). Value-@-As-of and
     Interest-this-FY (J/K columns) are the sheet's OWN computed output -- not imported,
     since the app recomputes them itself from the terms below; importing a pre-computed
     number would silently drift out of sync the moment the two implementations
     disagreed, same reasoning as leaving the Tax Summary Step totals alone. Same
     natural-key merge as Deductions/Tax Payments: bank+principal+start together (an
     FD's own ID column is user-typed free text, not guaranteed unique or stable
     enough to key off). */
  const fdSheet=sheetRows(wb,"fixed deposits");
  if(fdSheet){
    const fdh=headerIdx(fdSheet,["principal","maturity"]);
    if(fdh>=0){
      const fm=colMap(fdSheet[fdh]);
      const fc={bank:pick(fm,"bank"),princ:pick(fm,"principal"),rate:pick(fm,"rate"),comp:pick(fm,"comp"),start:pick(fm,"start"),mat:pick(fm,"maturity"),payout:pick(fm,"payout"),status:pick(fm,"status"),tds:pick(fm,"tds")};
      const imported=[];
      for(let i=fdh+1;i<fdSheet.length;i++){
        const r=fdSheet[i]||[];
        const bank=clean(r[fc.bank]),principal=num(r[fc.princ]);
        if(!bank&&principal==null)continue; // blank buffer row, or the TOTAL row (no Bank text there either)
        if(!bank||principal==null)continue; // needs both to be a real FD row
        const start=toYMD(r[fc.start]);
        if(!start)continue;
        imported.push({id:capUid(),bank,principal,rate:num(r[fc.rate])||0,compPerYear:num(r[fc.comp])||1,
          start,maturity:toYMD(r[fc.mat])||start,payout:clean(r[fc.payout])||"Cumulative",
          status:clean(r[fc.status])||"Active",tdsPaid:num(r[fc.tds])||0,source:"sheet-import"});
      }
      if(imported.length){
        const prevAll=S.fixedDeposits||[];
        const dupeKey=f=>`${f.bank}|${Math.round((f.principal||0)*100)}|${f.start}`;
        const freshKeys=new Set(imported.map(dupeKey));
        const kept=prevAll.filter(f=>f.source!=="sheet-import"||freshKeys.has(dupeKey(f)));
        const keptKeys=new Set(kept.map(dupeKey));
        const additions=imported.filter(f=>!keptKeys.has(dupeKey(f)));
        S.fixedDeposits=[...kept,...additions];
      }
    }
  }
  /* Foreign Assets (Sch FA) sheet -- the weakest-fit import of the five, flagged as
     such rather than forced: S.scheduleFA is keyed per-LOT (hold:<lotId> / event:
     <id>, one Schedule-FA row per distinct vesting), but the sheet's own rows are
     per-STOCK or per-ACCOUNT (Table "A2" = the brokerage account itself, "A3" =
     each stock overall), with no lot id and -- in this workbook -- no Acq Date
     filled in either. There is no reliable key to join on, so this does the
     best-effort match the sheet itself allows: strip a "(RSU)"/"(ESPP)" hint off
     the Institution/Entity text, match what's left against a holding name among
     this year's real scheduleFACandidates(), and only write a value when exactly
     one candidate matches -- ambiguous or unmatched rows are logged, not guessed
     onto the wrong lot (same "never guess" precedent as Phase 0's unclassified
     lots). Table "A2" (the account itself, not a specific stock) has no candidate
     shape to match at all and is skipped outright. */
  const fa=sheetRows(wb,"foreign assets");
  if(fa){
    const fah=headerIdx(fa,["institution","peak"]);
    if(fah>=0){
      const fm=colMap(fa[fah]);
      const fc={table:pick(fm,"table"),inst:pick(fm,"institution"),peak:pick(fm,"peak"),close:pick(fm,"closing")};
      ensureScheduleFAState();
      const tr=S.taxRules||TAX_RULES_DEFAULT;
      const{candidates}=scheduleFACandidates(tr);
      for(let i=fah+1;i<fa.length;i++){
        const r=fa[i]||[];
        const inst=clean(r[fc.inst]);
        if(!inst)continue;
        if(fc.table>=0&&clean(r[fc.table])==="A2")continue; // the brokerage account itself, not a specific stock -- no matching candidate shape
        const typeHint=/\(RSU\)/i.test(inst)?"RSU":/\(ESPP\)/i.test(inst)?"ESPP":null;
        const nameHint=inst.replace(/\s*\((RSU|ESPP)\)\s*$/i,"").trim().toLowerCase();
        const matches=candidates.filter(c=>{
          const lbl=c.label.toLowerCase();
          if(!nameHint||!lbl.includes(nameHint))return false;
          if(typeHint&&!lbl.includes(`(${typeHint.toLowerCase()})`))return false;
          return true;
        });
        if(matches.length===1){
          S.scheduleFA[matches[0].key]={peakValue:num(r[fc.peak])||0,closingValue:num(r[fc.close])||0};
        }else{
          console.warn(`Foreign Assets import: ${matches.length===0?"no":"ambiguous ("+matches.length+")"} match for "${inst}" -- left unset, fill in manually on the Tax tab.`);
        }
      }
    }
  }
  S.loaded=true;
}

/* ===== COMPUTE ===== */
function computeLegacy(){
  const inn={},outn={};S.accounts.forEach(a=>{inn[a.name]=0;outn[a.name]=0;});
  S.txns.forEach(x=>{if(x.to in inn)inn[x.to]+=x.amt;if(x.from in outn)outn[x.from]+=x.amt;});
  const bal={};S.accounts.forEach(a=>{bal[a.name]=a.open+inn[a.name]-outn[a.name];});
  const byKind=k=>S.accounts.filter(a=>a.kind===k).reduce((s,a)=>s+bal[a.name],0);
  // investments: securities (skip Cash class, they are broker cash / computed as plug)
  const invAccts=S.accounts.filter(a=>a.kind==="Investment").map(a=>a.name);
  const secByAcct={};invAccts.forEach(b=>secByAcct[b]=0);
  const holds=[];
  S.holdings.forEach((h,idx)=>{
    if(h.cls==="Cash")return; // broker cash handled as plug
    const inv=(h.units!=null&&h.avg!=null)?h.units*h.avg:(h.minv||0);
    const cur=(h.units!=null&&h.price!=null)?h.units*h.price:(h.mval!=null?h.mval:inv);
    const o={...h,invested:inv,current:cur,plug:false,_i:idx};
    holds.push(o);
    if(h.acct&&secByAcct[h.acct]!=null)secByAcct[h.acct]+=inv;
  });
  invAccts.forEach(b=>{const plug=bal[b]-(secByAcct[b]||0);
    if(Math.abs(plug)>=1)holds.push({cls:"Cash",type:"Broker Cash",name:b+" uninvested cash",acct:b,units:null,invested:plug,current:plug,plug:true});});
  const portInv=holds.reduce((s,h)=>s+h.invested,0),portCur=holds.reduce((s,h)=>s+h.current,0);
  const bank=byKind("Bank"),cash=byKind("Cash"),recv=byKind("Receivable"),clr=byKind("Clearing"),dep=byKind("Deposit");
  const cc=-byKind("Credit Card"),loan=-byKind("Loan");
  const curAssets=bank+cash+recv+clr,totAssets=curAssets+portCur+dep,totLiab=cc+loan,netWorth=totAssets-totLiab;
  const months=[...new Set(S.txns.map(x=>ym(x.date)).filter(Boolean))].sort();
  const sumM=pred=>{const o={};months.forEach(mn=>o[mn]=0);let t=0;S.txns.forEach(x=>{if(pred(x)){const mn=ym(x.date);if(o[mn]!=null)o[mn]+=x.amt;t+=x.amt;}});o._t=t;return o;};
  const IS={months};
  IS.rec=sumM(x=>txnType(x)==="Income"&&txnInc(x)==="Recurring");
  IS.win=sumM(x=>txnType(x)==="Income"&&txnInc(x)==="Windfall");
  IS.rev=sumM(x=>txnType(x)==="Income");
  IS.ess=sumM(x=>txnType(x)==="Expense"&&txnEss(x)==="Essential");
  IS.disc=sumM(x=>txnType(x)==="Expense"&&txnEss(x)==="Discretionary");
  IS.exp=sumM(x=>txnType(x)==="Expense");
  IS.net={_t:IS.rev._t-IS.exp._t};months.forEach(mn=>IS.net[mn]=IS.rev[mn]-IS.exp[mn]);
  const incCats=S.cats.filter(c=>c.applies==="Income"),expCats=S.cats.filter(c=>c.applies==="Expense");
  IS.incRows=incCats.map(c=>({cat:c.name,grp:c.incclass||"Other",m:sumM(x=>x.cat===c.name&&txnType(x)==="Income")}));
  IS.expRows=expCats.map(c=>({cat:c.name,grp:c.essdisc||"Other",m:sumM(x=>x.cat===c.name&&txnType(x)==="Expense")}));
  // cash flow
  const cfB=b=>S.txns.filter(x=>txnCF(x)===b).reduce((s,x)=>s+((isCash(x.to)?x.amt:0)-(isCash(x.from)?x.amt:0)),0);
  const beginCash=S.accounts.filter(a=>a.kind==="Bank"||a.kind==="Cash").reduce((s,a)=>s+a.open,0);
  const CF={begin:beginCash,op:cfB("Operating"),inv:cfB("Investing"),fin:cfB("Financing"),int:cfB("Internal")};
  CF.net=CF.op+CF.inv+CF.fin+CF.int;CF.end=CF.begin+CF.net;CF.bsCash=bank+cash;CF.chk=CF.end-CF.bsCash;
  const nM=months.length||1,avgMo=IS.exp._t/nM;
  const R={liquid:bank+cash,avgMo,runway:(bank+cash)/(avgMo||1),curRatio:totLiab?curAssets/totLiab:null,
    dNW:netWorth?totLiab/netWorth:null,dInc:IS.rev._t?totLiab/IS.rev._t:null,
    saveCore:IS.rec._t?(IS.rec._t-IS.exp._t)/IS.rec._t:null,saveAll:IS.rev._t?IS.net._t/IS.rev._t:null,
    ret:portInv?(portCur-portInv)/portInv:null,wc:curAssets-totLiab,empRecv:bal["Employer Receivable"]||0,
    reimb:S.txns.filter(x=>x.kind==="Reimbursable Spend (Claim)").reduce((s,x)=>s+x.amt,0)};
  R.dso=R.reimb?(R.empRecv/R.reimb)*365:null;
  const model={bal,byKind,holds,bank,cash,recv,clr,dep,cc,loan,curAssets,totAssets,totLiab,netWorth,portInv,portCur,IS,CF,R,months};
  model.integrity=integrityChecks(model);
  return model;
}
function compute(){
  const model=calculateLedger(S,KINDS);
  model.integrity=integrityChecks(model);
  return model;
}

/* ===== INTEGRITY CHECKS (Step 9 item 3) =====
   Only checks the app can actually verify from its own data -- no invented
   external-truth checks (bank balance vs a real statement, opening-balance
   correctness, the broker "uninvested cash" plug) since there's no independent
   source of truth anywhere in the app to compare against; see pechak-documentation.md
   §6 for the explicit list of rejected checks and why.
   Severity is 'fail' only for cf-recon (a true internal-consistency bug --
   CF.end must equal CF.bsCash by construction of double-entry cash-flow
   categorization). Every orphan-reference check is 'warn': the app already
   tolerates these states by design (removeAccount/holding-removal allow it
   with just a confirm dialog), so surfacing them is informational, not an
   emergency -- but they're real: compute() (see `if(x.to in inn)` above)
   silently excludes a deleted account's transactions from every balance,
   so money can "disappear" from the balance sheet with no other indicator. */
function integrityChecks(model){
  const out=[];
  if(Math.abs(model.CF.chk)>1)out.push({id:"cf-recon",severity:"fail",
    label:"Cash-flow statement doesn't reconcile with the balance sheet",
    detail:`Ending cash per Cash Flow is ${fmtN(model.CF.end)} but the Balance Sheet shows ${fmtN(model.CF.bsCash)} — a difference of ${fmtN(model.CF.chk)}.`});
  const acctNames=new Set((S.accounts||[]).map(a=>a.name));acctNames.add(EXT);
  const holdKey=h=>`${h.name}\u0001${h.acct||""}`;
  const holdNames=new Set((S.holdings||[]).map(holdKey));
  const orphanAccts=new Set();
  (S.txns||[]).forEach(x=>{if(!acctNames.has(x.from))orphanAccts.add(x.from);if(!acctNames.has(x.to))orphanAccts.add(x.to);});
  if(orphanAccts.size){
    const n=(S.txns||[]).filter(x=>!acctNames.has(x.from)||!acctNames.has(x.to)).length;
    out.push({id:"orphan-txn-account",severity:"warn",
      label:`${n} transaction${n===1?"":"s"} reference${n===1?"s":""} a deleted account`,
      detail:`Account(s) no longer in Settings → Accounts: ${[...orphanAccts].join(", ")}. These transactions' amounts are excluded from every account balance and the balance sheet.`});
  }
  const orphanHolds=new Set();
  (S.txns||[]).forEach(x=>{if(x.holdName&&!holdNames.has(holdKey({name:x.holdName,acct:x.holdAcct})))orphanHolds.add(x.holdName);});
  if(orphanHolds.size){
    const n=(S.txns||[]).filter(x=>x.holdName&&!holdNames.has(holdKey({name:x.holdName,acct:x.holdAcct}))).length;
    out.push({id:"orphan-txn-holding",severity:"warn",
      label:`${n} transaction${n===1?"":"s"} reference${n===1?"s":""} a deleted holding`,
      detail:`Holding(s) no longer in Investments: ${[...orphanHolds].join(", ")}.`});
  }
  const qField=(q,f)=>q[f]!=null?q[f]:(q.snapshot?q.snapshot[f]:undefined);
  const catNames=new Set((S.cats||[]).map(c=>c.name));
  const qAcctOrphan=new Set(),qCatOrphan=new Set();
  (CAP_QUEUE||[]).forEach(q=>{
    const from=qField(q,"from"),to=qField(q,"to"),cat=qField(q,"cat");
    if(from!=null&&!acctNames.has(from))qAcctOrphan.add(from);
    if(to!=null&&!acctNames.has(to))qAcctOrphan.add(to);
    if(cat&&!catNames.has(cat))qCatOrphan.add(cat);
  });
  if(qAcctOrphan.size)out.push({id:"queue-orphan-acct",severity:"warn",
    label:"A pending workbook change references a deleted account",
    detail:`Queued transaction change(s) point at: ${[...qAcctOrphan].join(", ")}. This will fail on the next workbook update unless discarded or fixed first.`});
  if(qCatOrphan.size)out.push({id:"queue-orphan-cat",severity:"warn",
    label:"A pending workbook change references a deleted category",
    detail:`Queued transaction change(s) point at: ${[...qCatOrphan].join(", ")}.`});
  const qHoldOrphan=new Set();
  (LOT_QUEUE||[]).forEach(q=>{if(q.holdName&&!holdNames.has(holdKey({name:q.holdName,acct:q.acct})))qHoldOrphan.add(q.holdName);});
  if(qHoldOrphan.size)out.push({id:"queue-orphan-hold",severity:"warn",
    label:"A pending workbook lot change references a deleted holding",
    detail:`Queued lot change(s) point at: ${[...qHoldOrphan].join(", ")}. This will fail on the next workbook update unless discarded or fixed first.`});
  return out;
}

/* ===== SYNC REMINDER =====
   Soft, dismissible nudge -- not an error, so it never uses the red storage-warn
   styling or its z-index. Shows only when BOTH are true: at least SYNC_REMIND_DAYS
   have passed since the last successful Sync to Excel / Export (S.lastSyncedAt,
   set in capDoMerge), AND there's actually something queued to lose if this
   browser's storage gets evicted. A user who's never synced but also has nothing
   queued yet (fresh wizard install, no data entered) correctly sees nothing.
   Dismissing hides it for the rest of this session only (in-memory, not persisted)
   -- reappears next load if still overdue, rather than being silenced forever from
   one click. Suppressed entirely while the storage-warning banner is up, since
   that's the more urgent condition and the two banners would otherwise overlap
   (both are position:fixed at the top). */
const SYNC_REMIND_DAYS=2;
let syncRemindDismissed=false;
function totalPendingCount(){return CAP_QUEUE.length+CAT_QUEUE.length+ACCT_QUEUE.length+HOLD_QUEUE.length+LOT_QUEUE.length+BUD_QUEUE.length+DED_QUEUE.length+PAY_QUEUE.length+CG_QUEUE.length+TR_QUEUE.length+FD_QUEUE.length+MS_QUEUE.length;}
function checkSyncReminder(){
  const el=$("#syncRemindBanner");
  if(!el)return;
  if(storageAdapter.isWarned()||syncRemindDismissed){el.classList.remove("show");return;}
  const pending=totalPendingCount();
  if(!pending){el.classList.remove("show");return;}
  const days=S.lastSyncedAt?(Date.now()-new Date(S.lastSyncedAt).getTime())/86400000:Infinity;
  if(days<SYNC_REMIND_DAYS){el.classList.remove("show");return;}
  const dayTxt=S.lastSyncedAt?`${Math.floor(days)} day${Math.floor(days)===1?"":"s"} since your last workbook update`:"You haven't updated a workbook yet";
  $("#syncRemindText").textContent=`${dayTxt} \u2014 ${pending} change${pending===1?"":"s"} pending.`;
  el.classList.add("show");
}

function renderPlanHub(){
  const el=$("#v-plan");if(!el)return;
  const pendingBudget=(S.budget||[]).length;

let lastCalculatedAt=null;
const explainLink=key=>`<button class="explain-link" data-explain="${key}" onclick="openExplanation('${key}')">How is this calculated?</button>`;

function explanationFor(key){

    netWorth:{title:"Net worth",sources:`${S.accounts.length} accounts and ${S.holdings.length} holdings`,formula:"Total assets minus credit-card and loan liabilities.",exclusions:"Transactions referencing deleted accounts are excluded and surfaced under Needs Attention.",route:"statements"},
    income:{title:"Income",sources:`${S.txns.filter(x=>txnType(x)==="Income").length} income transactions`,formula:"Sum of tracked income transactions in the selected Overview period.",exclusions:"Transfers and investment sales are not income.",route:"txns"},
    spending:{title:"Spending",sources:`${S.txns.filter(x=>txnType(x)==="Expense").length} expense transactions`,formula:"Sum of tracked expense transactions in the selected period.",exclusions:"Transfers, investments and debt settlements are excluded.",route:"txns"},

    fdInterest:{title:"Fixed-deposit interest",sources:`${(S.fixedDeposits||[]).length} fixed deposits`,formula:"Accrued inside the active financial year. Cumulative deposits use the workbook's 30/360 compounding convention; payout deposits use simple actual-days/365.",exclusions:"Accrual outside the deposit term or active FY is excluded.",route:"invest"},
    budgetVariance:{title:"Budget variance",sources:`${(S.budget||[]).length} budget lines and tracked expenses`,formula:"Actual category spending minus the monthly plan for the selected month; Average/month excludes the in-progress current month.",exclusions:"Transactions without a matching expense category do not enter a budget line.",route:"budget"},
    statements:{title:"Financial statements",sources:`${S.txns.length} transactions, ${S.accounts.length} accounts and ${S.holdings.length} holdings`,formula:"Income Statement groups income/expenses; Balance Sheet uses opening balances plus ledger movements; Cash Flow groups cash movements by activity.",exclusions:"Orphan account references are excluded from account balances and shown under Needs Attention.",route:"txns"},

function periodFlows(sel){const IS=M.IS;const g=o=>sel==="All"?o._t:(o[sel]||0);
  const rec=g(IS.rec),rev=g(IS.rev),exp=g(IS.exp),ess=g(IS.ess),disc=g(IS.disc),net=g(IS.net),win=g(IS.win);
  return {rec,rev,exp,ess,disc,net,win,saveCore:rec?(rec-exp)/rec:null,saveAll:rev?net/rev:null};}
// Shared between insights() (Overview) and renderNeedsAttention() so the two
// views can't drift apart -- both ask "which categories ran over budget in
// the given month", not renderBudget()'s own separate, user-selectable-period table.
function budgetOverageRows(month){
  if(!S.budget||!S.budget.length||!month)return[];
  const IS=M.IS;
  return S.budget.map(b=>{const er=IS.expRows.find(r=>r.cat===b.cat);const a=er?(er.m[month]||0):0;return{cat:b.cat,over:a-b.monthly,b:b.monthly,a};}).filter(x=>x.b>0&&x.over>0.1*x.b).sort((a,b)=>b.over-a.over);
}
function insights(){
  const IS=M.IS,m=IS.months,curM=ym(new Date()),out=[];
  const comp=m.filter(x=>x!==curM);
  if(comp.length>=2){
    const last=comp[comp.length-1],prior=comp.slice(0,-1);
    const pavg=obj=>mean(prior.map(x=>obj[x]||0));
    const mv=IS.expRows.map(r=>{const a=pavg(r.m),v=r.m[last]||0;return{cat:r.cat,v,a,d:v-a,pct:a?(v-a)/a:(v>0?1:0)};}).filter(x=>x.a>=1000||x.v>=1000);
    mv.sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
    mv.slice(0,3).forEach(x=>{if(Math.abs(x.d)>=1000&&Math.abs(x.pct)>=0.15)out.push({t:`<b>${x.cat}</b> ${x.pct>0?"up":"down"} ${Math.abs(Math.round(x.pct*100))}% in ${last} &mdash; ${fmtN(x.v)} vs ${fmtN(x.a)} avg`,tone:x.pct>0?"neg":"pos"});});
    const sr=x=>IS.rec[x]?((IS.rec[x]-IS.exp[x])/IS.rec[x]):null;
    const srL=sr(last),prSr=prior.map(sr).filter(v=>v!=null),srA=mean(prSr);
    if(srL!=null&&prSr.length&&Math.abs(srL-srA)>=0.05)out.push({t:`Core savings rate ${srL>srA?"rose":"fell"} to <b>${(srL*100).toFixed(0)}%</b> in ${last} (avg ${(srA*100).toFixed(0)}%)`,tone:srL>=srA?"pos":"neg"});
    const top=IS.expRows.map(r=>({cat:r.cat,v:r.m[last]||0})).sort((a,b)=>b.v-a.v)[0];
    if(top&&top.v>0)out.push({t:`Biggest spend in ${last}: <b>${top.cat}</b> at ${fmtN(top.v)}`,tone:"neutral"});
    budgetOverageRows(last).slice(0,2).forEach(x=>out.push({t:`Over budget on <b>${x.cat}</b> in ${last} by ${fmtN(x.over)} (${fmtN(x.a)} vs ${fmtN(x.b)} plan)`,tone:"warn"}));
    if((IS.win[last]||0)>0)out.push({t:`Windfall income of <b>${fmtN(IS.win[last])}</b> landed in ${last}`,tone:"pos"});
  }
  const er=M.bal["Employer Receivable"]||0;if(er>1000)out.push({t:`<b>${fmtN(er)}</b> in reimbursements still owed to you`,tone:"warn"});
  if(M.portInv>0){const g=(M.portCur-M.portInv)/M.portInv;out.push({t:`Portfolio ${g>=0?"up":"down"} <b>${Math.abs(g*100).toFixed(0)}%</b> vs cost &mdash; ${fmtN(M.portCur-M.portInv)} unrealised`,tone:g>=0?"pos":"neg"});}
  if(M.R.runway)out.push({t:`Emergency runway: <b>${M.R.runway.toFixed(1)} months</b> covered by liquid assets`,tone:M.R.runway>=6?"pos":"warn"});
  return out.slice(0,7);
}

function topCats(sel){const g=o=>sel==="All"?o._t:(o[sel]||0);
  const rows=M.IS.expRows.map(r=>({cat:r.cat,v:g(r.m)})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v).slice(0,7);
  const max=rows[0]?rows[0].v:1;
  return `<table><tbody>${rows.map(r=>`<tr><td>${r.cat}</td><td style="width:45%"><div class="bar"><i style="width:${Math.max(3,100*r.v/max)}%"></i></div></td><td class="n">${fmtN(r.v)}</td></tr>`).join("")}</tbody></table>`;}
function signals(){const R=M.R,s=[];
  s.push(["Emergency runway",R.runway?R.runway.toFixed(1)+" months":"&ndash;",R.runway>=6?"pos":"warn"]);
  s.push(["Unclaimed reimbursements",fmtN(R.empRecv),R.empRecv>0?"warn":""]);
  s.push(["Splitwise net",fmtN(M.bal["Splitwise"]||0),(M.bal["Splitwise"]||0)<0?"neg":""]);
  s.push(["Transfers clearing",fmtN(M.clr),Math.abs(M.clr)>1?"warn":"pos"]);
  s.push(["Debt to net worth",R.dNW!=null?R.dNW.toFixed(2)+"&times;":"&ndash;",R.dNW>1?"neg":""]);
  return `<table><tbody>${s.map(x=>`<tr><td>${x[0]}</td><td class="n ${x[2]}">${x[1]}</td></tr>`).join("")}</tbody></table>`;}

/* ===== NEEDS ATTENTION (Step 9 item 4) =====
   Aggregates everything that already needs a decision, in one place, rather than
   inventing new detection logic -- every item here reuses a computation that
   already exists elsewhere (M.integrity from compute(), budgetOverageRows()
   shared with insights(), and the same small tax pipeline renderTax() runs for
   Schedule AL/FA and TDS-likely). insights() itself (Overview) stays separate --
   that's trend/informational commentary, not an action item. */
function renderNeedsAttention(){
  const el=$("#v-needsattn");if(!el)return;
  const items=[];
  (M.integrity||[]).forEach(c=>items.push({severity:c.severity,label:c.label,detail:c.detail}));
  const IS=M.IS,mo=IS.months,curM=ym(new Date());
  const comp=mo.filter(x=>x!==curM);
  const last=comp.length?comp[comp.length-1]:null;
  budgetOverageRows(last).forEach(x=>items.push({severity:"warn",label:`Over budget on ${x.cat}`,
    detail:`${last}: ${fmtN(x.a)} vs ${fmtN(x.b)} plan (over by ${fmtN(x.over)})`,action:"budget"}));
  try{
    const tr=taxRules();
    const income=taxIncomeHeads();
    const cg=capGainsBreakdown();
    if(cg.excluded.length)items.push({severity:"warn",
      label:`${cg.excluded.length} capital-gains sale event${cg.excluded.length===1?"":"s"} excluded from computed totals`,
      detail:"Undated/uncosted lot history — see Capital Gains tab.",action:"capgains"});
    const nw=computeTaxRegime("new",income),old=computeTaxRegime("old",income);
    const nwS=computeSurcharge(nw,income,cg),oldS=computeSurcharge(old,income,cg);
    const recNew=nwS.grandTotal<=oldS.grandTotal;
    const regimeMode=S.taxSettings.regimeMode||"auto";
    const chosenRegime=regimeMode==="manual"?(S.taxSettings.regimeManual||"new"):(recNew?"new":"old");
    const chosenS=chosenRegime==="new"?nwS:oldS;
    const alThreshold=tr.alThreshold||TAX_RULES_DEFAULT.alThreshold;
    if(chosenS.totalIncomeForSurcharge>alThreshold)items.push({severity:"warn",label:"Schedule AL required this FY",
      detail:`Total income ${fmtN(chosenS.totalIncomeForSurcharge)} exceeds the ${fmtN(alThreshold)} threshold.`,action:"tax"});
    const fa=scheduleFACandidates(tr);
    if(fa.length)items.push({severity:"warn",label:`${fa.length} Schedule FA candidate${fa.length===1?"":"s"} to review`,
      detail:"Foreign-asset holdings (RSU/ESPP) vested within the relevant calendar year.",action:"tax"});
    const fdBk=fixedDepositsBreakdown(tr);
    const tdsN=fdBk.rows.filter(r=>r.tdsLikely).length;
    if(tdsN)items.push({severity:"warn",label:`${tdsN} fixed deposit${tdsN===1?"":"s"} likely have TDS due this FY`,
      detail:"Over the Sec 194A threshold — see Investments → Fixed Deposits.",action:"invest"});
  }catch(e){console.error("renderNeedsAttention: tax-check block failed",e);}
  if(S.targetMix&&S.plan){
    const cur=curMixVals(),cp=pctOf(cur),tol=S.plan.tol||2;
    const outCount=CLS_ORDER.filter(c=>cp._tot&&Math.abs(cp[c]-(+S.targetMix[c]||0))>tol).length;
    if(outCount)items.push({severity:"warn",label:`${outCount} asset class${outCount===1?"":"es"} outside target allocation`,
      detail:`Past ±${tol}pp drift — see Investments → Allocation.`,action:"invest"});
  }
  if(!items.length){el.innerHTML=`<div class="card">${okbox("Nothing needs your attention right now.")}</div>`;return;}
  const box=(it,i)=>{
    const btn=it.action?`<button class="btn sm" style="margin-top:8px" data-goto="${it.action}" data-idx="${i}">Review</button>`:"";
    const body=`<b>${it.severity==="fail"?"Integrity check failed: ":""}${esc(it.label)}</b>${it.detail?`<br><span style="font-size:12px">${esc(it.detail)}</span>`:""}${btn}`;
    return warnbox(body);
  };
  el.innerHTML=`<div class="card"><h3>Needs Attention</h3><div style="display:flex;flex-direction:column;gap:10px">${items.map(box).join("")}</div></div>`;
  $$("#v-needsattn [data-goto]").forEach(b=>b.onclick=()=>goToView(b.dataset.goto));
}

function renderTxns(){

  $("#v-txns").innerHTML=`<div class="card" style="margin-bottom:16px"><h3 id="formTitle">Add a transaction</h3>

    <div class="form">

  const upd=()=>{const q=($("#q").value||"").toLowerCase(),ft=$("#fType").value,fa=$("#fAcct").value,d1=$("#fFrom").value,d2=$("#fTo").value;
    const rows=S.txns.map((x,i)=>({x,i})).filter(({x})=>{
      if(ft&&txnType(x)!==ft)return false;if(fa&&x.from!==fa&&x.to!==fa)return false;
      const d=dstr(x.date);if(d1&&d<d1)return false;if(d2&&d>d2)return false;
      if(q&&!(`${x.com} ${x.cat} ${x.kind} ${x.sub}`.toLowerCase().includes(q)))return false;return true;})
      .sort((a,b)=>String(b.x.date).localeCompare(String(a.x.date)));
    $("#txnCount").textContent=rows.length+" shown of "+S.txns.length;
    $("#txnBody").innerHTML=rows.slice(0,500).map(({x,i})=>{const ck=checkTxn(x),t=txnType(x);
      return `<tr><td class="mono">${dstr(x.date)}${x.capId?' <span class="chip" style="color:var(--accent)" title="Not yet merged into the workbook">&#8226; queued</span>':""}</td>
      <td>${x.kind}${x.com?`<div class="muted" style="font-size:11px">${x.com}</div>`:""}</td>
      <td><span class="muted">${x.from}</span> &rarr; ${x.to}</td>

      <td class="n ${t==='Income'?'pos':t==='Expense'?'neg':''}">${fmtN(x.amt)}</td>
      <td>${ck.ok?'<span class="chip" style="color:var(--pos)">OK</span>':'<span class="chip" style="color:var(--neg)">'+ck.msg+'</span>'}</td>
      <td style="white-space:nowrap"><span class="act" data-dup="${i}" title="Duplicate and edit">&#10697;</span><span class="act" data-edit="${i}" title="Edit">&#9998;</span><span class="act del" data-del="${i}" title="Delete">&#10005;</span></td></tr>`;}).join("");
    $$("#txnBody [data-del]").forEach(b=>b.onclick=async ()=>{if(await capConfirm("Delete this transaction?")){const x=S.txns[+b.dataset.del];capQueueDeleteForTxn(x);S.txns.splice(+b.dataset.del,1);persist();render();}});
    $$("#txnBody [data-dup]").forEach(b=>b.onclick=()=>{capSeed={...S.txns[+b.dataset.dup],date:capToday(),com:S.txns[+b.dataset.dup].com||""};openAddOverlay("Duplicate transaction");});
    $$("#txnBody [data-edit]").forEach(b=>b.onclick=()=>loadEdit(+b.dataset.edit));};
  ["q","fType","fAcct","fFrom","fTo"].forEach(id=>$("#"+id).oninput=upd);
  $("#fClear").onclick=()=>{["q","fType","fAcct","fFrom","fTo"].forEach(id=>$("#"+id).value="");upd();};
  upd();
  const subsForCat=(cat)=>{const set=new Set((S.subcats&&S.subcats[cat])||[]);S.txns.forEach(x=>{if(x.cat===cat&&x.sub)set.add(x.sub);});return [...set].sort((a,b)=>a.localeCompare(b));};
  const fillSubs=(cur)=>{const cat=$("#f_cat").value;const subs=[...new Set([...subsForCat(cat),cur].filter(Boolean))];$("#f_sub").innerHTML='<option value=""></option>'+subs.map(s=>`<option ${s===cur?"selected":""}>${s}</option>`).join("");};
  fillSubs();
  const liveCheck=()=>{const x=formTxn(),ck=checkTxn(x),el=$("#f_check");el.className="check "+(ck.ok?"ok":"bad");
    el.innerHTML=ck.ok?"&#10003; Valid &mdash; "+txnType(x)+", cash-flow: "+txnCF(x):"&#9888; "+ck.msg;};

  /* ---- Holding link, from the Transactions tab's own edit form -----------------
     This is the general "edit any transaction" surface (pencil icon in the table
     above), unlike the Add-overlay's holdSection which only ever runs once, at
     first save. A transaction that was logged without a holding link (the "just
     cash" skip was ticked, or it predates Phase 0 entirely) can now be backfilled
     with one here -- but only once: if x.holdName is already set, linking is
     locked (read-only note, no re-link control) so we never re-apply
     applyHoldingTxn() against a transaction that already fed a lot/event, which
     would double-count it. This mirrors the Add-overlay's holding section closely
     (same holdDirection/holdRequired/applyHoldingTxn plumbing, same fx fields for
     RSU/ESPP) but reads/writes f_hold_* ids instead of c_hold_*, since the two
     forms are otherwise fully independent already (see formTxn vs capFormVal). */
  const fHoldOpts=(acct)=>(S.holdings||[]).map((h,i)=>({h,i})).filter(o=>o.h.acct===acct);
  function renderFHoldSection(){
    const box=$("#f_holdSection");if(!box)return;
    const x={kind:$("#f_kind").value,from:$("#f_from").value,to:$("#f_to").value};
    const info=holdDirection(x);
    if(!info){box.innerHTML="";return;}
    const prev=editIx>=0?S.txns[editIx]:null;
    if(prev&&prev.holdName){
      box.innerHTML=`<div class="check" style="margin-top:13px">Linked to <b>${esc(prev.holdName)}</b> in ${esc(prev.holdAcct||info.acct)} \u2014 set once, when this transaction was first saved. Can't be relinked here (avoids double-counting the lot/capital-gains event it already created).</div>`;
      return;
    }
    const req=holdRequired(x);
    const opts=fHoldOpts(info.acct);
    const dirLabel=info.dir==="acquire"?"acquired":"reduced";
    box.innerHTML=`<div class="form" style="grid-template-columns:1fr 1fr;margin-top:13px;padding-top:13px;border-top:1px dashed var(--line2)">
      ${prev?`<div class="field wide muted" style="font-size:11.5px">This transaction wasn't linked to a holding when it was originally saved \u2014 link it now to include it in Capital Gains.</div>`:""}
      ${req?"":`<div class="field wide"><label><input type="checkbox" id="f_hold_skip"${prev?" checked":""}> Just cash \u2014 don't record a holding change</label></div>`}
      <div class="field wide" id="f_hold_selwrap"><label>Which holding is being ${dirLabel} in ${esc(info.acct)}?</label>
        <select id="f_hold_sel">${opts.map(o=>`<option value="${o.i}">${esc(o.h.name)}</option>`).join("")}${info.dir==="acquire"?'<option value="__new__">+ New holding</option>':""}</select>
      </div>
      <div class="field wide" id="f_hold_newwrap" style="display:none">
        <div class="form" style="grid-template-columns:1fr 1fr">
          <div class="field"><label>Tracks by units?</label><select id="f_hold_unitsmode"><option value="yes">Yes \u2014 stock / MF / ETF</option><option value="no">No \u2014 FD / deposit-style</option></select></div>
          <div class="field"><label>Asset class</label><select id="f_hold_cls">${capOpt(["Equity","Debt","Gold","Cash","Other"])}</select></div>
          <div class="field"><label>Instrument type</label><select id="f_hold_type">${instrumentTypeOpts()}</select></div>
          <div class="field" id="f_hold_mfcatwrap" style="display:none"><label>Fund category (equity/debt)</label><select id="f_hold_mfcat"><option value="">\u2014 not set \u2014</option>${capOpt(MF_CATEGORIES)}</select></div>
          <div class="field"><label>Symbol / scheme code (optional)</label><input id="f_hold_symbol" placeholder="RELIANCE.NS or AMFI code"></div>
          <div class="field"><label>Name</label><input id="f_hold_name"></div>
        </div>
      </div>
      <div class="field" id="f_hold_unitswrap"><label>Units</label><input class="mono" id="f_hold_units" type="number"></div>
      <div class="field" id="f_hold_pricewrap"><label>Price/unit (auto)</label><input class="mono" id="f_hold_price" readonly></div>
      <div class="field wide" id="f_hold_fxwrap" style="display:none">
        <div class="form" style="grid-template-columns:1fr 1fr">
          <div class="field"><label>Foreign currency (optional \u2014 for capital-gains tax)</label><select id="f_hold_fxccy">${capOpt(FX_CURRENCIES,"USD")}</select></div>
          <div class="field"><label>Amount in that currency (total, this ${info.dir==="acquire"?"buy":"sale"})</label><input class="mono" id="f_hold_fxamt" type="number" step="0.01" placeholder="leave blank to skip"></div>
        </div>
      </div>
    </div>`;
    const selWrap=$("#f_hold_selwrap"),newWrap=$("#f_hold_newwrap"),unitsWrap=$("#f_hold_unitswrap"),priceWrap=$("#f_hold_pricewrap"),fxWrap=$("#f_hold_fxwrap"),mfcatWrap=$("#f_hold_mfcatwrap"),skip=$("#f_hold_skip");
    const isNew=()=>$("#f_hold_sel")&&$("#f_hold_sel").value==="__new__";
    const isUnitsBased=()=>{
      if(isNew())return $("#f_hold_unitsmode").value==="yes";
      const sel=$("#f_hold_sel");
      if(!sel||sel.value==="")return true;
      const h=S.holdings[+sel.value];
      return h&&h.units!=null;
    };
    const effectiveType=()=>{
      if(isNew())return $("#f_hold_type")?$("#f_hold_type").value:"";
      const sel=$("#f_hold_sel");
      if(!sel||sel.value==="")return "";
      const h=S.holdings[+sel.value];
      return h&&h.type||"";
    };
    const isFxType=()=>["RSU","ESPP"].includes(effectiveType());
    const isMfTypeNow=()=>isNew()&&MF_TYPES.includes(effectiveType());
    const syncVisibility=()=>{
      const skipped=skip&&skip.checked;
      [selWrap,newWrap,unitsWrap,priceWrap,fxWrap,mfcatWrap].forEach(el=>el&&el.classList.toggle("muted",!!skipped));
      $$("#f_holdSection input,#f_holdSection select").forEach(el=>{if(el.id!=="f_hold_skip")el.disabled=!!skipped;});

      priceWrap.style.display=ub?"":"none";

      updatePrice();

    if($("#f_hold_type"))$("#f_hold_type").onchange=syncVisibility;

  }
  renderFHoldSection();
  $("#f_kind").addEventListener("change",renderFHoldSection);
  $("#f_from").addEventListener("change",renderFHoldSection);

const CAP_K_QUEUE="cap_queue_v1",CAP_K_ARCH="cap_archives_v1",CAP_K_META="cap_meta_v1",CAT_K_QUEUE="cat_queue_v1",ACCT_K_QUEUE="acct_queue_v1",HOLD_K_QUEUE="hold_queue_v1",BUD_K_QUEUE="bud_queue_v1",LOT_K_QUEUE="lot_queue_v1",DED_K_QUEUE="ded_queue_v1",PAY_K_QUEUE="pay_queue_v1",CG_K_QUEUE="cg_queue_v1",TR_K_QUEUE="tr_queue_v1",FD_K_QUEUE="fd_queue_v1",MS_K_QUEUE="ms_queue_v1";

function capUid(){return "e"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function capFmtN(n){const s=Math.abs(n).toLocaleString("en-IN",{maximumFractionDigits:2});return (n<0?"\u2212":"")+"\u20b9"+s;}

function capOpt(arr,sel){return arr.map(v=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(v)}</option>`).join("");}
// Real instrument-type values actually seen in this workbook's Investments sheet,
// not a guessed list -- Stock through Broker Cash are all in real use; Other is the

// drops an existing holding's type just because it predates this list or was typed

const INSTRUMENT_TYPES=["Stock","Mutual Fund","Index Fund","ELSS","ETF","RSU","ESPP","FD","PPF","EPF","NPS","SGB","Digital Gold","Broker Cash","Other"];
/* Phase 3b: currencies the FX-rate table (S.fxRates) and the Add-transaction
   overlay's foreign-currency fields support. RSU/ESPP grants are almost
   always USD; EUR/GBP included for the occasional EquatePlus/UK-listed

const FX_CURRENCIES=["USD","EUR","GBP"];
/* Mutual Fund tax classification -- three categories (Equity-oriented, Debt/
   specified, Other/hybrid), matching real law's split by a fund's own equity
   allocation (Section 50AA + the 2024 Budget), not the type name alone.

const MF_CATEGORIES=["Equity","Debt","Other"];

  const list=(sel&&!INSTRUMENT_TYPES.includes(sel))?[sel,...INSTRUMENT_TYPES]:INSTRUMENT_TYPES;

/* ---- Category / Sub-category management ----
   Mutates S.cats/S.subcats immediately (so every dropdown in the app reflects the
   change right away) and separately queues the same action in CAT_QUEUE so the next
   next Sync to Excel can write it into the workbook's Lists-sheet buffer (see the
   Category Master / Sub-category Buffer set up starting column AL). Removing a
   category or sub-category never touches transactions that already used it — it only
   affects what's offered going forward. */
function catQueue(action,data){
  CAT_QUEUE.push({id:capUid(),action,createdAt:new Date().toISOString(),...data});
  catPersistQueue();
}
function catUsageCount(cat,sub){
  return S.txns.filter(x=>x.cat===cat&&(sub===undefined||x.sub===sub)).length;
}
function addCategory(data){
  if(!data.name||!data.name.trim())return toast("Enter a category name");
  const name=data.name.trim();
  if((S.cats||[]).some(c=>c.name.toLowerCase()===name.toLowerCase()))return toast("That category already exists");
  S.cats=[...(S.cats||[]),{name,applies:data.applies,fixvar:data.fixvar||"",essdisc:data.essdisc||"",incclass:data.incclass||""}];
  S.subcats=S.subcats||{};S.subcats[name]=[];
  catQueue("addCat",{name,applies:data.applies,fixvar:data.fixvar||"",essdisc:data.essdisc||"",incclass:data.incclass||""});
  persist();toast("Category added");renderCapCats();
}
function editCategory(oldName,data){
  const i=(S.cats||[]).findIndex(c=>c.name===oldName);
  if(i<0)return;
  const name=(data.name||oldName).trim();
  S.cats[i]={name,applies:data.applies,fixvar:data.fixvar||"",essdisc:data.essdisc||"",incclass:data.incclass||""};
  if(name!==oldName){
    S.subcats=S.subcats||{};S.subcats[name]=S.subcats[oldName]||[];delete S.subcats[oldName];
    // keep any not-yet-merged sub-category queue items pointed at the right (new) category name
    CAT_QUEUE.forEach(q=>{if(q.cat===oldName)q.cat=name;});
  }
  catQueue("editCat",{oldName,name,applies:data.applies,fixvar:data.fixvar||"",essdisc:data.essdisc||"",incclass:data.incclass||""});
  persist();toast("Category updated");renderCapCats();
}

/* ---- Account management ----
   Same philosophy as Categories: mutates S.accounts immediately (every dropdown in
   the app reflects the change right away) and separately queues the action in

}
function acctUsageCount(name){
