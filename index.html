function capDownload(name,bytes,type){documentAdapter.downloadFile(name,bytes,type);}
/* Attribute-order independent by design: a hand-crafted workbook (this app's
   original template) and one that's been through openpyxl (or LibreOffice,
   or Excel itself after a save) don't write the same attribute order on
   <sheet>/<definedName> tags -- openpyxl, for example, inserts state="..."
   between sheetId and r:id, and hidden=/function=/vbProcedure= BEFORE name=
   on every <definedName>. A regex expecting one fixed order breaks the
   moment the file has been resaved by anything other than its original
   creator, which is exactly the kind of "still works after a normal Excel
   edit" resilience a real merge path needs. Matching on "the attribute
   we want appears somewhere in this tag" instead of "in this exact
   position" costs nothing and survives every one of those re-saves. */
function capFindSheetPath(zip,sheetName){
  const wbXml=new TextDecoder().decode(zip["xl/workbook.xml"]);
  const relsXml=new TextDecoder().decode(zip["xl/_rels/workbook.xml.rels"]);
  // sheetName must be XML-encoded before matching -- raw XML stores "&" as
  // "&amp;" etc, so a sheet name like "Read Me & Rules" would never match
  // without this (this was a real, dormant bug: nothing called this with a
  // sheet name containing an XML-special character until Model Settings did).
  const xmlEncoded=sheetName.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const escN=xmlEncoded.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const tagM=wbXml.match(new RegExp(`<sheet(?=[^>]*\\sname="${escN}")[^>]*/>`));
  if(!tagM)return null;
  const ridM=tagM[0].match(/r:id="(rId\d+)"/);
  if(!ridM)return null;
  const rm=relsXml.match(new RegExp(`<Relationship Id="${ridM[1]}"[^>]*Target="([^"]+)"`));
  if(!rm)return null;
  return "xl/"+rm[1];
}
const CAP_FIRST_DATA_ROW=8;
function capFindBlankRows(sheetXml){
  const re=/<c r="G(\d+)" s="\d+"\/>/g,rows=[];let m;
  while((m=re.exec(sheetXml))){const r=parseInt(m[1],10);if(r>=CAP_FIRST_DATA_ROW)rows.push(r);}
  rows.sort((a,b)=>a-b);
  return rows;
}
/* ---- Transactions buffer auto-extend ----
   Blank buffer rows aren't plain styled cells: columns A,E,F,H,Q-X carry live
   shared formulas (Type/Cash-Flow/date-derived fields computed off Txn Kind).
   Extending means cloning the exact XML of the current last real row -- whatever
   formulas, styles and shared-formula group it belongs to -- for each new row, and
   bumping that shared-formula group's own ref= end so Excel keeps recognizing every
   new row as part of the same group rather than an orphaned reference. Only ever
   appends past the sheet's own last row; there's nothing below it to collide with. */
function txnLastRow(sheetXml){
  const dm=sheetXml.match(/<dimension ref="[A-Z]+\d+:[A-Z]+(\d+)"\/>/);
  if(!dm)throw new Error("Couldn't read the Transactions sheet's dimension to find its last row.");
  return +dm[1];
}
function txnExtendBuffer(sheetXml,batch){
  const lastRow=txnLastRow(sheetXml);
  const rowRe=new RegExp(`<row r="${lastRow}"[^>]*>[\\s\\S]*?</row>`);
  const rowMatch=sheetXml.match(rowRe);
  if(!rowMatch)throw new Error(`Couldn't find row ${lastRow} in the Transactions sheet to use as the buffer-extend template.`);
  const templateRow=rowMatch[0];
  const newLast=lastRow+batch;
  // bump every shared-formula group's own ref= end from lastRow to newLast (e.g.
  // ref="A2456:A2500" -> ref="A2456:A3000") so the new rows stay in-group.
  let newXml=sheetXml.replace(new RegExp(`ref="([A-Z]+\\d+:[A-Z]+)${lastRow}"`,"g"),(_,pfx)=>`ref="${pfx}${newLast}"`);
  const newRows=[];
  for(let r=lastRow+1;r<=newLast;r++){
    // only substitute inside r="..." attributes (both <row r="N" and <c r="COLN"),
    // never touch style/shared-formula-index digits that might coincidentally match.
    newRows.push(templateRow.replace(new RegExp(`r="([A-Z]*)${lastRow}"`,"g"),(_,letters)=>`r="${letters}${r}"`));
  }
  newXml=newXml.replace("</sheetData>",newRows.join("")+"</sheetData>");
  newXml=xmlBumpDimensionRow(newXml,newLast);
  return{sheetXml:newXml,newLast};
}
/* Generic cell writer: works whether the target cell is currently blank, numeric, or
   text — unlike the old blank-only setters, this can overwrite or clear real data.
   That's necessary for update/delete actions on rows that already exist in the file;
   'add' actions still only ever target rows confirmed blank by capFindBlankRows first. */
function capSetCell(xml,col,row,kind,val){
  const re=new RegExp(`<c r="${col}${row}"[^>]*?(?:/>|>[\\s\\S]*?</c>)`);
  const m=xml.match(re);
  if(!m)throw new Error(`Expected to find cell ${col}${row} but couldn't \u2014 this file's layout doesn't match what this tool expects.`);
  const sm=m[0].match(/ s="(\d+)"/);
  const s=sm?sm[1]:"0";
  let repl;
  if(kind==="blank")repl=`<c r="${col}${row}" s="${s}"/>`;
  else if(kind==="num")repl=`<c r="${col}${row}" s="${s}"><v>${val}</v></c>`;
  else repl=`<c r="${col}${row}" s="${s}" t="inlineStr"><is><t>${esc(val)}</t></is></c>`;
  return xml.replace(m[0],repl);
}
/* Bumps a sheet's own <dimension> row-end if a buffer extension pushed real
   content past it. Never shrinks it, and leaves the column bounds untouched. */
function xmlBumpDimensionRow(sheetXml,newLastRow){
  const m=sheetXml.match(/<dimension ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"/);
  if(!m)return sheetXml;
  const[,c1,r1,c2,r2]=m;
  if(+r2>=newLastRow)return sheetXml;
  return sheetXml.replace(m[0],`<dimension ref="${c1}${r1}:${c2}${newLastRow}"`);
}
function capWriteAddRow(sheetXml,row,x){
  const d=new Date(x.date+"T00:00:00");
  sheetXml=capSetCell(sheetXml,"B",row,"num",d.getDate());
  sheetXml=capSetCell(sheetXml,"C",row,"num",d.getMonth()+1);
  sheetXml=capSetCell(sheetXml,"D",row,"num",d.getFullYear());
  sheetXml=capSetCell(sheetXml,"G",row,"str",x.kind);
  sheetXml=capSetCell(sheetXml,"I",row,"str",x.from);
  sheetXml=capSetCell(sheetXml,"J",row,"str",x.to);
  sheetXml=capSetCell(sheetXml,"K",row,"num",x.amt);
  if(x.cat)sheetXml=capSetCell(sheetXml,"L",row,"str",x.cat);
  if(x.sub)sheetXml=capSetCell(sheetXml,"M",row,"str",x.sub);
  if(x.com)sheetXml=capSetCell(sheetXml,"P",row,"str",x.com);
  return sheetXml;
}
function capWriteUpdateRow(sheetXml,row,x){
  // unlike add, every field is written explicitly (including blanking ones now empty) —
  // an update target may already hold different real values that must be overwritten, not skipped.
  const d=new Date(x.date+"T00:00:00");
  sheetXml=capSetCell(sheetXml,"B",row,"num",d.getDate());
  sheetXml=capSetCell(sheetXml,"C",row,"num",d.getMonth()+1);
  sheetXml=capSetCell(sheetXml,"D",row,"num",d.getFullYear());
  sheetXml=capSetCell(sheetXml,"G",row,"str",x.kind);
  sheetXml=capSetCell(sheetXml,"I",row,"str",x.from);
  sheetXml=capSetCell(sheetXml,"J",row,"str",x.to);
  sheetXml=capSetCell(sheetXml,"K",row,"num",x.amt);
  sheetXml=capSetCell(sheetXml,"L",row,x.cat?"str":"blank",x.cat||null);
  sheetXml=capSetCell(sheetXml,"M",row,x.sub?"str":"blank",x.sub||null);
  sheetXml=capSetCell(sheetXml,"P",row,x.com?"str":"blank",x.com||null);
  return sheetXml;
}
function capClearRow(sheetXml,row){
  // vacates a row entirely — it becomes indistinguishable from a fresh buffer row,
  // and so becomes available again the next time capFindBlankRows looks for one.
  ["B","C","D","G","I","J","K","L","M","N","O","P"].forEach(col=>{sheetXml=capSetCell(sheetXml,col,row,"blank",null);});
  return sheetXml;
}
function capAppendChangeLogRow(clXml,summary){
  const rowNums=[...clXml.matchAll(/<row r="(\d+)"/g)].map(m=>+m[1]);
  const next=(rowNums.length?Math.max(...rowNums):1)+1;
  const stamp=new Date().toLocaleString("en-IN");
  const row=`<row r="${next}"><c r="A${next}" t="inlineStr"><is><t>${esc(stamp)}</t></is></c>`+
             `<c r="B${next}" t="inlineStr"><is><t>${esc(summary)}</t></is></c></row>`;
  return clXml.replace("</sheetData>",row+"</sheetData>");
}

/* ---- Category Master / Sub-category Buffer (Lists sheet) ----
   Columns are NEVER hardcoded here. Every position is resolved at merge time from
   the workbook's own defined names -- Cat_Name / Cat_Applies / Cat_FixVar /
   Cat_EssDisc / Cat_IncClass for the master table, and each category's own
   underscore-substituted name for its sub-category list -- exactly the pattern
   capFindSheetPath/capFindBlankRows already use for sheet lookups. This is what
   makes the mechanism survive the user reorganizing the Lists sheet (as already
   happened once, shifting the master from AL onward down to O onward), which a
   hardcoded-column version cannot. */
function catColLetter(n){let s="";while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;}
function catColNum(s){let n=0;for(const ch of s)n=n*26+(ch.charCodeAt(0)-64);return n;}
function decodeXmlEntities(s){return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");}

// Parses a defined-name Ref like "Lists!$O$4:$O$43" -> {col:"O",row0:4,rowN:43}.
// Tolerates a single-cell Ref too (row0===rowN), just in case.
function catParseRef(ref){
  if(!ref)return null;
  const m=ref.match(/\$([A-Z]+)\$(\d+)(?::\$([A-Z]+)\$(\d+))?/);
  if(!m)return null;
  return {col:m[1],row0:+m[2],rowN:m[4]?+m[4]:+m[2]};
}
// Category display name -> the defined-name form used on the Lists sheet (Excel
// defined names can't contain spaces/punctuation, so these were created with
// underscores in their place, e.g. "Capital Gains" -> "Capital_Gains").
function catDefinedNameForCat(catName){return catName.replace(/[^A-Za-z0-9_]/g,"_");}
/* Resolves the five Category-Master columns and the shared row range from the
   workbook's own defined names. Throws if any is missing/malformed -- that means
   either the one-time Lists-sheet surgery was never done, or the defined names have
   since been deleted/broken, and merge cannot safely proceed either way. */
function catResolveMasterCols(wbXml){
  const need={name:"Cat_Name",applies:"Cat_Applies",fixvar:"Cat_FixVar",essdisc:"Cat_EssDisc",incclass:"Cat_IncClass"};
  const cols={};let row0=null,rowN=null;
  for(const key in need){
    const ref=catParseRef(wbDefinedNameRef(wbXml,need[key]));
    if(!ref)throw new Error(`Defined name "${need[key]}" is missing or malformed in this workbook -- can't resolve the Category Master columns.`);
    cols[key]=ref.col;
    if(row0==null){row0=ref.row0;rowN=ref.rowN;}
  }
  return{cols,row0,rowN};
}
/* Resolves the sub-category column for a category via its own defined name.
   Returns null if it doesn't have one yet -- callers must allocate a fresh column. */
function catResolveSubCol(wbXml,catName){
  const ref=catParseRef(wbDefinedNameRef(wbXml,catDefinedNameForCat(catName)));
  return ref?ref.col:null;
}
/* Picks the next free column past every column currently used by the Category
   Master or any existing sub-category list, for allocating a brand-new category's
   sub-category list. Scans every definedName whose Ref shares the master row range,
   so it stays correct no matter how the sheet has been reorganized -- never assumes
   sub-category columns start at any particular letter. */
function catNextFreeSubCol(wbXml,master){
  let maxCol=0;
  for(const key in master.cols)maxCol=Math.max(maxCol,catColNum(master.cols[key]));
  const re=/<definedName name="[^"]+"[^>]*>([^<]*)<\/definedName>/g;
  let m;
  while((m=re.exec(wbXml))){
    const ref=catParseRef(m[1]);
    if(ref&&ref.row0===master.row0&&ref.rowN===master.rowN)maxCol=Math.max(maxCol,catColNum(ref.col));
  }
  return catColLetter(maxCol+1);
}
/* ---- Category Master buffer auto-extend ----
   Unlike Transactions, blank Category Master rows may have no <row> element at
   all yet, or may exist (shared physical rows with Account Master's own A:F data)
   but with no O:S cells -- these are genuinely separate buffers sharing rows, not
   one contiguous block. Inserts cells/rows rather than cloning a whole templated
   row. Only ever called after confirming there's real headroom below the buffer
   on THIS sheet's O:S columns specifically -- Account Master's own A:F buffer is a
   separate, unrelated question. */
function catRowInsertCells(sheetXml,row,cellsXml,firstNewCol){
  const rowRe=new RegExp(`<row r="${row}"([^>]*)>([\\s\\S]*?)</row>`);
  const rm=sheetXml.match(rowRe);
  if(rm){
    const body=rm[2];
    const cellRe=/<c r="([A-Z]+)\d+"/g;
    let ins=null,m;
    while((m=cellRe.exec(body))){if(catColNum(m[1])>catColNum(firstNewCol)){ins=m.index;break;}}
    const newBody=ins!=null?(body.slice(0,ins)+cellsXml+body.slice(ins)):(body+cellsXml);
    return sheetXml.replace(rm[0],`<row r="${row}"${rm[1]}>${newBody}</row>`);
  }
  const newRow=`<row r="${row}" spans="1:60" ht="14.25" customHeight="1" x14ac:dyDescent="0.45">${cellsXml}</row>`;
  const rowNums=[...sheetXml.matchAll(/<row r="(\d+)"/g)].map(x=>+x[1]);
  const nextHigher=rowNums.filter(r=>r>row).sort((a,b)=>a-b)[0];
  if(nextHigher!=null)return sheetXml.replace(new RegExp(`<row r="${nextHigher}"`),newRow+`<row r="${nextHigher}"`);
  return sheetXml.replace("</sheetData>",newRow+"</sheetData>");
}
const CAT_MASTER_NAME_MAP={name:"Cat_Name",applies:"Cat_Applies",fixvar:"Cat_FixVar",essdisc:"Cat_EssDisc",incclass:"Cat_IncClass"};
function catExtendMasterBuffer(sheetXml,wbXml,batch){
  const master=catResolveMasterCols(wbXml);
  const{cols,row0,rowN}=master;
  const styleOf=col=>{
    const m=sheetXml.match(new RegExp(`<c r="${col}${rowN}" s="(\\d+)"`));
    if(!m)throw new Error(`Couldn't read style for column ${col} at row ${rowN} to extend the Category Master buffer.`);
    return m[1];
  };
  const styles={};for(const k in cols)styles[k]=styleOf(cols[k]);
  const orderedKeys=Object.keys(cols).sort((a,b)=>catColNum(cols[a])-catColNum(cols[b]));
  const newLast=rowN+batch;
  for(let r=rowN+1;r<=newLast;r++){
    const cellsXml=orderedKeys.map(k=>`<c r="${cols[k]}${r}" s="${styles[k]}"/>`).join("");
    sheetXml=catRowInsertCells(sheetXml,r,cellsXml,cols[orderedKeys[0]]);
  }
  sheetXml=xmlBumpDimensionRow(sheetXml,newLast);
  for(const k in cols)wbXml=wbSetDefinedNameRef(wbXml,CAT_MASTER_NAME_MAP[k],`Lists!$${cols[k]}$${row0}:$${cols[k]}$${newLast}`);
  return{sheetXml,wbXml,newLast};
}

let _catSstCache=null;
function catSstArray(zip){
  if(_catSstCache)return _catSstCache;
  const xml=new TextDecoder().decode(zip["xl/sharedStrings.xml"]);
  _catSstCache=[...xml.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>[...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(""));
  return _catSstCache;
}
function catCellText(zip,sheetXml,addr){
  if(new RegExp(`<c r="${addr}"[^>]*/>`).test(sheetXml))return null;
  const m=sheetXml.match(new RegExp(`<c r="${addr}"([^>]*)>([\\s\\S]*?)</c>`));
  if(!m)return null;
  const attrs=m[1],body=m[2];
  if(/t="inlineStr"/.test(attrs)){const tm=body.match(/<t[^>]*>([\s\S]*?)<\/t>/);return tm?decodeXmlEntities(tm[1]):"";}
  if(/t="s"/.test(attrs)){const vm=body.match(/<v>(\d+)<\/v>/);return vm?decodeXmlEntities(catSstArray(zip)[+vm[1]]||""):"";}
  const vm=body.match(/<v>([\s\S]*?)<\/v>/);
  return vm?vm[1]:"";
}
function catFindMasterRow(zip,sheetXml,nameCol,row0,rowN,name){
  for(let r=row0;r<=rowN;r++)if(catCellText(zip,sheetXml,`${nameCol}${r}`)===name)return r;
  return null;
}
function catFindBlankMasterRow(zip,sheetXml,nameCol,row0,rowN){
  for(let r=row0;r<=rowN;r++)if(catCellText(zip,sheetXml,`${nameCol}${r}`)==null)return r;
  return null;
}
function catFindBlankSubRow(zip,sheetXml,col,row0,rowN){
  for(let r=row0;r<=rowN;r++)if(catCellText(zip,sheetXml,`${col}${r}`)==null)return r;
  return null;
}
function catReadSubcatList(zip,sheetXml,col,row0,rowN){
  const out=[];
  for(let r=row0;r<=rowN;r++){const v=catCellText(zip,sheetXml,`${col}${r}`);if(v!=null&&v!=="")out.push({row:r,val:v});}
  return out;
}
function wbDefinedNameRef(wbXml,name){
  const escN=name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const re=new RegExp(`<definedName(?=[^>]*\\sname="${escN}")[^>]*>([^<]*)</definedName>`);
  const m=wbXml.match(re);return m?m[1]:null;
}
function wbSetDefinedNameRef(wbXml,name,ref){
  const escN=name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const re=new RegExp(`(<definedName(?=[^>]*\\sname="${escN}")[^>]*>)([^<]*)(</definedName>)`);
  if(re.test(wbXml))return wbXml.replace(re,(_,a,_b,c)=>a+ref+c);
  return wbXml.replace("</definedNames>",`<definedName name="${name}">${ref}</definedName></definedNames>`);
}
function wbRemoveDefinedName(wbXml,name){
  const escN=name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return wbXml.replace(new RegExp(`<definedName(?=[^>]*\\sname="${escN}")[^>]*>[^<]*</definedName>`),"");
}
/* Applies every queued category/sub-category action, in order, against the *current*
   text each time (so a rename queued right after an add still finds it) -- same
   sequential-mutation approach as the transaction merge. Returns updated XML plus a
   human-readable log for the review screen, and any actions that couldn't be applied
   (e.g. the category was renamed/removed since this copy of the file was exported). */
function catApplyQueue(zip,sheetXml,wbXml,queue){
  const applied=[],failed=[],log=[];
  // Resolved ONCE per merge from the workbook's own defined names -- never a
  // hardcoded letter. If the master defined names are missing/broken, this throws
  // before touching a single row, so the whole merge fails loudly rather than
  // silently writing into the wrong columns.
  const master=catResolveMasterCols(wbXml);
  const{cols:MCOL,row0,rowN}=master;
  for(const q of queue){
    try{
      if(q.action==="addCat"){
        const row=catFindBlankMasterRow(zip,sheetXml,MCOL.name,row0,rowN);
        if(row==null)throw new Error(`Category buffer is full (${rowN-row0+1} slots used) -- ask Claude to extend it.`);
        sheetXml=capSetCell(sheetXml,MCOL.name,row,"str",q.name);
        sheetXml=capSetCell(sheetXml,MCOL.applies,row,q.applies?"str":"blank",q.applies||null);
        sheetXml=capSetCell(sheetXml,MCOL.fixvar,row,q.fixvar?"str":"blank",q.fixvar||null);
        sheetXml=capSetCell(sheetXml,MCOL.essdisc,row,q.essdisc?"str":"blank",q.essdisc||null);
        sheetXml=capSetCell(sheetXml,MCOL.incclass,row,q.incclass?"str":"blank",q.incclass||null);
        log.push(`Added category "${q.name}"`);
      }else if(q.action==="editCat"){
        const row=catFindMasterRow(zip,sheetXml,MCOL.name,row0,rowN,q.oldName);
        if(row==null)throw new Error(`Couldn't find category "${q.oldName}" in this copy of the workbook.`);
        sheetXml=capSetCell(sheetXml,MCOL.name,row,"str",q.name);
        sheetXml=capSetCell(sheetXml,MCOL.applies,row,q.applies?"str":"blank",q.applies||null);
        sheetXml=capSetCell(sheetXml,MCOL.fixvar,row,q.fixvar?"str":"blank",q.fixvar||null);
        sheetXml=capSetCell(sheetXml,MCOL.essdisc,row,q.essdisc?"str":"blank",q.essdisc||null);
        sheetXml=capSetCell(sheetXml,MCOL.incclass,row,q.incclass?"str":"blank",q.incclass||null);
        if(q.name!==q.oldName){
          // The category's own sub-category defined name (if any) moves with the
          // rename -- resolved by the OLD underscore-substituted name, re-pointed
          // under the NEW one. Never assumes which column it currently lives in.
          const subRef=wbDefinedNameRef(wbXml,catDefinedNameForCat(q.oldName));
          if(subRef){
            wbXml=wbSetDefinedNameRef(wbXml,catDefinedNameForCat(q.name),subRef);
            wbXml=wbRemoveDefinedName(wbXml,catDefinedNameForCat(q.oldName));
          }
        }
        log.push(`Updated category "${q.oldName}"`+(q.name!==q.oldName?` (renamed to "${q.name}")`:""));
      }else if(q.action==="removeCat"){
        const row=catFindMasterRow(zip,sheetXml,MCOL.name,row0,rowN,q.name);
        if(row==null)throw new Error(`Couldn't find category "${q.name}" in this copy of the workbook.`);
        [MCOL.name,MCOL.applies,MCOL.fixvar,MCOL.essdisc,MCOL.incclass].forEach(c=>{sheetXml=capSetCell(sheetXml,c,row,"blank",null);});
        const subCol=catResolveSubCol(wbXml,q.name);
        if(subCol){
          for(let r=row0;r<=rowN;r++)sheetXml=capSetCell(sheetXml,subCol,r,"blank",null);
          wbXml=wbRemoveDefinedName(wbXml,catDefinedNameForCat(q.name));
        }
        log.push(`Removed category "${q.name}"`);
      }else if(q.action==="addSub"){
        const row=catFindMasterRow(zip,sheetXml,MCOL.name,row0,rowN,q.cat);
        if(row==null)throw new Error(`Couldn't find category "${q.cat}" in this copy of the workbook.`);
        let subCol=catResolveSubCol(wbXml,q.cat);
        if(!subCol){
          // Brand-new category with no sub-category list yet: allocate the next
          // free column past every column currently in use, and register its
          // defined name -- this is the ONLY place a column gets picked rather
          // than read back from an existing defined name.
          subCol=catNextFreeSubCol(wbXml,master);
          wbXml=wbSetDefinedNameRef(wbXml,catDefinedNameForCat(q.cat),`Lists!$${subCol}$${row0}:$${subCol}$${rowN}`);
        }
        const target=catFindBlankSubRow(zip,sheetXml,subCol,row0,rowN);
        if(target==null)throw new Error(`Sub-category buffer for "${q.cat}" is full -- ask Claude to extend it.`);
        sheetXml=capSetCell(sheetXml,subCol,target,"str",q.name);
        log.push(`Added sub-category "${q.name}" under "${q.cat}"`);
      }else if(q.action==="editSub"){
        const row=catFindMasterRow(zip,sheetXml,MCOL.name,row0,rowN,q.cat);
        if(row==null)throw new Error(`Couldn't find category "${q.cat}" in this copy of the workbook.`);
        const subCol=catResolveSubCol(wbXml,q.cat);
        if(!subCol)throw new Error(`"${q.cat}" has no sub-category list in this workbook.`);
        const hit=catReadSubcatList(zip,sheetXml,subCol,row0,rowN).find(e=>e.val===q.oldName);
        if(!hit)throw new Error(`Couldn't find sub-category "${q.oldName}" under "${q.cat}".`);
        sheetXml=capSetCell(sheetXml,subCol,hit.row,"str",q.name);
        log.push(`Renamed sub-category "${q.oldName}" under "${q.cat}" to "${q.name}"`);
      }else if(q.action==="removeSub"){
        const row=catFindMasterRow(zip,sheetXml,MCOL.name,row0,rowN,q.cat);
        if(row==null)throw new Error(`Couldn't find category "${q.cat}" in this copy of the workbook.`);
        const subCol=catResolveSubCol(wbXml,q.cat);
        if(!subCol)throw new Error(`"${q.cat}" has no sub-category list in this workbook.`);
        const list=catReadSubcatList(zip,sheetXml,subCol,row0,rowN);
        const idx=list.findIndex(e=>e.val===q.name);
        if(idx<0)throw new Error(`Couldn't find sub-category "${q.name}" under "${q.cat}".`);
        for(let k=idx;k<list.length-1;k++)sheetXml=capSetCell(sheetXml,subCol,list[k].row,"str",list[k+1].val);
        sheetXml=capSetCell(sheetXml,subCol,list[list.length-1].row,"blank",null);
        log.push(`Removed sub-category "${q.name}" from "${q.cat}"`);
      }
      applied.push(q.id);
    }catch(err){failed.push({id:q.id,error:err.message||String(err)});}
  }
  return{sheetXml,wbXml,applied,failed,log};
}

/* ---- Account Master (Lists sheet) merge write-back ----
   Same dynamic-resolution discipline as catApplyQueue -- every column resolved from
   the workbook's own defined names (Acct_Name/Class/Liq/Kind/Init + CashAccounts),
   never hardcoded, so this survives the user reorganizing the Lists sheet later.
   CashAccounts is a plain "Yes"/"No" flag column, one cell per account row (not a
   filtered list of cash-account names) -- Transactions' internal-transfer netting
   formula reads it via IFERROR(INDEX(CashAccounts,MATCH(name,Acct_Name,0)),"No")="Yes"
   rather than MATCH-against-a-name-list, so it's simply recomputed from Kind every
   time a row is written, with nothing that can fall out of sync. */
function acctResolveCols(wbXml){
  const need={name:"Acct_Name",cls:"Acct_Class",liq:"Acct_Liq",kind:"Acct_Kind",init:"Acct_Init"};
  const cols={};let row0=null,rowN=null;
  for(const key in need){
    const ref=catParseRef(wbDefinedNameRef(wbXml,need[key]));
    if(!ref)throw new Error(`Defined name "${need[key]}" is missing or malformed in this workbook -- can't resolve the Account Master columns.`);
    cols[key]=ref.col;
    if(row0==null){row0=ref.row0;rowN=ref.rowN;}
  }
  const cashRef=catParseRef(wbDefinedNameRef(wbXml,"CashAccounts"));
  if(!cashRef)throw new Error(`Defined name "CashAccounts" is missing or malformed in this workbook.`);
  cols.cash=cashRef.col;
  return{cols,row0,rowN};
}
const ACCT_CASH_KINDS=new Set(["Bank","Cash"]);
function acctApplyQueue(zip,sheetXml,wbXml,queue){
  const applied=[],failed=[],log=[];
  const master=acctResolveCols(wbXml);
  const{cols:MCOL,row0,rowN}=master;
  const writeRow=(row,name,cls,liq,kind,open)=>{
    sheetXml=capSetCell(sheetXml,MCOL.name,row,"str",name);
    sheetXml=capSetCell(sheetXml,MCOL.cls,row,cls?"str":"blank",cls||null);
    sheetXml=capSetCell(sheetXml,MCOL.liq,row,liq?"str":"blank",liq||null);
    sheetXml=capSetCell(sheetXml,MCOL.kind,row,kind?"str":"blank",kind||null);
    sheetXml=capSetCell(sheetXml,MCOL.init,row,"num",open||0);
    sheetXml=capSetCell(sheetXml,MCOL.cash,row,"str",ACCT_CASH_KINDS.has(kind)?"Yes":"No");
  };
  for(const q of queue){
    try{
      if(q.action==="addAcct"){
        const row=catFindBlankMasterRow(zip,sheetXml,MCOL.name,row0,rowN);
        if(row==null)throw new Error(`Account buffer is full (${rowN-row0+1} slots used) -- ask Claude to extend it.`);
        writeRow(row,q.name,q.cls,q.liq,q.kind,q.open);
        log.push(`Added account "${q.name}"`);
      }else if(q.action==="editAcct"){
        const row=catFindMasterRow(zip,sheetXml,MCOL.name,row0,rowN,q.oldName);
        if(row==null)throw new Error(`Couldn't find account "${q.oldName}" in this copy of the workbook.`);
        writeRow(row,q.name,q.cls,q.liq,q.kind,q.open);
        log.push(`Updated account "${q.oldName}"`+(q.name!==q.oldName?` (renamed to "${q.name}")`:""));
      }else if(q.action==="removeAcct"){
        const row=catFindMasterRow(zip,sheetXml,MCOL.name,row0,rowN,q.name);
        if(row==null)throw new Error(`Couldn't find account "${q.name}" in this copy of the workbook.`);
        [MCOL.name,MCOL.cls,MCOL.liq,MCOL.kind,MCOL.init,MCOL.cash].forEach(c=>{sheetXml=capSetCell(sheetXml,c,row,"blank",null);});
        log.push(`Removed account "${q.name}"`);
      }
      applied.push(q.id);
    }catch(err){failed.push({id:q.id,error:err.message||String(err)});}
  }
  return{sheetXml,wbXml,applied,failed,log};
}

/* ---- Investments buffer (Investments!A63:I112) merge write-back ----
   Same dynamic-resolution discipline as cat/acctApplyQueue -- every column
   resolved from defined names (Inv_Class/Type/Name/Acct/Units/AvgCost/CurPrice/
   InvNoUnits/ValNoUnits), never hardcoded. Holdings are identified by (name,acct)
   pair rather than name alone, since the same instrument name could plausibly
   exist under two different linked accounts -- so lookups check both columns.
   IMPORTANT: the defined names only cover the app's own buffer (rows 63-112) --
   that's deliberate, since that's the only range with guaranteed blank slots for
   addHold to scan into. But editHold/removeHold need to find a holding ANYWHERE
   in the table, including the original pre-existing rows (6-62) that predate the
   buffer entirely (e.g. holdings from the initial import, editable via the manual
   form in the Investments tab). INV_TABLE_START anchors that wider search to the
   table's well-established start, immediately below the header row -- same kind
   of fixed anchor as CAP_FIRST_DATA_ROW is for Transactions elsewhere in this
   file, used because there's no defined name for "where the whole table begins". */
const INV_TABLE_START=6;
function invResolveCols(wbXml){
  const need={cls:"Inv_Class",type:"Inv_Type",name:"Inv_Name",acct:"Inv_Acct",units:"Inv_Units",
    avg:"Inv_AvgCost",price:"Inv_CurPrice",minv:"Inv_InvNoUnits",mval:"Inv_ValNoUnits"};
  const cols={};let row0=null,rowN=null;
  for(const key in need){
    const ref=catParseRef(wbDefinedNameRef(wbXml,need[key]));
    if(!ref)throw new Error(`Defined name "${need[key]}" is missing or malformed in this workbook -- can't resolve the Investments buffer columns.`);
    cols[key]=ref.col;
    if(row0==null){row0=ref.row0;rowN=ref.rowN;}
  }
  /* Symbol is optional -- added in a later template revision, alongside the
     Investment Lots sheet. An older copy of the workbook simply won't have
     Inv_Symbol defined; resolve to null rather than throwing, so merge for
     everything else still works fine against a not-yet-updated template. */
  const symRef=catParseRef(wbDefinedNameRef(wbXml,"Inv_Symbol"));
  cols.symbol=symRef?symRef.col:null;
  return{cols,row0,rowN};
}
function invFindRow(zip,sheetXml,cols,row0,rowN,name,acct){
  for(let r=row0;r<=rowN;r++){
    if(catCellText(zip,sheetXml,`${cols.name}${r}`)===name&&catCellText(zip,sheetXml,`${cols.acct}${r}`)===(acct||""))return r;
  }
  return null;
}
function invFindBlankRow(zip,sheetXml,nameCol,row0,rowN){
  for(let r=row0;r<=rowN;r++)if(catCellText(zip,sheetXml,`${nameCol}${r}`)==null)return r;
  return null;
}
function invApplyQueue(zip,sheetXml,wbXml,queue){
  const applied=[],failed=[],log=[];
  const master=invResolveCols(wbXml);
  const{cols:C,row0,rowN}=master;
  const writeRow=(row,q)=>{
    sheetXml=capSetCell(sheetXml,C.cls,row,q.cls?"str":"blank",q.cls||null);
    sheetXml=capSetCell(sheetXml,C.type,row,q.type?"str":"blank",q.type||null);
    sheetXml=capSetCell(sheetXml,C.name,row,"str",q.name);
    sheetXml=capSetCell(sheetXml,C.acct,row,q.acct?"str":"blank",q.acct||null);
    sheetXml=capSetCell(sheetXml,C.units,row,q.units!=null?"num":"blank",q.units);
    sheetXml=capSetCell(sheetXml,C.avg,row,q.avg!=null?"num":"blank",q.avg);
    sheetXml=capSetCell(sheetXml,C.price,row,q.price!=null?"num":"blank",q.price);
    sheetXml=capSetCell(sheetXml,C.minv,row,q.minv!=null?"num":"blank",q.minv);
    sheetXml=capSetCell(sheetXml,C.mval,row,q.mval!=null?"num":"blank",q.mval);
    if(C.symbol)sheetXml=capSetCell(sheetXml,C.symbol,row,q.symbol?"str":"blank",q.symbol||null);
  };
  for(const q of queue){
    try{
      if(q.action==="addHold"){
        const row=invFindBlankRow(zip,sheetXml,C.name,row0,rowN);
        if(row==null)throw new Error(`Holdings buffer is full (${rowN-row0+1} slots used) -- ask Claude to extend it.`);
        writeRow(row,q);
        log.push(`Added holding "${q.name}"${q.acct?` in ${q.acct}`:""}`);
      }else if(q.action==="editHold"){
        const lookName=q.oldName||q.name,lookAcct=q.oldAcct!=null?q.oldAcct:q.acct;
        const row=invFindRow(zip,sheetXml,C,INV_TABLE_START,rowN,lookName,lookAcct);
        if(row==null)throw new Error(`Couldn't find holding "${lookName}"${lookAcct?` in ${lookAcct}`:""} in this copy of the workbook.`);
        writeRow(row,q);
        log.push(`Updated holding "${lookName}"`+(q.name!==lookName?` (renamed to "${q.name}")`:""));
      }else if(q.action==="removeHold"){
        const row=invFindRow(zip,sheetXml,C,INV_TABLE_START,rowN,q.name,q.acct);
        if(row==null)throw new Error(`Couldn't find holding "${q.name}"${q.acct?` in ${q.acct}`:""} in this copy of the workbook.`);
        [C.cls,C.type,C.name,C.acct,C.units,C.avg,C.price,C.minv,C.mval,...(C.symbol?[C.symbol]:[])].forEach(c=>{sheetXml=capSetCell(sheetXml,c,row,"blank",null);});
        log.push(`Removed holding "${q.name}"`);
      }
      applied.push(q.id);
    }catch(err){failed.push({id:q.id,error:err.message||String(err)});}
  }
  return{sheetXml,wbXml,applied,failed,log};
}

/* ---- Investment Lots sheet write-back ----
   toExcelSerial: the inverse of toYMD()'s number branch (which already reads
   an Excel date serial back into "YYYY-MM-DD" using the same 1899-12-30 UTC
   epoch SheetJS/Excel use) -- needed here because this write path edits raw
   XML directly via capSetCell, bypassing SheetJS entirely, so nothing else
   does this conversion for us on the way out. */
function toExcelSerial(isoDateStr){
  return Math.round((Date.parse(isoDateStr+"T00:00:00Z")-Date.UTC(1899,11,30))/86400000);
}
/* One row per lot, matched by Holding+Account+Acquisition Date+Cost/Unit
   together -- a lot has no ID of its own in the workbook (unlike a holding,
   matched by Name+Account, or a transaction, matched by row number), and
   those four fields are exactly what uniquely identifies one once written:
   date and cost never change after the fact, only quantity does (a partial
   FIFO consumption), so they're a stable lookup key across an editLot. */
function lotsResolveCols(wbXml){
  const need={holding:"Lots_Holding",acct:"Lots_Acct",acqDate:"Lots_AcqDate",qty:"Lots_Qty",
    cost:"Lots_Cost",source:"Lots_Source",fxCcy:"Lots_FxCcy",fxCost:"Lots_FxCost"};
  const cols={};let row0=null,rowN=null;
  for(const key in need){
    const ref=catParseRef(wbDefinedNameRef(wbXml,need[key]));
    if(!ref)throw new Error(`Defined name "${need[key]}" is missing or malformed in this workbook -- can't resolve the Investment Lots columns.`);
    cols[key]=ref.col;
    if(row0==null){row0=ref.row0;rowN=ref.rowN;}
  }
  return{cols,row0,rowN};
}
/* costPerUnit compared with a small tolerance, not ===, since it round-trips
   through the xlsx as a float and a fresh JS computation of the "same"
   number (e.g. FX cost-basis divided back out) can differ in the last
   decimal place. Date and holding/account stay exact string matches. */
function lotsFindRow(zip,sheetXml,cols,row0,rowN,holdName,acct,acqDate,costPerUnit){
  const wantSerial=acqDate?toExcelSerial(acqDate):null;
  for(let r=row0;r<=rowN;r++){
    if(catCellText(zip,sheetXml,`${cols.holding}${r}`)!==holdName)continue;
    if(catCellText(zip,sheetXml,`${cols.acct}${r}`)!==(acct||""))continue;
    const dCell=catCellText(zip,sheetXml,`${cols.acqDate}${r}`);
    if(wantSerial!=null&&+dCell!==wantSerial)continue;
    const cCell=catCellText(zip,sheetXml,`${cols.cost}${r}`);
    if(costPerUnit!=null&&cCell!=null&&Math.abs(+cCell-costPerUnit)>0.01)continue;
    return r;
  }
  return null;
}
function lotsFindBlankRow(zip,sheetXml,holdingCol,row0,rowN){
  for(let r=row0;r<=rowN;r++)if(catCellText(zip,sheetXml,`${holdingCol}${r}`)==null)return r;
  return null;
}
function lotsApplyQueue(zip,sheetXml,wbXml,queue){
  const applied=[],failed=[],log=[];
  const{cols:C,row0,rowN}=lotsResolveCols(wbXml);
  const writeRow=(row,q)=>{
    sheetXml=capSetCell(sheetXml,C.holding,row,"str",q.holdName);
    sheetXml=capSetCell(sheetXml,C.acct,row,q.acct?"str":"blank",q.acct||null);
    sheetXml=capSetCell(sheetXml,C.acqDate,row,q.acqDate?"num":"blank",q.acqDate?toExcelSerial(q.acqDate):null);
    sheetXml=capSetCell(sheetXml,C.qty,row,q.qty!=null?"num":"blank",q.qty);
    sheetXml=capSetCell(sheetXml,C.cost,row,q.costPerUnit!=null?"num":"blank",q.costPerUnit);
    sheetXml=capSetCell(sheetXml,C.source,row,q.source?"str":"blank",q.source||null);
    sheetXml=capSetCell(sheetXml,C.fxCcy,row,q.fxCurrency?"str":"blank",q.fxCurrency||null);
    sheetXml=capSetCell(sheetXml,C.fxCost,row,q.fxPerUnit!=null?"num":"blank",q.fxPerUnit);
  };
  for(const q of queue){
    try{
      if(q.action==="addLot"){
        const row=lotsFindBlankRow(zip,sheetXml,C.holding,row0,rowN);
        if(row==null)throw new Error(`Investment Lots buffer is full (${rowN-row0+1} slots used) -- ask Claude to extend it.`);
        writeRow(row,q);
        log.push(`Added lot \u2014 ${q.holdName}${q.acct?` (${q.acct})`:""}, ${q.qty} @ ${q.acqDate}`);
      }else if(q.action==="editLot"){
        const row=lotsFindRow(zip,sheetXml,C,row0,rowN,q.holdName,q.acct,q.acqDate,q.costPerUnit);
        if(row==null)throw new Error(`Couldn't find the lot for "${q.holdName}"${q.acct?` (${q.acct})`:""} acquired ${q.acqDate} in this copy of the workbook.`);
        sheetXml=capSetCell(sheetXml,C.qty,row,"num",q.qty);
        log.push(`Updated lot quantity \u2014 ${q.holdName}, acquired ${q.acqDate} \u2192 ${q.qty}`);
      }else if(q.action==="removeLot"){
        const row=lotsFindRow(zip,sheetXml,C,row0,rowN,q.holdName,q.acct,q.acqDate,q.costPerUnit);
        if(row==null)throw new Error(`Couldn't find the lot for "${q.holdName}"${q.acct?` (${q.acct})`:""} acquired ${q.acqDate} in this copy of the workbook.`);
        [C.holding,C.acct,C.acqDate,C.qty,C.cost,C.source,C.fxCcy,C.fxCost].forEach(c=>{sheetXml=capSetCell(sheetXml,c,row,"blank",null);});
        log.push(`Fully consumed lot removed \u2014 ${q.holdName}, acquired ${q.acqDate}`);
      }
      applied.push(q.id);
    }catch(err){failed.push({id:q.id,error:err.message||String(err)});}
  }
  return{sheetXml,wbXml,applied,failed,log};
}

/* ---- Tax Payments sheet write-back ----
   Buffer-based (Pay_DateRange/Pay_TypeRange/Pay_Range already reserve A5:A30),
   same shape as Investments -- no row insertion needed here, unlike Deductions.
   Matched by Type+Date+Amount+Section together (see payQueue's own comment for
   why). Every "add" is dedup-checked against what's ALREADY in the sheet before
   writing -- a payment whose exact key already exists there is treated as
   already-applied, not written a second time. This matters more here than for
   Investments' addHold (which never dedup-checks) because a payment can very
   plausibly get queued for "add" more than once across separate sessions/queues
   before a merge ever runs, whereas a holding usually doesn't. */
function payResolveCols(wbXml){
  const need={date:"Pay_DateRange",type:"Pay_TypeRange",amount:"Pay_Range"};
  const cols={};let row0=null,rowN=null;
  for(const key in need){
    const ref=catParseRef(wbDefinedNameRef(wbXml,need[key]));
    if(!ref)throw new Error(`Defined name "${need[key]}" is missing or malformed in this workbook -- can't resolve the Tax Payments buffer.`);
    cols[key]=ref.col;
    if(row0==null){row0=ref.row0;rowN=ref.rowN;}
  }
  // Section/Payer/Income Head sit between Type and Amount on the real sheet
  // (B..F: Date|Type|Section|Payer/Description|Income Head|Amount) but have no
  // defined names of their own -- derived from the known column, not guessed.
  const colIdx=s=>s.charCodeAt(0)-65;
  const colLetter=n=>String.fromCharCode(65+n);
  cols.section=colLetter(colIdx(cols.type)+1);
  cols.payer=colLetter(colIdx(cols.type)+2);
  cols.head=colLetter(colIdx(cols.type)+3);
  return{cols,row0,rowN};
}
function payKeyMatches(zip,sheetXml,cols,r,key){
  if(catCellText(zip,sheetXml,`${cols.date}${r}`)==null)return false;
  const dCell=catCellText(zip,sheetXml,`${cols.date}${r}`);
  const wantSerial=key.date?toExcelSerial(key.date):null;
  if(wantSerial!=null&&+dCell!==wantSerial)return false;
  if(catCellText(zip,sheetXml,`${cols.type}${r}`)!==key.type)return false;
  const aCell=catCellText(zip,sheetXml,`${cols.amount}${r}`);
  if(aCell==null||Math.abs(+aCell-(key.amount||0))>0.5)return false;
  const secCell=catCellText(zip,sheetXml,`${cols.section}${r}`)||null;
  if((key.section||null)!==secCell)return false;
  return true;
}
function payFindRow(zip,sheetXml,cols,row0,rowN,key){
  for(let r=row0;r<=rowN;r++)if(payKeyMatches(zip,sheetXml,cols,r,key))return r;
  return null;
}
function payFindBlankRow(zip,sheetXml,dateCol,row0,rowN){
  for(let r=row0;r<=rowN;r++)if(catCellText(zip,sheetXml,`${dateCol}${r}`)==null)return r;
  return null;
}
function payApplyQueue(zip,sheetXml,wbXml,queue){
  const applied=[],failed=[],log=[];
  const{cols:C,row0,rowN}=payResolveCols(wbXml);
  const writeRow=(row,q)=>{
    sheetXml=capSetCell(sheetXml,C.date,row,"num",toExcelSerial(q.date));
    sheetXml=capSetCell(sheetXml,C.type,row,"str",q.type);
    sheetXml=capSetCell(sheetXml,C.section,row,q.section?"str":"blank",q.section||null);
    sheetXml=capSetCell(sheetXml,C.payer,row,q.payer?"str":"blank",q.payer||null);
    sheetXml=capSetCell(sheetXml,C.head,row,q.incomeHead?"str":"blank",q.incomeHead||null);
    sheetXml=capSetCell(sheetXml,C.amount,row,"num",q.amount||0);
  };
  for(const q of queue){
    try{
      if(q.action==="addPayment"){
        const dupRow=payFindRow(zip,sheetXml,C,row0,rowN,{date:q.date,type:q.type,amount:q.amount,section:q.section});
        if(dupRow!=null){log.push(`Payment ${q.type} \u20b9${q.amount} on ${q.date} already in the sheet -- skipped, not duplicated.`);}
        else{
          const row=payFindBlankRow(zip,sheetXml,C.date,row0,rowN);
          if(row==null)throw new Error(`Tax Payments buffer is full (${rowN-row0+1} slots used) -- ask Claude to extend it.`);
          writeRow(row,q);
          log.push(`Added payment: ${q.type} \u20b9${q.amount} on ${q.date}`);
        }
      }else if(q.action==="editPayment"){
        const row=payFindRow(zip,sheetXml,C,row0,rowN,q.matchKey);
        if(row==null)throw new Error(`Couldn't find a payment matching ${q.matchKey.type} \u20b9${q.matchKey.amount} on ${q.matchKey.date} in this copy of the workbook.`);
        writeRow(row,q);
        log.push(`Updated payment (was ${q.matchKey.type} \u20b9${q.matchKey.amount} on ${q.matchKey.date})`);
      }else if(q.action==="removePayment"){
        const row=payFindRow(zip,sheetXml,C,row0,rowN,q.matchKey);
        if(row==null)throw new Error(`Couldn't find a payment matching ${q.matchKey.type} \u20b9${q.matchKey.amount} on ${q.matchKey.date} in this copy of the workbook.`);
        [C.date,C.type,C.section,C.payer,C.head,C.amount].forEach(c=>{sheetXml=capSetCell(sheetXml,c,row,"blank",null);});
        log.push(`Removed payment: ${q.matchKey.type} \u20b9${q.matchKey.amount} on ${q.matchKey.date}`);
      }else{throw new Error(`Tax Payments sheet: unknown queue action "${q.action}".`);}
      applied.push(q.id);
    }catch(err){failed.push({id:q.id,error:err.message||String(err)});}
  }
  return{sheetXml,wbXml,applied,failed,log};
}

/* ---- Fixed Deposits sheet write-back ----
   Buffer-based (rows 5:29 -- the same 25-row buffer this session's earlier
   Fixed-Deposits-engine work established), matched by Bank+Principal+Start
   together, same natural key the read-import already uses (see importWB()'s
   Fixed Deposits dupeKey). Unlike every other buffer sheet in this app, only
   TWO of these columns have their own defined names on the real workbook:
   FD_InterestFY (K, a COMPUTED column, never written here) and FD_TDSpaid
   (L, the one INPUT field that happens to have a name). The other eight
   input columns (FD ID/Bank/Principal/Rate/Comp-per-yr/Start/Maturity/
   Payout/Status) have no defined names at all -- confirmed directly against
   the real Fixed Deposits sheet's row 4 headers (A4:L4: "FD ID","Bank /
   Account","Principal \u20b9","Rate %","Comp/yr","Start","Maturity","Payout",
   "Status","Value @ As-of \u20b9","Interest this FY \u20b9","TDS paid \u20b9"),
   hardcoded here exactly as found (B=Bank, C=Principal, D=Rate, E=Comp/yr,
   F=Start, G=Maturity, H=Payout, I=Status), same treatment Tax Rules' own
   fixed-cell writes already get elsewhere in this file. Row bounds are still
   resolved from FD_TDSpaid's own range rather than hardcoded 5/29 directly,
   so a future buffer extension only needs FD_TDSpaid repointed, not this
   function edited. Column A ("FD ID") is a user-typed free-text label the
   app has no model for at all (same reason the read-import never keys off
   it) -- never written or blanked here, so a manually-entered label on an
   app-added row is left alone rather than guessed at. */
function fdResolveCols(wbXml){
  const tdsRef=catParseRef(wbDefinedNameRef(wbXml,"FD_TDSpaid"));
  if(!tdsRef)throw new Error(`Defined name "FD_TDSpaid" is missing or malformed in this workbook -- can't resolve the Fixed Deposits buffer.`);
  const cols={bank:"B",principal:"C",rate:"D",compPerYear:"E",start:"F",maturity:"G",payout:"H",status:"I",tdsPaid:tdsRef.col};
  return{cols,row0:tdsRef.row0,rowN:tdsRef.rowN};
}
function fdKeyMatches(zip,sheetXml,cols,r,key){
  if(catCellText(zip,sheetXml,`${cols.bank}${r}`)!==key.bank)return false;
  const pCell=catCellText(zip,sheetXml,`${cols.principal}${r}`);
  if(pCell==null||Math.abs(+pCell-(key.principal||0))>0.5)return false;
  const sCell=catCellText(zip,sheetXml,`${cols.start}${r}`);
  const wantSerial=key.start?toExcelSerial(key.start):null;
  if(wantSerial!=null&&+sCell!==wantSerial)return false;
  return true;
}
function fdFindRow(zip,sheetXml,cols,row0,rowN,key){
  for(let r=row0;r<=rowN;r++)if(fdKeyMatches(zip,sheetXml,cols,r,key))return r;
  return null;
}
function fdFindBlankRow(zip,sheetXml,bankCol,row0,rowN){
  for(let r=row0;r<=rowN;r++)if(catCellText(zip,sheetXml,`${bankCol}${r}`)==null)return r;
  return null;
}
function fdApplyQueue(zip,sheetXml,wbXml,queue){
  const applied=[],failed=[],log=[];
  const{cols:C,row0,rowN}=fdResolveCols(wbXml);
  const writeRow=(row,q)=>{
    sheetXml=capSetCell(sheetXml,C.bank,row,"str",q.bank);
    sheetXml=capSetCell(sheetXml,C.principal,row,"num",q.principal||0);
    sheetXml=capSetCell(sheetXml,C.rate,row,"num",q.rate||0);
    sheetXml=capSetCell(sheetXml,C.compPerYear,row,"num",q.compPerYear||1);
    sheetXml=capSetCell(sheetXml,C.start,row,"num",toExcelSerial(q.start));
    sheetXml=capSetCell(sheetXml,C.maturity,row,q.maturity?"num":"blank",q.maturity?toExcelSerial(q.maturity):null);
    sheetXml=capSetCell(sheetXml,C.payout,row,q.payout?"str":"blank",q.payout||null);
    sheetXml=capSetCell(sheetXml,C.status,row,q.status?"str":"blank",q.status||null);
    sheetXml=capSetCell(sheetXml,C.tdsPaid,row,q.tdsPaid!=null?"num":"blank",q.tdsPaid);
  };
  for(const q of queue){
    try{
      if(q.action==="addFD"){
        const dupRow=fdFindRow(zip,sheetXml,C,row0,rowN,{bank:q.bank,principal:q.principal,start:q.start});
        if(dupRow!=null){log.push(`FD at ${q.bank} (\u20b9${q.principal}, opened ${q.start}) already in the sheet -- skipped, not duplicated.`);}
        else{
          const row=fdFindBlankRow(zip,sheetXml,C.bank,row0,rowN);
          if(row==null)throw new Error(`Fixed Deposits buffer is full (${rowN-row0+1} slots used) -- ask Claude to extend it.`);
          writeRow(row,q);
          log.push(`Added FD: ${q.bank}, \u20b9${q.principal} opened ${q.start}`);
        }
      }else if(q.action==="editFD"){
        const row=fdFindRow(zip,sheetXml,C,row0,rowN,q.matchKey);
        if(row==null)throw new Error(`Couldn't find an FD matching ${q.matchKey.bank}, \u20b9${q.matchKey.principal} opened ${q.matchKey.start} in this copy of the workbook.`);
        writeRow(row,q);
        log.push(`Updated FD (was ${q.matchKey.bank}, \u20b9${q.matchKey.principal} opened ${q.matchKey.start})`);
      }else if(q.action==="removeFD"){
        const row=fdFindRow(zip,sheetXml,C,row0,rowN,q.matchKey);
        if(row==null)throw new Error(`Couldn't find an FD matching ${q.matchKey.bank}, \u20b9${q.matchKey.principal} opened ${q.matchKey.start} in this copy of the workbook.`);
        [C.bank,C.principal,C.rate,C.compPerYear,C.start,C.maturity,C.payout,C.status,C.tdsPaid].forEach(c=>{sheetXml=capSetCell(sheetXml,c,row,"blank",null);});
        log.push(`Removed FD: ${q.matchKey.bank}, \u20b9${q.matchKey.principal} opened ${q.matchKey.start}`);
      }else{throw new Error(`Fixed Deposits sheet: unknown queue action "${q.action}".`);}
      applied.push(q.id);
    }catch(err){failed.push({id:q.id,error:err.message||String(err)});}
  }
  return{sheetXml,wbXml,applied,failed,log};
}

/* ---- Capital Gains sheet write-back ----
   Add-only: sheet-imported events already live in their original rows (see the
   Capital Gains import), so only app-native events (real Sells, source!=="sheet-
   import") are ever candidates. CG_QUEUE holds pointers ({eventId}), not
   snapshots -- see cgQueue()'s comment. Every event is re-classified and re-FX-
   resolved FRESH at merge time (not from whatever it looked like when queued),
   so a mfCategory set well after the Sell, or an FX rate added later, still gets
   picked up on the next merge rather than being stuck on stale data. An event
   that still isn't resolvable (no mfCategory yet, missing FX rate) is left
   queued -- reported as a soft "not ready yet" failure, not an error. */
function cgAssetClassForEvent(e){
  if(e.cls==="Equity"&&(e.type==="Stock"||e.type==="ETF"))return"Listed Equity/Equity MF";
  if(e.type==="RSU"||e.type==="ESPP")return"Foreign/Unlisted Shares";
  if(e.type==="SGB")return"SGB (secondary/premature)";
  if(e.cls==="Gold")return"Gold / Gold MF / other";
  if(MF_TYPES.includes(e.type)){
    if(e.mfCategory==="Equity")return"Listed Equity/Equity MF";
    if(e.mfCategory==="Debt")return(e.acqDate&&e.acqDate<"2023-04-01")?"Debt MF (bought <1Apr23)":"Debt MF (bought >=1Apr23)";
    // "Other/hybrid fund" has no dedicated sheet class -- Gold/SGB/Foreign/Real
    // Estate/pre-2023-debt all share the identical 24mo-LT/12.5%-flat/no-
    // exemption treatment, so the TAX OUTCOME is exactly the same regardless of
    // which of those the row is labeled as; "Gold / Gold MF / other" is picked
    // only for the row's cosmetic label, not because it's factually gold.
    if(e.mfCategory==="Other")return"Gold / Gold MF / other";
  }
  return null; // unclassified -- not write-back eligible yet
}
function cgEventInrAmounts(e){
  if(e.costBasis!=null&&e.proceeds!=null)return{costBasis:e.costBasis,proceeds:e.proceeds};
  if(e.fxCostBasis!=null&&e.fxProceeds!=null){
    const ccy=e.fxCurrency||"USD";
    const acqRate=getFxRate(ccy,e.acqDate),saleRate=getFxRate(ccy,e.saleDate);
    if(acqRate==null||saleRate==null)return null;
    return{costBasis:e.fxCostBasis*acqRate,proceeds:e.fxProceeds*saleRate};
  }
  return null;
}
function cgCurrentRowN(zip,sheetXml){
  for(let r=5;r<505;r++){
    if(catCellText(zip,sheetXml,`L${r}`)==="TOTAL")return r-1;
  }
  throw new Error(`Capital Gains sheet: couldn't find the "TOTAL" row -- can't safely write here.`);
}
function cgFindBlankRow(zip,sheetXml,row0,rowN){
  for(let r=row0;r<=rowN;r++)if(catCellText(zip,sheetXml,`B${r}`)==null)return r;
  return null;
}
// Dedup key: Name+Account+Sale Date+Proceeds together -- the SAME key the
// Capital Gains import already dedupes on, so a row written back by this
// function and later re-imported (or vice versa) is recognized as the same sale
// either direction, not doubled.
function cgFindRowByKey(zip,sheetXml,row0,rowN,holdName,acct,saleDate,proceeds){
  const wantSerial=saleDate?toExcelSerial(saleDate):null;
  const wantAmt=Math.round((proceeds||0)*100);
  for(let r=row0;r<=rowN;r++){
    if(catCellText(zip,sheetXml,`D${r}`)!==(holdName||null))continue;
    if(catCellText(zip,sheetXml,`E${r}`)!==(acct||null))continue;
    const dCell=catCellText(zip,sheetXml,`I${r}`);
    if(wantSerial!=null&&+dCell!==wantSerial)continue;
    const jCell=catCellText(zip,sheetXml,`J${r}`);
    if(jCell==null||Math.round(+jCell*100)!==wantAmt)continue;
    return r;
  }
  return null;
}
function cgApplyQueue(zip,sheetXml,wbXml,queue){
  const applied=[],failed=[],log=[];
  const row0=5;
  for(const q of queue){
    try{
      const e=(S.capGainsEvents||[]).find(x=>x.id===q.eventId);
      if(!e){log.push(`Event ${q.eventId} no longer exists -- skipped.`);applied.push(q.id);continue;}
      const assetClass=cgAssetClassForEvent(e);
      if(!assetClass)throw new Error(`"${e.holdName||e.type}" (sold ${e.saleDate}) isn't classified yet -- set its fund category on the Capital Gains tab, then merge again.`);
      const inr=cgEventInrAmounts(e);
      if(!inr)throw new Error(`"${e.holdName||e.type}" (sold ${e.saleDate}) needs an SBI TT/TTBR rate before it can be written -- add it in Settings \u2192 Tax Rules, then merge again.`);
      const rowN=cgCurrentRowN(zip,sheetXml);
      const dupRow=cgFindRowByKey(zip,sheetXml,row0,rowN,e.holdName,e.acct,e.saleDate,inr.proceeds);
      if(dupRow!=null){log.push(`"${e.holdName||e.type}" (sold ${e.saleDate}) already in the sheet at row ${dupRow} -- skipped, not duplicated.`);applied.push(q.id);continue;}
      const row=cgFindBlankRow(zip,sheetXml,row0,rowN);
      if(row==null)throw new Error(`Capital Gains buffer is full (${rowN-row0+1} slots used) -- ask Claude to extend it.`);
      sheetXml=capSetCell(sheetXml,"B",row,"str",assetClass);
      sheetXml=capSetCell(sheetXml,"C",row,e.type?"str":"blank",e.type||null);
      sheetXml=capSetCell(sheetXml,"D",row,e.holdName?"str":"blank",e.holdName||null);
      sheetXml=capSetCell(sheetXml,"E",row,e.acct?"str":"blank",e.acct||null);
      sheetXml=capSetCell(sheetXml,"F",row,e.acqDate?"num":"blank",e.acqDate?toExcelSerial(e.acqDate):null);
      sheetXml=capSetCell(sheetXml,"G",row,e.qty!=null?"num":"blank",e.qty);
      sheetXml=capSetCell(sheetXml,"H",row,"num",inr.costBasis);
      sheetXml=capSetCell(sheetXml,"I",row,e.saleDate?"num":"blank",e.saleDate?toExcelSerial(e.saleDate):null);
      sheetXml=capSetCell(sheetXml,"J",row,"num",inr.proceeds);
      log.push(`Added "${e.holdName||e.type}" (sold ${e.saleDate}) at row ${row}`);
      applied.push(q.id);
    }catch(err){failed.push({id:q.id,error:err.message||String(err)});}
  }
  return{sheetXml,wbXml,applied,failed,log};
}

/* ---- Tax Rules sheet write-back ----

function trApplyQueue(zip,sheetXml,wbXml,queue){

        const band=t.surchargeSlabs[i];if(!band)return;
        sheetXml=capSetCell(sheetXml,"A",r,"num",band[0]); // upTo (col B on the sheet) is never stored -- derived from the NEXT row's "from", same as every other read of this matrix
        sheetXml=capSetCell(sheetXml,"B",r,"num",band[2]);
      });
      sheetXml=capSetCell(sheetXml,"B",49,"num",t.surcharge.capOnSpecialIncome);
      // cg sub-object -> the CG_Class matrix (rows 34-40). The app's flat model
      // has one field, not one per row: equityLtMonths/stcgRate/ltcgRate/

      // a single value the app applies to every "other"-bucket class alike
      // (Foreign/Unlisted-35, Debt pre-2023-37, Gold-38, Real Estate-40) rather
      // than tracking each separately, so saving here writes that one value to
      // all four; SGB (39) gets its own LT-months field but shares the same
      // "other" flat rate, same as it already does when read. Debt post-2023
      // (36) is never touched -- Sec 50AA means it's always slab regardless of
      // holding period, and nothing in the app's model corresponds to that row.
      if(t.cg){
        sheetXml=capSetCell(sheetXml,"B",34,"num",t.cg.equityLtMonths);
        sheetXml=capSetCell(sheetXml,"C",34,"num",t.cg.stcgRate);

}

/* ---- Budget sheet write-back ----
   Budget_Cat/Budget_Monthly are real defined names on the workbook (Budget!$A$4:$A$14
   / $D$4:$D$14), resolved the same way every other buffer resolves its columns --
   never hardcoded. The "Months of buffer to hold" cell has no defined name (it's a
   single templated line, not a repeating row), so it's located defensively by its
   label text; if a future layout change moves it, this throws instead of silently
   writing the wrong cell. */
function budResolveRows(wbXml){
  const catRef=catParseRef(wbDefinedNameRef(wbXml,"Budget_Cat"));
  const moRef=catParseRef(wbDefinedNameRef(wbXml,"Budget_Monthly"));
  if(!catRef||!moRef)throw new Error(`Defined name "Budget_Cat" or "Budget_Monthly" is missing or malformed in this workbook -- can't resolve the Budget table.`);
  return{catCol:catRef.col,moCol:moRef.col,row0:catRef.row0,rowN:catRef.rowN};
}
function budFindRow(zip,sheetXml,catCol,row0,rowN,cat){
  for(let r=row0;r<=rowN;r++)if(catCellText(zip,sheetXml,`${catCol}${r}`)===cat)return r;
  return null;
}
// Same shape as catFindBlankMasterRow -- first row in [row0,rowN] with no name yet.
// Used by the Budget buffer-fill model below (post-manual-extend), never a row-insert.
function budFindBlankCategoryRow(zip,sheetXml,catCol,row0,rowN){
  for(let r=row0;r<=rowN;r++)if(catCellText(zip,sheetXml,`${catCol}${r}`)==null)return r;
  return null;
}
// Like capSetCell, but for a cell that carries a live formula (B/C's Cat_FixVar /
// Cat_EssDisc lookups, E's D*12) that must survive the write -- capSetCell always
// replaces the whole cell, which would silently delete the <f> tag. This keeps
// whatever <f .../> is already there (shared-formula ref or bare si=) and only
// swaps the cached <v>, so the row stays a live formula, just like every other
// row in the table, and shows the right value even before Excel's next recalc.
function capSetFormulaCellValue(xml,col,row,newVal){
  // Two fully-separate alternatives, both using a LAZY attribute match --
  // a single shared `[^>]*` (greedy) here would swallow the self-closing tag's
  // own "/" before the alternation gets a chance to try "/>", then fall through
  // to ">.*?</f>" and keep expanding across every following row looking for the
  // next literal "</f>" anywhere in the sheet. Caught this via a real merge test:
  // it silently matched from one cell clear through ~10 rows to the first
  // multi-cell SUM formula further down and rewrote all of it. Lazy attribute
  // matching in both branches avoids the ambiguity that let that happen.
  const re=new RegExp(`<c r="${col}${row}"([^>]*)>(<f[^>]*?/>|<f[^>]*?>[\\s\\S]*?</f>)<v>[^<]*</v></c>`);
  const m=xml.match(re);
  if(!m)throw new Error(`Expected a formula cell at ${col}${row} but didn't find one in the shape this tool expects -- can't safely write into it.`);
  return xml.replace(re,`<c r="${col}${row}"$1>$2<v>${esc(newVal)}</v></c>`);
}
function budFindBufferMonthsRow(zip,sheetXml){
  for(let r=20;r<=35;r++){
    const t=catCellText(zip,sheetXml,`A${r}`);
    if(t&&t.trim()==="Months of buffer to hold")return r;
  }
  return null;
}
/* ---- Budget: insert a brand-new category row ----
   Every other buffer in this app extends into genuinely blank space. Budget has
   none: Total/Splits/Emergency-Fund formulas start on the very next row after the
   category table, one of them (Ratios' liquidity check) is even referenced from a
   different sheet, and three columns (Fixed/Variable, Essential/Discretionary,
   Annual Budget) are Excel shared-formula groups anchored at row 4. Adding a
   category here means a real insert: shift every row below down by one, and for
   every formula whose own reference pointed at one of those now-moved rows, bump
   that reference too.

   Made safe by never assuming a row is at a fixed offset -- every row this
   depends on (TOTAL, Fixed, Variable, Essential, Discretionary, Essential/Total
   spend, the two EF targets, Current liquid assets, Surplus, plus the existing
   Months-of-buffer lookup) is found by matching its exact label text, and every
   formula is verified to read exactly what's expected *before* being rewritten.
   Any mismatch throws before a single byte is touched, rather than silently
   writing over the wrong cell. Re-resolves Budget_Cat/Budget_Monthly fresh on
   every call so multiple new categories queued in the same merge stack correctly
   on top of each other. */
const BUD_LABELS={
  total:"TOTAL",fixed:"Fixed",variable:"Variable",essential:"Essential",discretionary:"Discretionary",
  essSpend:"Essential spend (monthly)",totSpend:"Total spend (monthly)",
  bareMin:"Bare-minimum EF target (essential \u00d7 months)",comfortable:"Comfortable EF target (total \u00d7 months)",
  liquidAssets:"Current liquid assets (bank + cash + fd)",surplus:"Surplus / (Gap) vs bare minimum"
};
function budFindLabelRow(zip,sheetXml,label,from,to){
  for(let r=from;r<=to;r++){const t=catCellText(zip,sheetXml,`A${r}`);if(t!=null&&t.trim()===label)return r;}
  return null;
}
function budPatchFormula(sheetXml,addr,oldFormula,newFormula){
  const re=new RegExp(`(<c r="${addr}"[^>]*><f>)${oldFormula.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}(</f>)`);
  if(!re.test(sheetXml))throw new Error(`Budget sheet: expected formula "${oldFormula}" in ${addr} but the workbook's layout doesn't match -- can't safely insert a new category.`);
  return sheetXml.replace(re,(_,a,b)=>a+newFormula+b);
}
// Renames every existing <row r="N">...</row> with N>=fromRow to N+1, and every
// cell r="COLN" reference inside it to match -- highest row first, so a freed slot
// is never re-claimed by a row this same pass hasn't moved yet.
function budShiftRowsDown(sheetXml,fromRow){
  const rowNums=[...sheetXml.matchAll(/<row r="(\d+)"/g)].map(m=>+m[1]).filter(n=>n>=fromRow).sort((a,b)=>b-a);
  for(const n of rowNums){
    const re=new RegExp(`<row r="${n}"([^>]*)>([\\s\\S]*?)</row>`);
    const m=sheetXml.match(re);
    if(!m)continue;
    const newN=n+1;
    const body=m[2].replace(new RegExp(`r="([A-Z]+)${n}"`,"g"),(_,letters)=>`r="${letters}${newN}"`);
    sheetXml=sheetXml.replace(m[0],`<row r="${newN}"${m[1]}>${body}</row>`);
  }
  return sheetXml;
}
function budInsertCategoryRow(zip,sheetXml,wbXml,ratiosXml,catName,monthly,fixvarVal,essdiscVal){
  const {row0,rowN}=budResolveRows(wbXml);
  const insertRow=rowN+1;
  const oldLastRow=txnLastRow(sheetXml);
  const scanEnd=rowN+20;
  const find=(label)=>{
    const r=budFindLabelRow(zip,sheetXml,label,insertRow,scanEnd);
    if(r==null)throw new Error(`Budget sheet: couldn't find the "${label}" row below the category table -- layout doesn't match what this tool expects, so it's not safe to insert a new category automatically.`);
    return r;
  };
  const totalRow=find(BUD_LABELS.total);
  if(totalRow!==insertRow)throw new Error(`Budget sheet: expected "TOTAL" immediately below the category table (row ${insertRow}) but found it at row ${totalRow} -- can't safely insert a new category.`);
  const fixedRow=find(BUD_LABELS.fixed),variableRow=find(BUD_LABELS.variable);
  const essentialRow=find(BUD_LABELS.essential),discretionaryRow=find(BUD_LABELS.discretionary);
  const essSpendRow=find(BUD_LABELS.essSpend),totSpendRow=find(BUD_LABELS.totSpend);
  const monthsRow=budFindBufferMonthsRow(zip,sheetXml);
  if(monthsRow==null)throw new Error(`Budget sheet: couldn't find the "Months of buffer to hold" row -- can't safely insert a new category.`);
  const bareMinRow=find(BUD_LABELS.bareMin),comfortableRow=find(BUD_LABELS.comfortable);
  const liquidRow=find(BUD_LABELS.liquidAssets),surplusRow=find(BUD_LABELS.surplus);

  // 1) Rewrite formula TEXT in place, at the OLD row numbers, before anything moves.
  sheetXml=budPatchFormula(sheetXml,`D${totalRow}`,`SUM(D${row0}:D${rowN})`,`SUM(D${row0}:D${insertRow})`);
  sheetXml=budPatchFormula(sheetXml,`E${totalRow}`,`SUM(E${row0}:E${rowN})`,`SUM(E${row0}:E${insertRow})`);
  sheetXml=budPatchFormula(sheetXml,`D${fixedRow}`,`SUMIF($B$${row0}:$B$${rowN},"Fixed",$D$${row0}:$D$${rowN})`,`SUMIF($B$${row0}:$B$${insertRow},"Fixed",$D$${row0}:$D$${insertRow})`);
  sheetXml=budPatchFormula(sheetXml,`D${variableRow}`,`SUMIF($B$${row0}:$B$${rowN},"Variable",$D$${row0}:$D$${rowN})`,`SUMIF($B$${row0}:$B$${insertRow},"Variable",$D$${row0}:$D$${insertRow})`);
  sheetXml=budPatchFormula(sheetXml,`D${essentialRow}`,`SUMIF($C$${row0}:$C$${rowN},"Essential",$D$${row0}:$D$${rowN})`,`SUMIF($C$${row0}:$C$${insertRow},"Essential",$D$${row0}:$D$${insertRow})`);
  sheetXml=budPatchFormula(sheetXml,`D${discretionaryRow}`,`SUMIF($C$${row0}:$C$${rowN},"Discretionary",$D$${row0}:$D$${rowN})`,`SUMIF($C$${row0}:$C$${insertRow},"Discretionary",$D$${row0}:$D$${insertRow})`);
  sheetXml=budPatchFormula(sheetXml,`D${essSpendRow}`,`D${essentialRow}`,`D${essentialRow+1}`);
  sheetXml=budPatchFormula(sheetXml,`D${totSpendRow}`,`D${totalRow}`,`D${totalRow+1}`);
  sheetXml=budPatchFormula(sheetXml,`D${bareMinRow}`,`D${essSpendRow}*D${monthsRow}`,`D${essSpendRow+1}*D${monthsRow+1}`);
  sheetXml=budPatchFormula(sheetXml,`D${comfortableRow}`,`D${totSpendRow}*D${monthsRow}`,`D${totSpendRow+1}*D${monthsRow+1}`);
  sheetXml=budPatchFormula(sheetXml,`D${surplusRow}`,`D${liquidRow}-D${bareMinRow}`,`D${liquidRow+1}-D${bareMinRow+1}`);

    `<c r="A${insertRow}" s="${styleOf("A")}" t="inlineStr"><is><t>${esc(catName)}</t></is></c>`+
    `<c r="B${insertRow}" s="${styleOf("B")}" t="str"><f t="shared" si="0"/><v>${esc(fixvarVal||"")}</v></c>`+
    `<c r="C${insertRow}" s="${styleOf("C")}" t="str"><f t="shared" si="1"/><v>${esc(essdiscVal||"")}</v></c>`+
    `<c r="D${insertRow}" s="${styleOf("D")}"><v>${mVal}</v></c>`+
    `<c r="E${insertRow}" s="${styleOf("E")}"><f t="shared" si="2"/><v>${mVal*12}</v></c>`+
    `</row>`;
  sheetXml=sheetXml.replace(new RegExp(`<row r="${insertRow+1}"`),newRow+`<row r="${insertRow+1}"`);

  sheetXml=xmlBumpDimensionRow(sheetXml,oldLastRow+1);
  wbXml=wbSetDefinedNameRef(wbXml,"Budget_Cat",`Budget!$A$${row0}:$A$${insertRow}`);
  wbXml=wbSetDefinedNameRef(wbXml,"Budget_Monthly",`Budget!$D$${row0}:$D$${insertRow}`);

function budApplyQueue(zip,sheetXml,wbXml,ratiosXml,queue){
  const applied=[],failed=[],log=[];
  let rows=null,rowsErr=null;
  try{rows=budResolveRows(wbXml);}catch(e){rowsErr=e;}
  for(const q of queue){
    try{
      if(q.action==="editMonthly"){
        if(!rows)throw rowsErr;
        const row=budFindRow(zip,sheetXml,rows.catCol,rows.row0,rows.rowN,q.cat);
        if(row==null)throw new Error(`Couldn't find category "${q.cat}" in this copy of the workbook's Budget sheet.`);
        sheetXml=capSetCell(sheetXml,rows.moCol,row,"num",q.monthly);
        log.push(`Set "${q.cat}" monthly budget to ${q.monthly}`);
      }else if(q.action==="editBufferMonths"){
        const row=budFindBufferMonthsRow(zip,sheetXml);
        if(row==null)throw new Error(`Couldn't find the "Months of buffer to hold" row in this copy of the workbook's Budget sheet.`);
        sheetXml=capSetCell(sheetXml,"D",row,"num",q.months);
        log.push(`Set emergency-fund buffer to ${q.months} months`);
      }else if(q.action==="addCat"){
        // Buffer-fill model (matches Category Master) -- the Budget sheet's category
        // table is a fixed 21-row buffer (11 original + 10 reserved blank rows added
        // once, by hand, in Excel itself, so its own reference-adjustment engine --
        // not our regex-based insert code -- handled every SUMIF/defined-name/
        // cross-sheet shift correctly). No row is ever inserted or shifted here
        // anymore; a queued addCat just claims the next blank row. Once every
        // reserved row is used, this throws the same "buffer is full" shape as
        // Category Master, rather than attempting anything formula-shifting.
        // budInsertCategoryRow/budShiftRowsDown/budPatchFormula/budFindLabelRow/
        // budFindBufferMonthsRow are intentionally no longer called from here --
        // left defined, not deleted, in case a pre-migration copy of the workbook
        // (without the 10 reserved rows) is ever merged against.
        if(!rows)throw rowsErr;
        const already=budFindRow(zip,sheetXml,rows.catCol,rows.row0,rows.rowN,q.cat);
        if(already!=null)throw new Error(`"${q.cat}" already has a Budget row (row ${already}) in this copy of the workbook -- nothing to insert.`);
        const blankRow=budFindBlankCategoryRow(zip,sheetXml,rows.catCol,rows.row0,rows.rowN);
        if(blankRow==null)throw new Error(`Budget category buffer is full (${rows.rowN-rows.row0+1} slots used) -- ask Claude to extend it.`);
        sheetXml=capSetCell(sheetXml,rows.catCol,blankRow,"str",q.cat);
        sheetXml=capSetCell(sheetXml,rows.moCol,blankRow,"num",q.monthly);
        sheetXml=capSetFormulaCellValue(sheetXml,"B",blankRow,q.fixvar||"");
        sheetXml=capSetFormulaCellValue(sheetXml,"C",blankRow,q.essdisc||"");
        sheetXml=capSetFormulaCellValue(sheetXml,"E",blankRow,(+q.monthly||0)*12);
        log.push(`Added "${q.cat}" as a new Budget category (row ${blankRow}), monthly ${q.monthly}`);
      }
      applied.push(q.id);
    }catch(err){failed.push({id:q.id,error:err.message||String(err)});}
  }
  return{sheetXml,wbXml,ratiosXml,applied,failed,log};
}

/* ---- Deductions: insert/edit/remove a Chapter VI-A section row ----
   Mirrors budInsertCategoryRow/budShiftRowsDown exactly, for the same reason:
   this table has zero spare rows either -- HRA and both Total formulas sit
   immediately below the last section with no buffer in between. Every row this
   depends on (HRA, Total-Old, Total-New, HRA's own Basic/HRA/Rent/Option-1-2-3/
   Exemption input rows) is found and verified by exact content match before a
   single byte is touched -- any mismatch throws rather than silently writing
   over the wrong cell, same precedent as Budget's own insertion engine. */
function dedFindRow(zip,sheetXml,row0,rowN,code){
  for(let r=row0;r<=rowN;r++)if(catCellText(zip,sheetXml,`A${r}`)===code)return r;
  return null;
}
function dedFormulaEsc(s){return esc(s).replace(/"/g,"&quot;");}
function dedPatchFormula(sheetXml,addr,oldFormula,newFormula){
  const oldEsc=dedFormulaEsc(oldFormula).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const re=new RegExp(`(<c r="${addr}"[^>]*><f aca="false">)${oldEsc}(</f>)`);
  if(!re.test(sheetXml))throw new Error(`Deductions sheet: expected formula "${oldFormula}" in ${addr} but the workbook's layout doesn't match -- can't safely write here.`);
  return sheetXml.replace(re,(_,a,b)=>a+dedFormulaEsc(newFormula)+b);
}
// Mirror image of budShiftRowsDown: renumbers every existing <row r="N"> with
// N>fromRow DOWN to N-1 -- LOWEST first this time, so a freed slot is never
// re-claimed by a row this same pass hasn't moved yet. Caller deletes the row
// AT fromRow itself before calling this.
function dedShiftRowsUp(sheetXml,fromRow){
  const rowNums=[...sheetXml.matchAll(/<row r="(\d+)"/g)].map(m=>+m[1]).filter(n=>n>fromRow).sort((a,b)=>a-b);
  for(const n of rowNums){
    const re=new RegExp(`<row r="${n}"([^>]*)>([\\s\\S]*?)</row>`);
    const m=sheetXml.match(re);
    if(!m)continue;
    const newN=n-1;
    const body=m[2].replace(new RegExp(`r="([A-Z]+)${n}"`,"g"),(_,letters)=>`r="${letters}${newN}"`);
    sheetXml=sheetXml.replace(m[0],`<row r="${newN}"${m[1]}>${body}</row>`);
  }
  return sheetXml;
}
// Locates HRA + both Totals + HRA's own input rows below the fixed 10-row
// section table (row0..rowN), shared by insert and remove. Throws loud on any
// layout mismatch rather than guessing.
function dedLocateHraBlock(zip,sheetXml,rowN){
  const hraRow=rowN+1;
  if(catCellText(zip,sheetXml,`A${hraRow}`)!=="HRA")throw new Error(`Deductions sheet: expected "HRA" at row ${hraRow} -- can't safely write here.`);
  const totalOldRow=hraRow+1,totalNewRow=hraRow+2;
  if(catCellText(zip,sheetXml,`B${totalOldRow}`)!=="Total allowed \u2014 OLD regime")throw new Error(`Deductions sheet: expected the OLD-regime total at row ${totalOldRow} -- can't safely write here.`);
  if(catCellText(zip,sheetXml,`B${totalNewRow}`)!=="Total allowed \u2014 NEW regime")throw new Error(`Deductions sheet: expected the NEW-regime total at row ${totalNewRow} -- can't safely write here.`);
  const findC=(label,from,to)=>{for(let r=from;r<=to;r++){if(catCellText(zip,sheetXml,`C${r}`)===label)return r;}return null;};
  const scanEnd=hraRow+20;
  const basicRow=findC("Basic/month",hraRow,scanEnd),hraInpRow=findC("HRA/month",hraRow,scanEnd),rentRow=findC("Rent/month",hraRow,scanEnd),exemptRow=findC("Exemption",hraRow,scanEnd);
  if(basicRow==null||hraInpRow==null||rentRow==null||exemptRow==null)throw new Error(`Deductions sheet: couldn't find all of HRA's own input rows (Basic/HRA/Rent/Exemption) -- can't safely write here.`);
  return{hraRow,totalOldRow,totalNewRow,basicRow,hraInpRow,rentRow,exemptRow,opt1Row:exemptRow-3,opt2Row:exemptRow-2,opt3Row:exemptRow-1};
}
const DED_ROW0=5; // the section table always starts here
// Resolved FRESH every call, never a stale constant carried across queue entries --
// same reasoning as budResolveRows()/catApplyQueue's own re-resolve-per-call
// comment: an insert earlier in the SAME queue grows this table, so a later edit/
// remove in that same run must see the grown size, not whatever it was at page load.
function dedCurrentRowN(zip,sheetXml){
  for(let r=DED_ROW0;r<DED_ROW0+50;r++){
    if(catCellText(zip,sheetXml,`A${r}`)==="HRA")return r-1;
  }
  throw new Error(`Deductions sheet: couldn't find "HRA" below row ${DED_ROW0} to size the section table -- can't safely write here.`);
}
function dedInsertEntryRow(zip,sheetXml,wbXml,entry){
  const rowN=dedCurrentRowN(zip,sheetXml);
  const insertRow=rowN+1; // where HRA currently sits
  const b=dedLocateHraBlock(zip,sheetXml,rowN);
  const{hraRow,totalOldRow,totalNewRow,basicRow,hraInpRow,rentRow,exemptRow,opt1Row,opt2Row,opt3Row}=b;

  // 1) Rewrite formula TEXT in place, at the OLD row numbers, bumping every
  //    reference to a row that's ALSO about to shift by +1.
  sheetXml=dedPatchFormula(sheetXml,`E${hraRow}`,`D${exemptRow}`,`D${exemptRow+1}`);
  sheetXml=dedPatchFormula(sheetXml,`F${totalOldRow}`,`SUMIF(C${DED_ROW0}:C${hraRow},"Old",F${DED_ROW0}:F${hraRow})+SUMIF(C${DED_ROW0}:C${hraRow},"Both",F${DED_ROW0}:F${hraRow})`,`SUMIF(C${DED_ROW0}:C${hraRow+1},"Old",F${DED_ROW0}:F${hraRow+1})+SUMIF(C${DED_ROW0}:C${hraRow+1},"Both",F${DED_ROW0}:F${hraRow+1})`);
  sheetXml=dedPatchFormula(sheetXml,`F${totalNewRow}`,`SUMIF(C${DED_ROW0}:C${hraRow},"Both",F${DED_ROW0}:F${hraRow})`,`SUMIF(C${DED_ROW0}:C${hraRow+1},"Both",F${DED_ROW0}:F${hraRow+1})`);
  sheetXml=dedPatchFormula(sheetXml,`D${opt1Row}`,`D${hraInpRow}*12`,`D${hraInpRow+1}*12`);
  sheetXml=dedPatchFormula(sheetXml,`D${opt2Row}`,`D${basicRow}*40%*12`,`D${basicRow+1}*40%*12`);
  sheetXml=dedPatchFormula(sheetXml,`D${opt3Row}`,`D${rentRow}*12-D${basicRow}*12*10%`,`D${rentRow+1}*12-D${basicRow+1}*12*10%`);
  sheetXml=dedPatchFormula(sheetXml,`D${exemptRow}`,`MIN(D${opt1Row}:D${opt3Row})`,`MIN(D${opt1Row+1}:D${opt3Row+1})`);

  // 2) Shift every row at/after the insertion point down by one.
  sheetXml=budShiftRowsDown(sheetXml,insertRow);

  // 3) Build and insert the new section row, styled off the last real section row.
  const styleOf=(col)=>{
    const m=sheetXml.match(new RegExp(`<c r="${col}${rowN}" s="(\\d+)"`));
    if(!m)throw new Error(`Deductions sheet: couldn't read style for column ${col} at row ${rowN} to build the new section row.`);
    return m[1];
  };
  const limitOut=entry.limit>=999999999?999999999:(+entry.limit||0);
  const newRow=`<row r="${insertRow}" customFormat="false" ht="15" hidden="false" customHeight="true" outlineLevel="0" collapsed="false">`+
    `<c r="A${insertRow}" s="${styleOf("A")}" t="inlineStr"><is><t>${esc(entry.code||"")}</t></is></c>`+
    `<c r="B${insertRow}" s="${styleOf("B")}" t="inlineStr"><is><t>${esc(entry.desc||"")}</t></is></c>`+
    `<c r="C${insertRow}" s="${styleOf("C")}" t="inlineStr"><is><t>${esc(entry.regime||"Old")}</t></is></c>`+
    `<c r="D${insertRow}" s="${styleOf("D")}" t="n"><v>${limitOut}</v></c>`+
    `<c r="E${insertRow}" s="${styleOf("E")}" t="n"><v>${(+entry.claimed||0)}</v></c>`+
    `<c r="F${insertRow}" s="${styleOf("F")}" t="n"><f aca="false">MIN(D${insertRow},E${insertRow})</f><v>${Math.min(limitOut,(+entry.claimed||0))}</v></c>`+
    `</row>`;
  sheetXml=sheetXml.replace(new RegExp(`<row r="${insertRow+1}"`),newRow+`<row r="${insertRow+1}"`);

  // 4) Dimension + defined names (Ded_Old/Ded_New track the Total cells, which just moved).
  const oldLastRow=txnLastRow(sheetXml);
  sheetXml=xmlBumpDimensionRow(sheetXml,oldLastRow+1);
  wbXml=wbSetDefinedNameRef(wbXml,"Ded_Old",`Deductions!$F$${totalOldRow+1}`);
  wbXml=wbSetDefinedNameRef(wbXml,"Ded_New",`Deductions!$F$${totalNewRow+1}`);
  return{sheetXml,wbXml};
}
function dedRemoveEntryRow(zip,sheetXml,wbXml,matchCode){
  const rowN=dedCurrentRowN(zip,sheetXml);
  const targetRow=dedFindRow(zip,sheetXml,DED_ROW0,rowN,matchCode);
  if(targetRow==null)return{sheetXml,wbXml,found:false}; // already gone -- not an error, nothing to do
  const b=dedLocateHraBlock(zip,sheetXml,rowN);
  const{hraRow,totalOldRow,totalNewRow,basicRow,hraInpRow,rentRow,exemptRow,opt1Row,opt2Row,opt3Row}=b;

  // 1) Rewrite formula TEXT in place at OLD positions, bumping references DOWN
  //    by one (the mirror image of insertion's +1 bump).
  sheetXml=dedPatchFormula(sheetXml,`E${hraRow}`,`D${exemptRow}`,`D${exemptRow-1}`);
  sheetXml=dedPatchFormula(sheetXml,`F${totalOldRow}`,`SUMIF(C${DED_ROW0}:C${hraRow},"Old",F${DED_ROW0}:F${hraRow})+SUMIF(C${DED_ROW0}:C${hraRow},"Both",F${DED_ROW0}:F${hraRow})`,`SUMIF(C${DED_ROW0}:C${hraRow-1},"Old",F${DED_ROW0}:F${hraRow-1})+SUMIF(C${DED_ROW0}:C${hraRow-1},"Both",F${DED_ROW0}:F${hraRow-1})`);
  sheetXml=dedPatchFormula(sheetXml,`F${totalNewRow}`,`SUMIF(C${DED_ROW0}:C${hraRow},"Both",F${DED_ROW0}:F${hraRow})`,`SUMIF(C${DED_ROW0}:C${hraRow-1},"Both",F${DED_ROW0}:F${hraRow-1})`);
  sheetXml=dedPatchFormula(sheetXml,`D${opt1Row}`,`D${hraInpRow}*12`,`D${hraInpRow-1}*12`);
  sheetXml=dedPatchFormula(sheetXml,`D${opt2Row}`,`D${basicRow}*40%*12`,`D${basicRow-1}*40%*12`);
  sheetXml=dedPatchFormula(sheetXml,`D${opt3Row}`,`D${rentRow}*12-D${basicRow}*12*10%`,`D${rentRow-1}*12-D${basicRow-1}*12*10%`);
  sheetXml=dedPatchFormula(sheetXml,`D${exemptRow}`,`MIN(D${opt1Row}:D${opt3Row})`,`MIN(D${opt1Row-1}:D${opt3Row-1})`);

  // 2) Delete the target row entirely, then shift everything below it up by one.
  const re=new RegExp(`<row r="${targetRow}"[^>]*>[\\s\\S]*?</row>`);
