/* ---- Holdings: transaction-derived acquire/reduce ----
   A Buy/Sell-shaped transaction can create or update a holding, but it can't tell
   us WHICH holding or how many units on its own -- that's what the "Holding
   details" section of Add (wired in renderCapAdd) collects. This applies
   that selection: tops up or reduces units (or invested amount, for non-unit
   holdings like FDs) and queues the change for merge into the Investments buffer
   (Investments!A63:I112). Known limitation, same category as Category/Account
   removal not touching past transactions: editing or deleting a past Buy/Sell
   later does NOT retroactively re-adjust the holding -- this is a one-way ratchet
   applied at entry time, not a full recomputation from transaction history. */
function acctIsInvestment(name){const a=acctByName(name);return a&&a.kind==="Investment";}
function acctByName(n){return (S.accounts||[]).find(a=>a.name===n);}
// Does this transaction touch an Investment-kind account in a way that could mean
// acquiring or reducing a holding? "Internal" transfers (moving float between your
// own accounts, e.g. topping up brokerage cash without buying anything specific)
// are excluded -- the existing "uninvested cash" plug already handles those.
function holdDirection(x){
  const k=KINDS[x.kind]||{};
  if(k.cf==="Internal")return null;
  if(acctIsInvestment(x.to))return{dir:"acquire",acct:x.to};
  if(acctIsInvestment(x.from))return{dir:"reduce",acct:x.from};
  return null;
}
function holdRequired(x){return x.kind==="Invest - Buy"||x.kind==="Divest - Sell";}
function holdFindIx(name,acct){return (S.holdings||[]).findIndex(h=>h.name===name&&h.acct===acct);}
function holdUsageNote(h){return h.units!=null?`${h.units} units @ avg ${capFmtN(h.avg)}`:`${capFmtN(h.minv)} invested`;}

/* ===== LOT TRACKING (Phase 0) =====
   Only the Add-overlay's Buy/Sell transaction flow (applyHoldingTxn, below)
   ever touches lots -- the Investments tab's own "fix a holding directly"
   form is explicitly for opening balances/corrections/non-cash events, not
   a taxable buy or sell, so it stays exactly as it was and never creates or
   consumes a lot.

   A holding's real lots (h.lots) only ever cover units bought either (a)
   through this app going forward ("ledger" source) or (b) entered via the
   "Import historical lots" screen on the Investments tab ("opening"
   source). Anything else -- units the holding shows today with no lot
   backing at all -- is a permanent, honest gap: rather than guess a date or
   block usage, getEffectiveLots() synthesizes a virtual "unclassified" lot
   for exactly that gap, sitting at the front of FIFO (oldest), with no cost
   or date. Any sale that draws from it produces a capital-gains event
   flagged source:"unclassified" -- Phase 3 excludes those from computed
   totals rather than guess, per the "never block, never silently guess"
   call already made for this feature. */
function getEffectiveLots(h){
  const real=(h.lots||[]).slice().sort((a,b)=>new Date(a.acqDate)-new Date(b.acqDate));
  const realQty=real.reduce((s,l)=>s+l.qty,0);
  const gap=Math.max(0,(h.units||0)-realQty);
  return gap>1e-9?[{qty:gap,costPerUnit:null,acqDate:null,source:"unclassified"},...real]:real;
}
function lotCoverage(h){
  const realQty=(h.lots||[]).reduce((s,l)=>s+l.qty,0);
  return{accounted:Math.min(realQty,h.units||0),total:h.units||0};
}
function addLedgerLot(h,qty,costPerUnit,acqDate,fxPerUnit,fxCurrency){
  if(qty<=0)return;
  h.lots=h.lots||[];
  const lot={qty,costPerUnit,acqDate,source:"ledger"};
  /* Phase 3b: an RSU/ESPP lot can ALSO carry its original foreign-currency
     cost per unit, captured at logging time in the Add-transaction overlay.
     costPerUnit (\u20b9) still drives the ledger's own avg/units bookkeeping
     unchanged; fxPerUnit/fxCurrency are purely additive, read later by
     capGainsBreakdown() to redo the cost-basis side of the CG calc at the
     correct Rule-115 rate instead of trusting whatever \u20b9 figure the
     ledger amount implied. Left undefined for every non-FX holding. */
  if(fxPerUnit!=null){lot.fxPerUnit=fxPerUnit;lot.fxCurrency=fxCurrency||"USD";}
  h.lots.push(lot);
  lotQueue("addLot",{holdName:h.name,acct:h.acct,acqDate,qty,costPerUnit,source:"ledger",fxPerUnit:lot.fxPerUnit||null,fxCurrency:lot.fxCurrency||null});
}
/* FIFO-consumes qtySell units (virtual unclassified lot first, then real
   lots oldest-first), splitting the last lot touched as needed, and
   returns one capital-gains-event record per lot slice consumed --
   Phase 3's raw material, not yet tax-computed here. Mutates h.lots in
   place to reflect the consumption (removing/shrinking real lots); the
   virtual unclassified lot needs no mutation since it's recomputed fresh
   from h.units every time.
   fxProceedsTotal/fxCurrency (Phase 3b, optional): the TOTAL foreign-
   currency proceeds for this whole sale, apportioned pro-rata by qty
   across every lot slice consumed -- same treatment as the \u20b9
   `proceeds` argument already gets via perUnitProceeds below. */
function consumeLotsFifo(h,qtySell,saleDate,proceeds,fxProceedsTotal,fxCurrency){
  const lots=getEffectiveLots(h);
  let remaining=qtySell;
  const events=[];
  const perUnitProceeds=qtySell>0?proceeds/qtySell:0;
  const fxPerUnitProceeds=(fxProceedsTotal!=null&&qtySell>0)?fxProceedsTotal/qtySell:null;
  const consumed=[];
  for(const lot of lots){
    if(remaining<=1e-9)break;
    const take=Math.min(lot.qty,remaining);
    const ev={
      id:capUid(),holdName:h.name,acct:h.acct,cls:h.cls,type:h.type,
      mfCategory:h.mfCategory||null,qty:take,
      costBasis:lot.costPerUnit!=null?take*lot.costPerUnit:null,
      acqDate:lot.acqDate,saleDate,proceeds:take*perUnitProceeds,source:lot.source
    };
    if(lot.fxPerUnit!=null&&fxPerUnitProceeds!=null){
      ev.fxCostBasis=take*lot.fxPerUnit;
      ev.fxProceeds=take*fxPerUnitProceeds;
      ev.fxCurrency=lot.fxCurrency||fxCurrency||"USD";
    }
    events.push(ev);
    if(lot.source!=="unclassified"){
      consumed.push({lot,take});
      cgQueue(ev.id); // queued as a pointer, not a snapshot -- see cgQueue()'s own comment for why
    }
    remaining-=take;
  }
  /* Queue the Excel-side effect of each real lot's consumption BEFORE
     mutating quantities -- the lookup key (holdName/acct/acqDate/costPerUnit)
     must describe the row as it currently exists in the sheet; only qty
     changes on an edit, and date/cost never do, so capturing them post-
     mutation would still work here, but capturing pre-mutation keeps this
     unambiguous even if that ever changes. */
  consumed.forEach(({lot,take})=>{
    const newQty=lot.qty-take;
    const key={holdName:h.name,acct:h.acct,acqDate:lot.acqDate,costPerUnit:lot.costPerUnit};
    if(newQty>1e-9)lotQueue("editLot",{...key,qty:newQty});
    else lotQueue("removeLot",key);
  });
  consumed.forEach(({lot,take})=>{lot.qty-=take;});
  h.lots=(h.lots||[]).filter(l=>l.qty>1e-9);
  return events;
}

/* ===== IMPORT HISTORICAL LOTS (Phase 0, Investments tab) =====
   One row per historical lot: Name, Ticker (optional), Date, Quantity, Price.
   Matches an existing holding by ticker (case-insensitive exact), falling
   back to name; creates a brand-new holding if neither matches, so this
   also works as a bulk "add holdings I haven't entered at all yet" import.
   For an EXISTING holding, only h.lots grows -- units/avg/price (the
   already-tracked roll-ups) are deliberately left untouched, since the
   import is enriching the historical breakdown of units that are already
   accounted for, not redefining the position itself. Re-importing, or
   importing in batches, is safe: lots are appended, never replaced. */
function parseCsvText(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length)return{header:[],rows:[]};
  const splitLine=l=>{
    const out=[];let cur="",inQ=false;
    for(let i=0;i<l.length;i++){const c=l[i];
      if(c==='"'){inQ=!inQ;continue;}
      if(c===","&&!inQ){out.push(cur);cur="";continue;}
      cur+=c;
    }
    out.push(cur);
    return out.map(s=>s.trim());
  };
  const header=splitLine(lines[0]).map(h=>h.toLowerCase());
  return{header,rows:lines.slice(1).map(splitLine)};
}
function normalizeCsvDate(s){
  s=(s||"").trim();if(!s)return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m)return `${m[3]}-${String(+m[2]).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`; /* DD-MM-YYYY / DD/MM/YYYY, matches Indian broker exports */
  return null;
}
function importHistoricalLots(text){
  const{header,rows}=parseCsvText(text);
  const find=(...names)=>{for(const n of names){const i=header.indexOf(n);if(i>=0)return i;}return -1;};
  const iName=find("name"),iTicker=find("ticker","symbol"),iDate=find("date"),iQty=find("quantity","qty","units"),iPrice=find("price","cost","rate"),iAcct=find("account","acct");
  if(iName<0||iDate<0||iQty<0||iPrice<0)return{ok:false,msg:"CSV needs Name, Date, Quantity and Price columns (Ticker and Account are optional)."};
  const newHoldings=new Set();
  let lotsImported=0,rowsSkipped=0;
  rows.forEach(r=>{
    if(!r.some(c=>c&&c.trim()))return;
    const name=(r[iName]||"").trim();
    const ticker=iTicker>=0?(r[iTicker]||"").trim():"";
    const date=normalizeCsvDate(r[iDate]);
    const qty=+r[iQty]||0,price=+r[iPrice]||0;
    if(!name||!date||qty<=0){rowsSkipped++;return;}
    /* Account column is optional, but when present it's matched strictly
       alongside Name/Ticker -- the same stock held in two different accounts
       (e.g. two different demat accounts) must stay two separate holdings,
       since Capital Gains (Phase 3) computes gains per holding and a lot
       landing in the wrong account's holding would misattribute the sale
       later. Backward compatible: a CSV with no Account column at all keeps
       the old looser behavior (match by Name/Ticker only, ignoring account)
       so existing import files don't suddenly stop matching. */
    const acct=iAcct>=0?(r[iAcct]||"").trim():null;
    let h;
    if(acct!=null){
      h=ticker?S.holdings.find(x=>x.symbol&&x.symbol.toLowerCase()===ticker.toLowerCase()&&(x.acct||"")===acct):null;
      if(!h)h=S.holdings.find(x=>x.name&&x.name.toLowerCase()===name.toLowerCase()&&(x.acct||"")===acct);
    }else{
      h=ticker?S.holdings.find(x=>x.symbol&&x.symbol.toLowerCase()===ticker.toLowerCase()):null;
      if(!h)h=S.holdings.find(x=>x.name&&x.name.toLowerCase()===name.toLowerCase());
    }
    if(!h){
      h={cls:"Equity",type:"Stock",name,acct:acct||"",units:0,avg:0,price:0,minv:null,mval:null,symbol:ticker||null,lots:[]};
      S.holdings=[...S.holdings,h];
      newHoldings.add(h);
    }
    h.lots=h.lots||[];
    h.lots.push({qty,costPerUnit:price,acqDate:date,source:"opening"});
    lotQueue("addLot",{holdName:h.name,acct:h.acct,acqDate:date,qty,costPerUnit:price,source:"opening",fxPerUnit:null,fxCurrency:null});
    lotsImported++;
  });
  newHoldings.forEach(h=>{
    const totalQty=h.lots.reduce((s,l)=>s+l.qty,0);
    const totalCost=h.lots.reduce((s,l)=>s+l.qty*(l.costPerUnit||0),0);
    h.units=totalQty;h.avg=totalQty?totalCost/totalQty:0;h.price=h.lots[h.lots.length-1].costPerUnit||h.avg;
  });
  persist();
  return{ok:true,lotsImported,holdingsCreated:newHoldings.size,rowsSkipped};
}

/* Applies a Buy or Sell to a holding (existing or brand-new), mutating S.holdings
   immediately and queuing the change. sel is one of:
   {mode:"existing", ix, units}  -- units only matters for unit-based holdings
   {mode:"new", cls, type, name, unitsBased, units}  -- acquire only
   fx (Phase 3b, optional): {amount, currency} -- the TOTAL foreign-currency
   amount for this whole Buy/Sell (per-unit for a Buy is derived below by
   dividing by units; for a Sell it's the total proceeds, same shape as the
   \u20b9 `amt` argument). Only meaningful for RSU/ESPP holdings; harmless
   (ignored) for anything else since addLedgerLot/consumeLotsFifo just leave
   the fx fields undefined when it's not passed.
   Returns {ok,msg}; blocks reductions that would go negative. */
function applyHoldingTxn(dir,acctName,sel,amt,date,fx){
  if(sel.mode==="existing"){
    const h=S.holdings[sel.ix];
    if(!h)return{ok:false,msg:"Holding not found"};
    const unitsBased=h.units!=null;
    if(unitsBased){
      const units=+sel.units||0;
      if(units<=0)return{ok:false,msg:"Enter units"};
      const price=amt/units;
      if(dir==="acquire"){
        const newUnits=(h.units||0)+units;
        const newAvg=((h.units||0)*(h.avg||0)+amt)/newUnits;
        Object.assign(h,{units:newUnits,avg:newAvg,price});
        addLedgerLot(h,units,price,date,fx?fx.amount/units:undefined,fx?fx.currency:undefined);
      }else{
        if(units>h.units+1e-9)return{ok:false,msg:`Only ${h.units} units held \u2014 can't sell ${units}.`};
        const events=consumeLotsFifo(h,units,date,amt,fx?fx.amount:undefined,fx?fx.currency:undefined); /* uses h.units BEFORE the decrement below, so the gap is measured correctly */
        S.capGainsEvents=[...(S.capGainsEvents||[]),...events];
        Object.assign(h,{units:h.units-units,price});
      }
    }else{
      if(dir==="acquire"){
        h.minv=(h.minv||0)+amt;h.mval=(h.mval||0)+amt;
      }else{
        if(amt>h.minv+1e-9)return{ok:false,msg:`Only ${capFmtN(h.minv)} invested \u2014 can't reduce by ${capFmtN(amt)}.`};
        h.minv=(h.minv||0)-amt;h.mval=(h.mval||0)-amt;
      }
    }
    holdQueue("editHold",{...h});
    persist();
    return{ok:true};
  }else{
    if(dir!=="acquire")return{ok:false,msg:"Can't sell a holding that doesn't exist yet \u2014 pick an existing one"};
    const name=(sel.name||"").trim();
    if(!name)return{ok:false,msg:"Enter a holding name"};
    if(holdFindIx(name,acctName)>=0)return{ok:false,msg:"That holding already exists \u2014 pick it from the list instead"};
    let h;
    if(sel.unitsBased){
      const units=+sel.units||0;
      if(units<=0)return{ok:false,msg:"Enter units"};
      const price=amt/units;
      h={cls:sel.cls,type:sel.type,name,acct:acctName,units,avg:price,price,minv:null,mval:null,symbol:sel.symbol||null,mfCategory:sel.mfCategory||null,lots:[]};
      addLedgerLot(h,units,price,date,fx?fx.amount/units:undefined,fx?fx.currency:undefined);
    }else{
      h={cls:sel.cls,type:sel.type,name,acct:acctName,units:null,avg:null,price:null,minv:amt,mval:amt,symbol:sel.symbol||null};
    }
    S.holdings=[...(S.holdings||[]),h];
    holdQueue("addHold",{...h});
    persist();
    return{ok:true};
  }
}
function holdQueue(action,data){
  HOLD_QUEUE.push({id:capUid(),action,createdAt:new Date().toISOString(),...data});
  holdPersistQueue();
}
/* lotQueue: queues one row-level change for the Investment Lots sheet.
   A lot has no ID of its own in the workbook (unlike CAP_QUEUE/HOLD_QUEUE
   entries, which reference a real row by name+account) -- it's matched by
   Holding+Account+Acquisition Date+Cost/Unit together (lotsFindRow), since
   that's the natural key a lot is uniquely identified by once written.
   "addLot": a brand-new row. "editLot": an existing lot's quantity shrank
   (a partial FIFO consumption) -- looked up by its ORIGINAL identifying
   fields (date/cost don't change on a partial sell, only qty does).
   "removeLot": a lot was fully consumed -- same lookup, blank the row. */
function lotQueue(action,data){
  LOT_QUEUE.push({id:capUid(),action,createdAt:new Date().toISOString(),...data});
  lotPersistQueue();
}
/* dedQueue: queues one row-level change for the Deductions sheet's Chapter VI-A
   table. Matched by Section code (dedFindRow) -- the same key the read-import
   already uses. "addEntry": a brand-new section (the "+ Add section" button) --
   this table has ZERO spare rows (HRA and both Total formulas sit immediately
   below the last section with no buffer), so applying this queue entry means a
   REAL row insertion, not a buffer-row write (see dedInsertEntryRow). "editEntry":
   any of code/desc/regime/limit/claimed changed -- looked up by the section's
   ORIGINAL code (matchCode), captured before the mutation, same as Lots'
   "original identifying fields" precedent. "removeEntry": a section was deleted
   -- same lookup, but removing a row here also needs a real shift-up (the mirror
   image of the insert), not a blank-out, since (again) there's no buffer. */
function dedQueue(action,data){
  DED_QUEUE.push({id:capUid(),action,createdAt:new Date().toISOString(),...data});
  dedPersistQueue();
}
/* payQueue: queues one row-level change for the Tax Payments sheet. No ID exists
   on the sheet side (same situation as Lots), so it's matched by Type+Date+
   Amount+Section together (payFindRow) -- the same natural key the read-import
   already uses, with the same known limitation: two genuinely different
   payments sharing all four fields would collide. "editPayment"/"removePayment"
   carry matchKey captured from the record's ORIGINAL fields (before this
   specific edit), same "original identifying fields" precedent as Lots. */
function payQueue(action,data){
  PAY_QUEUE.push({id:capUid(),action,createdAt:new Date().toISOString(),...data});
  payPersistQueue();
}
/* cgQueue: queues a candidate row for the Capital Gains sheet. Only ever
   "addEvent", and only ever a pointer ({eventId}), NOT a snapshot of the
   event's fields at queue time -- consumeLotsFifo() queues this the moment a
   real Sell creates the event, which for a Mutual Fund/Index Fund/ELSS type is
   usually BEFORE mfCategory has been set (that happens later, via the inline
   selector on the Capital Gains tab). Storing a pointer and re-reading
   S.capGainsEvents fresh at merge time means a category set well after the Sell
   still gets picked up correctly, rather than the queue holding a stale "not
   yet classified" snapshot forever. Only app-native events reach this function
   at all -- sheet-imported rows never pass through consumeLotsFifo(). */
function cgQueue(eventId){
  CG_QUEUE.push({id:capUid(),action:"addEvent",eventId,createdAt:new Date().toISOString()});
  cgPersistQueue();
}
/* trQueue: queues one full Tax Rules save. Unlike every other queue, this is a
   flat settings object, not a list -- there's no add/edit/remove distinction,
   no row to find, and no dedup concern (multiple queued saves just overwrite
   the same cells in order, last one wins, which is correct). Only the fields
   #tr_save actually edits get written -- AdvSched/FD_TDS/AL_Threshold have no
   form control here and are deliberately left untouched. */
function trQueue(rules){
  TR_QUEUE.push({id:capUid(),action:"save",rules,createdAt:new Date().toISOString()});
  trPersistQueue();
}
/* fdQueue: queues one row-level change for the Fixed Deposits sheet. No ID
   exists on the sheet side (same situation as Lots/Tax Payments), so it's
   matched by Bank+Principal+Start together (fdFindRow) -- the SAME natural
   key the read-import already uses (see importWB()'s Fixed Deposits dupeKey,
   `${f.bank}|${principal cents}|${f.start}`). "editFD"/"removeFD" carry
   matchKey captured from the record's ORIGINAL fields (before this specific
   edit), same "original identifying fields" precedent as Lots/Tax Payments.
   Value-@-As-of/Interest-this-FY are never written here, for the same reason
   the read-import never reads them either: the sheet computes those itself
   from the terms this DOES write, and the app recomputes the same numbers
   independently via fixedDepositsBreakdown() -- importing or exporting a
   pre-computed number would silently drift the moment the two disagreed. */
function fdQueue(action,data){
  FD_QUEUE.push({id:capUid(),action,createdAt:new Date().toISOString(),...data});
  fdPersistQueue();
}
/* msQueue: queues one full Read Me & Rules settings save. Same shape as
   trQueue -- a flat settings object, not a list, so no row to find and no
   dedup concern (multiple queued saves just overwrite the same three cells
   in order, last one wins, which is correct). */
function msQueue(settings){
  MS_QUEUE.push({id:capUid(),action:"save",settings,createdAt:new Date().toISOString()});
  msPersistQueue();
}

/* ---- Budget management ----
   The Budget sheet's category table is now a fixed 21-row buffer (11 original
   categories + 10 reserved blank rows, added once by hand in Excel -- see
   budFindBlankCategoryRow below), the same shape as the Category Master buffer.
   Editing an existing row is a plain cell overwrite. Adding a brand-new category
   claims the next blank row rather than inserting one, so nothing below the table
   ever has to shift and no formula reference ever has to be rewritten -- that
   whole class of risk (see budInsertCategoryRow's comment, kept below for
   reference) no longer applies to normal use. Hard cap: once all 21 rows are

   self-contained and doesn't need a fresh Category-Master lookup against whatever
   copy of the workbook merge eventually runs against. */

  BUD_QUEUE.push({id:capUid(),action:"addCat",cat,monthly:v,fixvar,essdisc,createdAt:new Date().toISOString()});

   "cats"/"accts"/"bud" live under the combined Settings screen ("Categories &

   destinations, not part of this tab-switcher, since they're single actions rather
   than three related editors);

   calls switchCapTab(...) (Overview's "Review" banner, editing a queued entry from
   Pending changes, the Export button) keeps working unchanged -- only what it routes
   to has moved. ---- */
function switchCapTab(t){
  capTab=t;
  if(t==="add"){openAddOverlay();return;}
  if(t==="cats"||t==="accts"||t==="bud"){goToView("settings");return;}
  goToView("data"); // queue / merge / data
}

      if($("#c_hold_price"))$("#c_hold_price").value=units>0?(amt/units).toFixed(2):"";
    };

    if($("#c_hold_type"))$("#c_hold_type").onchange=syncVisibility;
    if($("#c_hold_units"))$("#c_hold_units").oninput=updatePrice;

  }
  function holdFormVal(){
    if(editing)return null;
    const x={kind:$("#c_kind").value,from:$("#c_from").value,to:$("#c_to").value};
    const info=holdDirection(x);
    if(!info)return null;
    const req=holdRequired(x);
    const skip=$("#c_hold_skip");
    if(skip&&skip.checked)return{skip:true};
    const sel=$("#c_hold_sel");
    if(!sel)return req?{invalid:true}:null;
    const fxWrap=$("#c_hold_fxwrap");
    const fxAmtRaw=fxWrap&&fxWrap.style.display!=="none"&&$("#c_hold_fxamt")?$("#c_hold_fxamt").value:"";
    const fx=fxAmtRaw!==""&&+fxAmtRaw>0?{amount:+fxAmtRaw,currency:$("#c_hold_fxccy").value}:null;
    if(sel.value==="__new__"){
      const unitsBased=$("#c_hold_unitsmode").value==="yes";
      const type=$("#c_hold_type").value;

      return{info,mode:"new",cls:$("#c_hold_cls").value,type,name:$("#c_hold_name").value,
        symbol:$("#c_hold_symbol").value.trim()||null,mfCategory,

  }

  const syncForKind=()=>{
    const kind=$("#c_kind").value,t=txnType({kind});
    fillCats(t,seed&&seed.kind===kind?seed.cat:$("#c_cat").value);
    fillSubs($("#c_cat").value,seed&&seed.kind===kind?seed.sub:$("#c_sub").value);
    if(t==="Expense"&&$("#c_to").value!==EXT)$("#c_to").value=EXT;
    if(t==="Income"&&$("#c_from").value!==EXT)$("#c_from").value=EXT;

  };
  syncForKind();
  if(seed){fillCats(txnType({kind:seed.kind}),seed.cat);fillSubs(seed.cat,seed.sub);}

  $("#c_kind").onchange=()=>{syncForKind();capLiveCheck();};
  $("#c_cat").onchange=()=>{fillSubs($("#c_cat").value,"");capLiveCheck();};
  $("#c_from").addEventListener("change",renderHoldSection);
  $("#c_to").addEventListener("change",renderHoldSection);
  ["c_amt","c_from","c_to","c_sub","c_date","c_com"].forEach(id=>{$("#"+id).oninput=capLiveCheck;$("#"+id).onchange=capLiveCheck;});
  $("#c_dminus").onclick=()=>{const d=new Date($("#c_date").value+"T00:00:00");d.setDate(d.getDate()-1);$("#c_date").value=localISODate(d);};
  $("#c_today").onclick=()=>{$("#c_date").value=capToday();};

  function capFormVal(){return{date:$("#c_date").value,kind:$("#c_kind").value,from:$("#c_from").value,to:$("#c_to").value,
    amt:+$("#c_amt").value||0,cat:$("#c_cat").value,sub:$("#c_sub").value,com:$("#c_com").value};}
  function capLiveCheck(){const x=capFormVal(),ck=checkTxn(x),el=$("#c_check");
    el.className="check "+(ck.ok?"ok":"bad");
    el.textContent=ck.ok?("Looks good \u2014 "+txnType(x)+" \u00b7 "+txnCF(x)):ck.msg;
    const effect=$("#c_effect"),t=txnType(x);
    effect.textContent=x.amt>0?`${fmtNP(x.amt)} ${t==="Income"?"enters":"leaves"} ${t==="Income"?x.to:x.from}${t==="Transfer"?` and moves to ${x.to}`:x.cat?` \u00b7 ${x.cat}${x.sub?" / "+x.sub:""}`:""}.`:"Enter an amount to preview its account and category effect.";
    if(!editing){S.txnDraft=x;persist();}
  }
  const presetMap=new Map([...templates,...recent].map(t=>[String(t.id),t]));
  $$("#capBody [data-template]").forEach(button=>button.onclick=()=>{
    const t=presetMap.get(button.dataset.template);if(!t)return;

    $("#c_kind").value=v.kind||kindDefault;$("#c_from").value=v.from||accs[0];$("#c_to").value=v.to||EXT;
    $("#c_amt").value=v.amt||"";$("#c_com").value=v.com||"";syncForKind();
    fillCats(txnType({kind:$("#c_kind").value}),v.cat||"");$("#c_cat").value=v.cat||"";
    fillSubs(v.cat||"",v.sub||"");$("#c_sub").value=v.sub||"";capLiveCheck();
  });

    const name=$("#c_template_name").value.trim();if(!name){toast("Name this template first");return;}
    const v=capFormVal();S.transactionTemplates=[...(S.transactionTemplates||[]),{id:capUid(),name,favorite:true,...templateValue(v)}];
    persist();toast("Template saved");renderCapAdd();

    if(hv&&hv.invalid){toast("Pick which holding this affects, or check \u201cjust cash\u201d");return;}
    if(hv&&!hv.skip&&hv.mode==="new"&&!(hv.name||"").trim()){toast("Enter a holding name");return;}
    window.__capLastKind=x.kind;
    if(editing){
      const idx=CAP_QUEUE.findIndex(q=>q.id===capEditId);
      CAP_QUEUE[idx]={...CAP_QUEUE[idx],...x};
      capPersistQueue();
      const ti=S.txns.findIndex(t=>t.capId===capEditId);
      /* Preserve any existing holding-link metadata across this edit -- x from
         capFormVal() never carries hold* fields, so without this an edit here
         would silently wipe a link made at original save time (this overlay
         doesn't offer relinking itself; that's the Transactions tab's edit form,
         which can also backfill a link that was never made). */
      if(ti>=0){
        const prevT=S.txns[ti];
        S.txns[ti]={...x,capId:capEditId,holdName:prevT.holdName,holdAcct:prevT.holdAcct,holdUnits:prevT.holdUnits};
        persist();
      }
      capEditId=null;toast("Entry updated");
    }else{
      // Apply the holding change BEFORE queuing the transaction, so a blocked
      // sell (not enough units) stops the save entirely rather than leaving a
      // transaction queued with no matching holding update.
      if(hv&&!hv.skip){
        const r=applyHoldingTxn(hv.info.dir,hv.info.acct,hv,x.amt,x.date,hv.fx);
        if(!r.ok){toast(r.msg);return;}
        /* Audit metadata riding on the transaction itself -- not read by the
           Excel merge (which names its columns explicitly, confirmed safe the
           same way "symbol" was for holdings), just a record of which holding
           this transaction fed, matching the "tie lots to real transactions"
           design even though the lots themselves live on the holding. */
        x.holdName=hv.mode==="existing"?(S.holdings[hv.ix]&&S.holdings[hv.ix].name):hv.name;
        x.holdAcct=hv.info.acct;
        x.holdUnits=hv.units?+hv.units:null;
      }
      const id=capUid();
      CAP_QUEUE.push({id,createdAt:new Date().toISOString(),...x});
      capPersistQueue();
      S.txns.push({...x,capId:id});
      S.loaded=true;S.onboarded=true;
      S.txnDraft=null;
      persist();
      toast("Added \u2014 visible on your dashboard now, queued for merge");
    }
    closeAddOverlay();
    render();
  };
  if(e)$("#c_cancel").onclick=()=>{capEditId=null;closeAddOverlay();};
}

   exactly as separate localStorage arrays and exactly as the merge-time code
   (catApplyQueue/acctApplyQueue/budApplyQueue/etc.) already expects -- nothing about
   how they're stored or applied at Sync-to-Excel time changes here, only how they're
   displayed together beforehand. Only CAP_QUEUE (transaction) entries can be
   individually edited/cancelled here, same as before -- there's no existing per-item
   undo for a queued category/account/budget/holding change (editing it again in
   Settings/Investments is how you change it before syncing), so those are listed for

    const msg=q.action==="delete"?"Cancel this pending deletion and restore the transaction to view?":
               q.action==="update"?"Revert this edit back to what was last imported? (Undoes your change, not just the pending workbook update.)":
               "Remove this from the queue? (It will also disappear from your dashboard, since it was never in the workbook.)";
    if(!(await capConfirm(msg)))return;
    if(q.action==="delete"){
      S.txns.push({...q.snapshot,_row:q.row});
    }else if(q.action==="update"){
      const ti=S.txns.findIndex(t=>t.capId===id);
      if(ti>=0){if(q.original)S.txns[ti]={...q.original,_row:q.row};else delete S.txns[ti].capId;}
    }else{
      const ti=S.txns.findIndex(t=>t.capId===id);
      if(ti>=0)S.txns.splice(ti,1);
    }
    CAP_QUEUE=CAP_QUEUE.filter(x=>x.id!==id);
    capPersistQueue();persist();render();
  });
}

/* ---- self-contained zip read/write (native CompressionStream, no library) ---- */
async function capInflateRaw(bytes){const ds=new DecompressionStream("deflate-raw");const s=new Blob([bytes]).stream().pipeThrough(ds);return new Uint8Array(await new Response(s).arrayBuffer());}

  const dosDate=(((now.getFullYear()-1980)&0x7F)<<9)|(((now.getMonth()+1)&0xF)<<5)|(now.getDate()&0x1F);

    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);
    cv.setUint16(10,method,true);cv.setUint16(12,dosTime,true);cv.setUint16(14,dosDate,true);cv.setUint32(16,crc,true);
    cv.setUint32(20,payload.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,nameBytes.length,true);
    cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint16(38,0,true);cv.setUint32(40,0,true);cv.setUint32(42,offset,true);
