  //    tolerates that fine; xmlBumpDimensionRow only ever grows it, never shrinks).
  wbXml=wbSetDefinedNameRef(wbXml,"Ded_Old",`Deductions!$F$${totalOldRow-1}`);
  wbXml=wbSetDefinedNameRef(wbXml,"Ded_New",`Deductions!$F$${totalNewRow-1}`);
  return{sheetXml,wbXml,found:true};
}
function dedEditEntryRow(sheetXml,r,fields){
  if(fields.code!=null)sheetXml=capSetCell(sheetXml,"A",r,"str",fields.code);
  if(fields.desc!=null)sheetXml=capSetCell(sheetXml,"B",r,"str",fields.desc);
  if(fields.regime!=null)sheetXml=capSetCell(sheetXml,"C",r,"str",fields.regime);
  if(fields.limit!=null)sheetXml=capSetCell(sheetXml,"D",r,"num",fields.limit>=999999999?999999999:(+fields.limit||0));
  if(fields.claimed!=null)sheetXml=capSetCell(sheetXml,"E",r,"num",(+fields.claimed||0));
  return sheetXml;
}
function dedApplyQueue(zip,sheetXml,wbXml,queue){
  const applied=[],failed=[];
  for(const q of queue){
    try{
      if(q.action==="addEntry"){
        const r=dedInsertEntryRow(zip,sheetXml,wbXml,q);
        sheetXml=r.sheetXml;wbXml=r.wbXml;
      }else if(q.action==="editEntry"){
        const row=dedFindRow(zip,sheetXml,DED_ROW0,dedCurrentRowN(zip,sheetXml),q.matchCode);
        if(row==null)throw new Error(`Deductions sheet: no section with code "${q.matchCode}" to edit.`);
        sheetXml=dedEditEntryRow(sheetXml,row,q);
      }else if(q.action==="removeEntry"){
        const r=dedRemoveEntryRow(zip,sheetXml,wbXml,q.matchCode);
        sheetXml=r.sheetXml;wbXml=r.wbXml;
      }else{throw new Error(`Deductions sheet: unknown queue action "${q.action}".`);}
      applied.push(q.id);
    }catch(err){failed.push({id:q.id,error:err.message||String(err)});}
  }
  return{sheetXml,wbXml,applied,failed};
}

/* ---- shared helpers: keep S.txns and CAP_QUEUE in sync for edits/deletes of
   already-imported rows (identified by _row), same as for locally-added ones (capId) ---- */
function capQueueUpsertForTxn(prevX,newX){
  if(prevX.capId){
    const qi=CAP_QUEUE.findIndex(q=>q.id===prevX.capId);
    if(qi>=0){CAP_QUEUE[qi]={...CAP_QUEUE[qi],date:newX.date,kind:newX.kind,from:newX.from,to:newX.to,amt:newX.amt,cat:newX.cat,sub:newX.sub,com:newX.com};capPersistQueue();}
    return prevX.capId;
  }else if(prevX._row){
    const id=capUid();
    const original={date:prevX.date,kind:prevX.kind,from:prevX.from,to:prevX.to,amt:prevX.amt,cat:prevX.cat,sub:prevX.sub,com:prevX.com};
    CAP_QUEUE.push({id,action:"update",row:prevX._row,original,createdAt:new Date().toISOString(),date:newX.date,kind:newX.kind,from:newX.from,to:newX.to,amt:newX.amt,cat:newX.cat,sub:newX.sub,com:newX.com});
    capPersistQueue();
    return id;
  }else{
    const id=capUid();
    CAP_QUEUE.push({id,action:"add",createdAt:new Date().toISOString(),date:newX.date,kind:newX.kind,from:newX.from,to:newX.to,amt:newX.amt,cat:newX.cat,sub:newX.sub,com:newX.com});
    capPersistQueue();
    return id;
  }
}
function capQueueDeleteForTxn(x){
  const snap={date:x.date,kind:x.kind,from:x.from,to:x.to,amt:x.amt,cat:x.cat,sub:x.sub,com:x.com};
  if(x.capId){
    const qi=CAP_QUEUE.findIndex(q=>q.id===x.capId);
    if(qi>=0){
      if(CAP_QUEUE[qi].action==="add"){CAP_QUEUE.splice(qi,1);} // never existed in the file — nothing to undo
      else{CAP_QUEUE[qi]={id:x.capId,action:"delete",row:CAP_QUEUE[qi].row,snapshot:snap,createdAt:new Date().toISOString()};}
      capPersistQueue();
    }
  }else if(x._row){
    CAP_QUEUE.push({id:capUid(),action:"delete",row:x._row,snapshot:snap,createdAt:new Date().toISOString()});
    capPersistQueue();
  }
}

async function renderCapMerge(){

  if(an)parts.push(`${an} account change${an===1?"":"s"}`);
  if(hn)parts.push(`${hn} holding change${hn===1?"":"s"}`);
  if(ln)parts.push(`${ln} lot change${ln===1?"":"s"}`);
  if(bn)parts.push(`${bn} budget change${bn===1?"":"s"}`);
  if(edn)parts.push(`${edn} deduction change${edn===1?"":"s"}`);
  if(payn)parts.push(`${payn} tax payment change${payn===1?"":"s"}`);
  if(cgn)parts.push(`${cgn} capital gains entr${cgn===1?"y":"ies"}`);
  if(trn)parts.push(`${trn} tax rules change${trn===1?"":"s"}`);
  if(fdn)parts.push(`${fdn} fixed deposit change${fdn===1?"":"s"}`);
  if(msn)parts.push(`${msn} model settings change${msn===1?"":"s"}`);

  if(!total){
    $("#capBody").innerHTML=`<div class="card">
      <div class="small" style="color:var(--ink3);font-size:12.5px">Nothing queued right now \u2014 add or edit entries first.</div>
    </div>`;
    return;
  }

  // Loading placeholder while we check IndexedDB for a cached workbook -- avoids a
  // blank body during the async gap, and lets us bail below if the tab changed.
  $("#capBody").innerHTML=`<div class="card" style="color:var(--ink3);font-size:12.5px">Loading\u2026</div>`;
  const cached=await wbCacheGet();
  if(capTab!=="merge")return; // person navigated away while we were checking the cache
  const useCached=cached&&!capUseDifferentFile;

  $("#capBody").innerHTML=`<div class="card">
    <div class="small" style="color:var(--ink3);margin-bottom:14px;font-size:12.5px">
      Queued: ${parts.join(", ")}.
      Updating writes these changes into a copy of your workbook entirely in this browser. Nothing is uploaded.
    </div>
    ${useCached?`
      <div class="cap-kv"><span class="k">Using saved workbook</span><span class="v">${esc(cached.name)}</span></div>
      <div class="cap-kv"><span class="k">Last saved</span><span class="v">${new Date(cached.cachedAt).toLocaleString("en-IN")}</span></div>
      <div style="height:12px"></div>
      <button class="btn p" id="cm_go" style="width:100%">Review workbook changes</button>
      <div style="height:8px"></div>
      <button class="btn" id="cm_other" style="width:100%">Use a different file instead</button>
    `:`
      <label class="btn" style="display:block;text-align:center">
        Choose your workbook (.xlsx)<input type="file" id="cm_file" accept=".xlsx" hidden></label>
      <div id="cm_fileName" class="small" style="color:var(--ink3);margin-top:8px;text-align:center;font-size:12.5px"></div>
      <div style="height:12px"></div>
      <button class="btn p" id="cm_go" style="width:100%" disabled>Review workbook changes</button>
      ${cached?`<div style="height:8px"></div><button class="btn" id="cm_useSaved" style="width:100%">Use saved workbook instead</button>`:""}
    `}
  </div><div id="cm_result"></div>`;

  if(useCached){
    $("#cm_go").onclick=()=>capReviewMerge(cached.bytes,cached.name);
    $("#cm_other").onclick=()=>{capUseDifferentFile=true;renderCapMerge();};
  }else{
    $("#cm_file").onchange=e=>{capMergeFile=e.target.files[0]||null;$("#cm_fileName").textContent=capMergeFile?("Selected: "+capMergeFile.name):"";$("#cm_go").disabled=!capMergeFile;};
    $("#cm_go").onclick=()=>capReviewMerge();
    if(cached)$("#cm_useSaved").onclick=()=>{capUseDifferentFile=false;renderCapMerge();};
  }
}

async function capReviewMerge(bytesOverride,nameOverride){
  const resultEl=$("#cm_result");
  resultEl.innerHTML=`<div class="card" style="color:var(--ink3);font-size:12.5px">Reading file\u2026</div>`;
  try{
    const buf=bytesOverride?(bytesOverride instanceof Uint8Array?bytesOverride:new Uint8Array(bytesOverride)):new Uint8Array(await documentAdapter.readAsArrayBuffer(capMergeFile));
    capMergeSourceName=nameOverride||(capMergeFile&&capMergeFile.name)||"workbook.xlsx";
    capMergeSourceFingerprint=await workbookFingerprint(buf);
    capMergeDrift=Boolean(S.workbookBaselineFingerprint&&S.workbookBaselineFingerprint!==capMergeSourceFingerprint);
    const zip=await capUnzip(buf);
    const txnPath=capFindSheetPath(zip,"Transactions");
    if(!txnPath||!zip[txnPath])throw new Error("This workbook is structurally incompatible: the Transactions sheet is missing.");
    if(!zip["xl/workbook.xml"])throw new Error("This workbook is structurally incompatible: workbook metadata is missing.");
    const required=[
      [CAT_QUEUE.length||ACCT_QUEUE.length,"Lists"],
      [HOLD_QUEUE.length,"Investments"],
      [LOT_QUEUE.length,"Investment Lots"],
      [BUD_QUEUE.length,"Budget"],
      [DED_QUEUE.length,"Deductions"],
      [PAY_QUEUE.length,"Tax Payments"],
      [CG_QUEUE.length,"Capital Gains"],
      [TR_QUEUE.length,"Tax Rules"],
      [FD_QUEUE.length,"Fixed Deposits"],
      [MS_QUEUE.length,"Read Me & Rules"]
    ].filter(([needed])=>needed).map(([,name])=>name);
    const missing=required.filter(name=>!capFindSheetPath(zip,name));
    if(missing.length)throw new Error(`This workbook is structurally incompatible with the pending changes. Missing sheet${missing.length===1?"":"s"}: ${missing.join(", ")}.`);
    let sheetXml=new TextDecoder().decode(zip[txnPath]);
    let blankRows=capFindBlankRows(sheetXml);

    const adds=CAP_QUEUE.filter(q=>q.action==="add"||!q.action).sort((a,b)=>a.date.localeCompare(b.date));
    const upds=CAP_QUEUE.filter(q=>q.action==="update");
    const dels=CAP_QUEUE.filter(q=>q.action==="delete");
    // Auto-extend before running out: trigger once remaining blank rows fall below
    // a floor OR wouldn't cover this merge's own queued adds, in batches of 500.
    const TXN_LOW_WATER=50,TXN_BATCH=500;
    let txnExtendLog=null;
    if(blankRows.length<Math.max(TXN_LOW_WATER,adds.length)){
      const shortfall=Math.max(TXN_LOW_WATER,adds.length)-blankRows.length;
      const batches=Math.max(1,Math.ceil(shortfall/TXN_BATCH));
      const ext=txnExtendBuffer(sheetXml,batches*TXN_BATCH);
      sheetXml=ext.sheetXml;
      blankRows=capFindBlankRows(sheetXml);
      txnExtendLog=`Auto-extended the Transactions buffer by ${batches*TXN_BATCH} rows (now ends at row ${ext.newLast}).`;
    }
    const addsFit=adds.slice(0,blankRows.length);
    const addsLeftover=adds.slice(blankRows.length);

    _catSstCache=null;
    const listsPath=capFindSheetPath(zip,"Lists");
    let listsXml=listsPath&&zip[listsPath]?new TextDecoder().decode(zip[listsPath]):null;
    let wbXml=zip["xl/workbook.xml"]?new TextDecoder().decode(zip["xl/workbook.xml"]):null;
    let catResult={sheetXml:listsXml,wbXml,applied:[],failed:[],log:[]};
    let catExtendLog=null;
    if(listsXml&&wbXml){
      // Auto-extend before running out, same trigger shape as Transactions but
      // scoped to CAT_QUEUE's actual "addCat" actions rather than every change --
      // edits/removals never consume a fresh slot.
      const addCatCount=CAT_QUEUE.filter(q=>q.action==="addCat").length;
      if(addCatCount>0){
        const master=catResolveMasterCols(wbXml);
        let free=0;for(let r=master.row0;r<=master.rowN;r++)if(catCellText(zip,listsXml,`${master.cols.name}${r}`)==null)free++;
        const CAT_LOW_WATER=5,CAT_BATCH=10;
        if(free<Math.max(CAT_LOW_WATER,addCatCount)){
          const shortfall=Math.max(CAT_LOW_WATER,addCatCount)-free;
          const batches=Math.max(1,Math.ceil(shortfall/CAT_BATCH));
          const ext=catExtendMasterBuffer(listsXml,wbXml,batches*CAT_BATCH);
          listsXml=ext.sheetXml;wbXml=ext.wbXml;
          catResult={sheetXml:listsXml,wbXml,applied:[],failed:[],log:[]};
          catExtendLog=`Auto-extended the Category Master buffer by ${batches*CAT_BATCH} rows.`;
        }
      }
    }
    if(listsXml&&wbXml&&CAT_QUEUE.length)catResult=catApplyQueue(zip,listsXml,wbXml,CAT_QUEUE);
    // acctApplyQueue runs on top of whatever catApplyQueue already produced -- both
    // touch the same Lists sheet / workbook.xml strings but disjoint columns, so
    // they must chain (not run independently off the original listsXml/wbXml) or
    // one set of edits would clobber the other.
    let acctResult={sheetXml:catResult.sheetXml,wbXml:catResult.wbXml,applied:[],failed:[],log:[]};
    if(catResult.sheetXml&&catResult.wbXml&&ACCT_QUEUE.length)acctResult=acctApplyQueue(zip,catResult.sheetXml,catResult.wbXml,ACCT_QUEUE);
    // invApplyQueue targets a different sheet (Investments, not Lists) but still
    // chains off acctResult.wbXml -- workbook.xml is one shared string threaded
    // through all three merge steps regardless of which sheet each one edits.
    const invPath=capFindSheetPath(zip,"Investments");
    let invXml=invPath&&zip[invPath]?new TextDecoder().decode(zip[invPath]):null;
    let invResult={sheetXml:invXml,wbXml:acctResult.wbXml,applied:[],failed:[],log:[]};
    if(invXml&&acctResult.wbXml&&HOLD_QUEUE.length)invResult=invApplyQueue(zip,invXml,acctResult.wbXml,HOLD_QUEUE);
    // lotsApplyQueue targets the Investment Lots sheet -- a later template addition,
    // so an older copy of the workbook simply won't have it; lotsPath comes back
    // null/missing in that case and this whole step is skipped rather than thrown,
    // same treatment invResult gets if Investments itself were ever missing.
    const lotsPath=capFindSheetPath(zip,"Investment Lots");
    let lotsXml=lotsPath&&zip[lotsPath]?new TextDecoder().decode(zip[lotsPath]):null;
    let lotsResult={sheetXml:lotsXml,wbXml:invResult.wbXml,applied:[],failed:[],log:[]};
    if(lotsXml&&invResult.wbXml&&LOT_QUEUE.length)lotsResult=lotsApplyQueue(zip,lotsXml,invResult.wbXml,LOT_QUEUE);
    // budApplyQueue targets its own sheet (Budget) independent of Lists/Investments,
    // but still chains off lotsResult.wbXml -- workbook.xml is one shared string
    // threaded through every merge step regardless of which sheet each one edits.
    const budPath=capFindSheetPath(zip,"Budget");
    let budSheetXml=budPath&&zip[budPath]?new TextDecoder().decode(zip[budPath]):null;
    // Ratios isn't otherwise touched by any merge step -- it's only loaded here because
    // a queued "addCat" may need to bump its one cross-sheet reference into Budget.
    const ratiosPath=capFindSheetPath(zip,"Ratios");
    let ratiosXml=ratiosPath&&zip[ratiosPath]?new TextDecoder().decode(zip[ratiosPath]):null;
    let budResult={sheetXml:budSheetXml,wbXml:lotsResult.wbXml,ratiosXml,applied:[],failed:[],log:[]};
    if(budSheetXml&&lotsResult.wbXml&&BUD_QUEUE.length)budResult=budApplyQueue(zip,budSheetXml,lotsResult.wbXml,ratiosXml,BUD_QUEUE);
    // dedApplyQueue targets its own sheet (Deductions) independent of everything
    // else above, but still chains off budResult.wbXml -- workbook.xml is one
    // shared string threaded through every merge step regardless of which sheet
    // each one edits.
    const dedPath=capFindSheetPath(zip,"Deductions");
    let dedSheetXml=dedPath&&zip[dedPath]?new TextDecoder().decode(zip[dedPath]):null;
    let dedResult={sheetXml:dedSheetXml,wbXml:budResult.wbXml,applied:[],failed:[]};
    if(dedSheetXml&&budResult.wbXml&&DED_QUEUE.length)dedResult=dedApplyQueue(zip,dedSheetXml,budResult.wbXml,DED_QUEUE);
    // payApplyQueue targets its own sheet (Tax Payments), chains off dedResult.wbXml.
    const payPath=capFindSheetPath(zip,"Tax Payments");
    let paySheetXml=payPath&&zip[payPath]?new TextDecoder().decode(zip[payPath]):null;
    let payResult={sheetXml:paySheetXml,wbXml:dedResult.wbXml,applied:[],failed:[],log:[]};
    if(paySheetXml&&dedResult.wbXml&&PAY_QUEUE.length)payResult=payApplyQueue(zip,paySheetXml,dedResult.wbXml,PAY_QUEUE);
    // cgApplyQueue targets Capital Gains, chains off payResult.wbXml -- last in
    // the chain, so its wbXml is the one that ultimately gets written.
    const cgPath=capFindSheetPath(zip,"Capital Gains");
    let cgSheetXml=cgPath&&zip[cgPath]?new TextDecoder().decode(zip[cgPath]):null;
    let cgResult={sheetXml:cgSheetXml,wbXml:payResult.wbXml,applied:[],failed:[],log:[]};
    if(cgSheetXml&&payResult.wbXml&&CG_QUEUE.length)cgResult=cgApplyQueue(zip,cgSheetXml,payResult.wbXml,CG_QUEUE);
    // trApplyQueue targets Tax Rules, last in the chain -- chains off cgResult.wbXml.
    const trPath=capFindSheetPath(zip,"Tax Rules");
    let trSheetXml=trPath&&zip[trPath]?new TextDecoder().decode(zip[trPath]):null;
    let trResult={sheetXml:trSheetXml,wbXml:cgResult.wbXml,applied:[],failed:[],log:[]};
    if(trSheetXml&&cgResult.wbXml&&TR_QUEUE.length)trResult=trApplyQueue(zip,trSheetXml,cgResult.wbXml,TR_QUEUE);
    // fdApplyQueue targets Fixed Deposits, now last in the chain -- chains off trResult.wbXml.
    const fdPath=capFindSheetPath(zip,"Fixed Deposits");
    let fdSheetXml=fdPath&&zip[fdPath]?new TextDecoder().decode(zip[fdPath]):null;
    let fdResult={sheetXml:fdSheetXml,wbXml:trResult.wbXml,applied:[],failed:[],log:[]};
    if(fdSheetXml&&trResult.wbXml&&FD_QUEUE.length)fdResult=fdApplyQueue(zip,fdSheetXml,trResult.wbXml,FD_QUEUE);
    // msApplyQueue targets Read Me & Rules, now last in the chain -- chains off fdResult.wbXml.
    const msPath=capFindSheetPath(zip,"Read Me & Rules");
    let msSheetXml=msPath&&zip[msPath]?new TextDecoder().decode(zip[msPath]):null;
    let msResult={sheetXml:msSheetXml,wbXml:fdResult.wbXml,applied:[],failed:[],log:[]};
    if(msSheetXml&&fdResult.wbXml&&MS_QUEUE.length)msResult=msApplyQueue(zip,msSheetXml,fdResult.wbXml,MS_QUEUE);

    const rows=[];
    if(txnExtendLog)rows.push(`<div class="cap-row"><div class="l"><div class="kind">Buffer</div><div class="meta">${esc(txnExtendLog)}</div></div></div>`);
    if(catExtendLog)rows.push(`<div class="cap-row"><div class="l"><div class="kind">Buffer</div><div class="meta">${esc(catExtendLog)}</div></div></div>`);
    addsFit.forEach((x,i)=>rows.push(`<div class="cap-row"><div class="l"><div class="kind">New \u00b7 ${esc(x.kind)}</div><div class="meta">${capFmtDate(x.date)} \u00b7 ${esc(x.from)} \u2192 ${esc(x.to)} \u00b7 row ${blankRows[i]}</div></div><div class="amt">${capFmtN(x.amt)}</div></div>`));
    upds.forEach(x=>rows.push(`<div class="cap-row"><div class="l"><div class="kind">Update \u00b7 ${esc(x.kind)}</div><div class="meta">${capFmtDate(x.date)} \u00b7 ${esc(x.from)} \u2192 ${esc(x.to)} \u00b7 row ${x.row} (overwrites existing data)</div></div><div class="amt">${capFmtN(x.amt)}</div></div>`));
    dels.forEach(x=>rows.push(`<div class="cap-row"><div class="l"><div class="kind" style="color:var(--neg)">Delete \u00b7 ${x.snapshot?esc(x.snapshot.kind):""}</div><div class="meta">row ${x.row}${x.snapshot?` \u00b7 ${esc(x.snapshot.from)} \u2192 ${esc(x.snapshot.to)} \u00b7 ${capFmtN(x.snapshot.amt)}`:""} \u2014 clears existing data in this row</div></div></div>`));
    catResult.log.forEach(msg=>rows.push(`<div class="cap-row"><div class="l"><div class="kind">Category</div><div class="meta">${esc(msg)}</div></div></div>`));
    acctResult.log.forEach(msg=>rows.push(`<div class="cap-row"><div class="l"><div class="kind">Account</div><div class="meta">${esc(msg)}</div></div></div>`));
    invResult.log.forEach(msg=>rows.push(`<div class="cap-row"><div class="l"><div class="kind">Holding</div><div class="meta">${esc(msg)}</div></div></div>`));
    lotsResult.log.forEach(msg=>rows.push(`<div class="cap-row"><div class="l"><div class="kind">Lot</div><div class="meta">${esc(msg)}</div></div></div>`));
    budResult.log.forEach(msg=>rows.push(`<div class="cap-row"><div class="l"><div class="kind">Budget</div><div class="meta">${esc(msg)}</div></div></div>`));
    fdResult.log.forEach(msg=>rows.push(`<div class="cap-row"><div class="l"><div class="kind">Fixed Deposit</div><div class="meta">${esc(msg)}</div></div></div>`));
    msResult.log.forEach(msg=>rows.push(`<div class="cap-row"><div class="l"><div class="kind">Model Settings</div><div class="meta">${esc(msg)}</div></div></div>`));

    resultEl.innerHTML=`<div class="card"><h3>Review before writing</h3>
      <div class="cap-kv"><span class="k">Source fingerprint</span><span class="v mono">${capMergeSourceFingerprint.slice(0,12)}\u2026</span></div>
      ${capMergeDrift?`<div class="check bad" style="margin:12px 0">This compatible workbook differs from Pechak's last known baseline. Review the changes, then explicitly confirm that you want to continue with this externally changed copy.</div>`:""}
      <div style="max-height:280px;overflow-y:auto">${rows.join("")||'<div class="muted" style="font-size:12.5px">Nothing to write.</div>'}</div>
      ${addsLeftover.length?`<div class="check bad" style="margin-top:12px">Buffer only has room for ${addsFit.length} of ${adds.length} new entries \u2014 ${addsLeftover.length} will stay queued. Ask Claude to extend the buffer for the rest.</div>`:""}
      ${upds.length||dels.length?`<div class="check bad" style="margin-top:12px">${upds.length+dels.length} of these overwrite or clear rows that already hold real data in your workbook. Double-check the list above.</div>`:""}
      ${catResult.failed.length?`<div class="check bad" style="margin-top:12px">${catResult.failed.length} category change${catResult.failed.length===1?"":"s"} couldn't be applied: ${catResult.failed.map(f=>esc(f.error)).join(" ")}</div>`:""}
      ${acctResult.failed.length?`<div class="check bad" style="margin-top:12px">${acctResult.failed.length} account change${acctResult.failed.length===1?"":"s"} couldn't be applied: ${acctResult.failed.map(f=>esc(f.error)).join(" ")}</div>`:""}
      ${invResult.failed.length?`<div class="check bad" style="margin-top:12px">${invResult.failed.length} holding change${invResult.failed.length===1?"":"s"} couldn't be applied: ${invResult.failed.map(f=>esc(f.error)).join(" ")}</div>`:""}
      ${lotsResult.failed.length?`<div class="check bad" style="margin-top:12px">${lotsResult.failed.length} lot change${lotsResult.failed.length===1?"":"s"} couldn't be applied: ${lotsResult.failed.map(f=>esc(f.error)).join(" ")}</div>`:""}
      ${budResult.failed.length?`<div class="check bad" style="margin-top:12px">${budResult.failed.length} budget change${budResult.failed.length===1?"":"s"} couldn't be applied: ${budResult.failed.map(f=>esc(f.error)).join(" ")}</div>`:""}
      ${dedResult.failed.length?`<div class="check bad" style="margin-top:12px">${dedResult.failed.length} deduction change${dedResult.failed.length===1?"":"s"} couldn't be applied: ${dedResult.failed.map(f=>esc(f.error)).join(" ")}</div>`:""}
      ${payResult.failed.length?`<div class="check bad" style="margin-top:12px">${payResult.failed.length} tax payment change${payResult.failed.length===1?"":"s"} couldn't be applied: ${payResult.failed.map(f=>esc(f.error)).join(" ")}</div>`:""}
      ${cgResult.failed.length?`<div class="check bad" style="margin-top:12px">${cgResult.failed.length} capital gains entr${cgResult.failed.length===1?"y":"ies"} couldn't be applied: ${cgResult.failed.map(f=>esc(f.error)).join(" ")}</div>`:""}
      ${trResult.failed.length?`<div class="check bad" style="margin-top:12px">${trResult.failed.length} tax rules change${trResult.failed.length===1?"":"s"} couldn't be applied: ${trResult.failed.map(f=>esc(f.error)).join(" ")}</div>`:""}
      ${fdResult.failed.length?`<div class="check bad" style="margin-top:12px">${fdResult.failed.length} fixed deposit change${fdResult.failed.length===1?"":"s"} couldn't be applied: ${fdResult.failed.map(f=>esc(f.error)).join(" ")}</div>`:""}
      ${msResult.failed.length?`<div class="check bad" style="margin-top:12px">${msResult.failed.length} model settings change${msResult.failed.length===1?"":"s"} couldn't be applied: ${msResult.failed.map(f=>esc(f.error)).join(" ")}</div>`:""}
      ${capMergeDrift?`<label style="display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:12.5px"><input type="checkbox" id="cm_drift_confirm" style="width:auto;margin-top:2px">I reviewed the compatible workbook drift and want to write these changes.</label>`:""}
      <button class="btn p" id="cm_confirm" style="width:100%;margin-top:14px" ${capMergeDrift?"disabled":""}>Confirm \u2014 write ${rows.length} change${rows.length===1?"":"s"} &amp; download</button>
      <div style="height:8px"></div>
      <button class="btn" id="cm_back" style="width:100%">Back</button>
    </div>`;
    $("#cm_back").onclick=()=>renderCapMerge();
    if(capMergeDrift)$("#cm_drift_confirm").onchange=e=>{$("#cm_confirm").disabled=!e.target.checked;};
    $("#cm_confirm").onclick=()=>capDoMerge(zip,txnPath,sheetXml,blankRows,addsFit,addsLeftover,upds,dels,listsPath,catResult,acctResult,invPath,invResult,lotsPath,lotsResult,budPath,budResult,ratiosPath,dedPath,dedResult,payPath,payResult,cgPath,cgResult,trPath,trResult,fdPath,fdResult,msPath,msResult);
  }catch(err){
    resultEl.innerHTML=`<div class="card"><h3 style="color:var(--neg)">Couldn't read file</h3><div style="font-size:13px">${esc(err.message||String(err))}</div></div>`;
  }
}

async function capDoMerge(zip,txnPath,sheetXml,blankRows,addsFit,addsLeftover,upds,dels,listsPath,catResult,acctResult,invPath,invResult,lotsPath,lotsResult,budPath,budResult,ratiosPath,dedPath,dedResult,payPath,payResult,cgPath,cgResult,trPath,trResult,fdPath,fdResult,msPath,msResult){
  const resultEl=$("#cm_result");
  resultEl.innerHTML=`<div class="card" style="color:var(--ink3);font-size:12.5px">Writing\u2026</div>`;
  window.__pechakBusy=true;
  try{
    addsFit.forEach((x,i)=>{sheetXml=capWriteAddRow(sheetXml,blankRows[i],x);});
    upds.forEach(x=>{sheetXml=capWriteUpdateRow(sheetXml,x.row,x);});
    dels.forEach(x=>{sheetXml=capClearRow(sheetXml,x.row);});

    const clPath=capFindSheetPath(zip,"Change Log");
    const stamp=new Date().toISOString().replace(/[:T]/g,"-").slice(0,16);
    const bits=[];
    if(addsFit.length)bits.push(`added ${addsFit.length} into rows ${blankRows[0]}-${blankRows[addsFit.length-1]}`);
    if(upds.length)bits.push(`updated rows ${upds.map(u=>u.row).join(", ")}`);
    if(dels.length)bits.push(`cleared rows ${dels.map(d=>d.row).join(", ")}`);
    if(catResult&&catResult.log.length)bits.push(`categories: ${catResult.log.join("; ")}`);
    if(acctResult&&acctResult.log.length)bits.push(`accounts: ${acctResult.log.join("; ")}`);
    if(invResult&&invResult.log.length)bits.push(`holdings: ${invResult.log.join("; ")}`);
    if(lotsResult&&lotsResult.log.length)bits.push(`lots: ${lotsResult.log.join("; ")}`);
    if(budResult&&budResult.log.length)bits.push(`budget: ${budResult.log.join("; ")}`);
    if(dedResult&&dedResult.applied&&dedResult.applied.length)bits.push(`deductions: ${dedResult.applied.length} change${dedResult.applied.length===1?"":"s"}`);
    if(payResult&&payResult.log&&payResult.log.length)bits.push(`tax payments: ${payResult.log.join("; ")}`);
    if(cgResult&&cgResult.log&&cgResult.log.length)bits.push(`capital gains: ${cgResult.log.join("; ")}`);
    if(trResult&&trResult.applied&&trResult.applied.length)bits.push(`tax rules: saved`);
    if(fdResult&&fdResult.log&&fdResult.log.length)bits.push(`fixed deposits: ${fdResult.log.join("; ")}`);
    if(msResult&&msResult.log&&msResult.log.length)bits.push(`model settings: ${msResult.log.join("; ")}`);
    const summary=`Mobile merge: ${bits.join("; ")||"no changes"} from Add / Transactions.`;
    if(clPath&&zip[clPath]){
      zip[clPath]=new TextEncoder().encode(capAppendChangeLogRow(new TextDecoder().decode(zip[clPath]),summary));
    }
    zip[txnPath]=new TextEncoder().encode(sheetXml);
    // catResult -> acctResult -> invResult -> lotsResult -> budResult -> dedResult
    // -> payResult -> cgResult -> trResult -> fdResult -> msResult is one unbroken
    // chain regardless of which queues were actually non-empty (each step defaults
    // to passing its input straight through), so every *Result.sheetXml/.wbXml is
    // always the final version -- no need to branch on which step actually
    // applied anything, just on whether ANY of them did.
    if((catResult&&catResult.applied.length)||(acctResult&&acctResult.applied.length)||(invResult&&invResult.applied.length)||(lotsResult&&lotsResult.applied.length)||(budResult&&budResult.applied.length)||(dedResult&&dedResult.applied&&dedResult.applied.length)||(payResult&&payResult.applied&&payResult.applied.length)||(cgResult&&cgResult.applied&&cgResult.applied.length)||(trResult&&trResult.applied&&trResult.applied.length)||(fdResult&&fdResult.applied&&fdResult.applied.length)||(msResult&&msResult.applied&&msResult.applied.length)){
      if(listsPath)zip[listsPath]=new TextEncoder().encode(acctResult.sheetXml);
      if(invPath&&invResult.sheetXml)zip[invPath]=new TextEncoder().encode(invResult.sheetXml);
      if(lotsPath&&lotsResult.sheetXml)zip[lotsPath]=new TextEncoder().encode(lotsResult.sheetXml);
      if(budPath&&budResult.sheetXml)zip[budPath]=new TextEncoder().encode(budResult.sheetXml);
      if(dedPath&&dedResult.sheetXml)zip[dedPath]=new TextEncoder().encode(dedResult.sheetXml);
      if(payPath&&payResult.sheetXml)zip[payPath]=new TextEncoder().encode(payResult.sheetXml);
      if(cgPath&&cgResult.sheetXml)zip[cgPath]=new TextEncoder().encode(cgResult.sheetXml);
      if(trPath&&trResult.sheetXml)zip[trPath]=new TextEncoder().encode(trResult.sheetXml);
      if(fdPath&&fdResult.sheetXml)zip[fdPath]=new TextEncoder().encode(fdResult.sheetXml);
      if(msPath&&msResult.sheetXml)zip[msPath]=new TextEncoder().encode(msResult.sheetXml);
      // Only ever differs from what was loaded if a queued "addCat" bumped its cross-
      // reference into Budget -- otherwise this is a no-op re-write of the same bytes.
      if(ratiosPath&&budResult.ratiosXml)zip[ratiosPath]=new TextEncoder().encode(budResult.ratiosXml);
      zip["xl/workbook.xml"]=new TextEncoder().encode((msResult&&msResult.wbXml)||(fdResult&&fdResult.wbXml)||(trResult&&trResult.wbXml)||(cgResult&&cgResult.wbXml)||(payResult&&payResult.wbXml)||(dedResult&&dedResult.wbXml)||budResult.wbXml||lotsResult.wbXml||invResult.wbXml||acctResult.wbXml);
    }
    const outBytes=await capZip(zip);
    const baseName=capMergeSourceName||"workbook.xlsx";
    const outName=baseName.replace(/\.xlsx$/i,"")+`_merged_${stamp}.xlsx`;
    const outputFingerprint=await workbookFingerprint(outBytes);
    capDownload(outName,outBytes,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    // The just-written bytes ARE the new real state of the workbook -- cache them
    // under the original (non-timestamped) name so the next Merge/Export defaults
    // to picking up right where this one left off, no picker needed.
    await wbCacheSet(outBytes,baseName);
    S.workbookBaselineFingerprint=outputFingerprint;
    capMergeFile=null;capUseDifferentFile=false;

    const done=new Set([...addsFit.map(x=>x.id),...upds.map(x=>x.id),...dels.map(x=>x.id)]);
    CAP_QUEUE=CAP_QUEUE.filter(q=>!done.has(q.id));
    capPersistQueue();
    if(catResult){
      const catDone=new Set(catResult.applied);
      CAT_QUEUE=CAT_QUEUE.filter(q=>!catDone.has(q.id));
      catPersistQueue();
    }
    if(acctResult){
      const acctDone=new Set(acctResult.applied);
      ACCT_QUEUE=ACCT_QUEUE.filter(q=>!acctDone.has(q.id));
      acctPersistQueue();
    }
    if(invResult){
      const holdDone=new Set(invResult.applied);
      HOLD_QUEUE=HOLD_QUEUE.filter(q=>!holdDone.has(q.id));
      holdPersistQueue();
    }
    if(lotsResult){
      const lotDone=new Set(lotsResult.applied);
      LOT_QUEUE=LOT_QUEUE.filter(q=>!lotDone.has(q.id));
      lotPersistQueue();
    }
    if(budResult){
      const budDone=new Set(budResult.applied);
      BUD_QUEUE=BUD_QUEUE.filter(q=>!budDone.has(q.id));
      budPersistQueue();
    }
    if(dedResult){
      const dedDone=new Set(dedResult.applied);
      DED_QUEUE=DED_QUEUE.filter(q=>!dedDone.has(q.id));
      dedPersistQueue();
    }
    if(payResult){
      const payDone=new Set(payResult.applied);
      PAY_QUEUE=PAY_QUEUE.filter(q=>!payDone.has(q.id));
      payPersistQueue();
    }
    if(cgResult){
      const cgDone=new Set(cgResult.applied);
      CG_QUEUE=CG_QUEUE.filter(q=>!cgDone.has(q.id));
      cgPersistQueue();
    }
    if(trResult){
      const trDone=new Set(trResult.applied);
      TR_QUEUE=TR_QUEUE.filter(q=>!trDone.has(q.id));
      trPersistQueue();
    }
    if(fdResult){
      const fdDone=new Set(fdResult.applied);
      FD_QUEUE=FD_QUEUE.filter(q=>!fdDone.has(q.id));
      fdPersistQueue();
    }
    if(msResult){
      const msDone=new Set(msResult.applied);
      MS_QUEUE=MS_QUEUE.filter(q=>!msDone.has(q.id));
      msPersistQueue();
    }
    // add/update: clear the pending tag, the row is now real. delete: the local row is already gone from S.txns.
    [...addsFit,...upds].forEach(t=>{const ti=S.txns.findIndex(s=>s.capId===t.id);if(ti>=0)delete S.txns[ti].capId;});
    S.lastSyncedAt=new Date().toISOString();
    const catFailed=catResult?catResult.failed.length:0;
    const acctFailed=acctResult?acctResult.failed.length:0;
    const holdFailed=invResult?invResult.failed.length:0;
    const lotFailed=lotsResult?lotsResult.failed.length:0;
    const budFailed=budResult?budResult.failed.length:0;
    const dedFailed=dedResult?dedResult.failed.length:0;
    const payFailed=payResult?payResult.failed.length:0;
    const cgFailed=cgResult?cgResult.failed.length:0;
    const trFailed=trResult?trResult.failed.length:0;
    const receipt={
      id:capUid(),completedAt:S.lastSyncedAt,sourceName:baseName,outputName:outName,
      sourceFingerprint:capMergeSourceFingerprint,outputFingerprint,compatibleDriftConfirmed:capMergeDrift,
      applied:{transactions:done.size,categories:catResult?catResult.applied.length:0,accounts:acctResult?acctResult.applied.length:0,
        holdings:invResult?invResult.applied.length:0,lots:lotsResult?lotsResult.applied.length:0,budget:budResult?budResult.applied.length:0,
        deductions:dedResult&&dedResult.applied?dedResult.applied.length:0,taxPayments:payResult&&payResult.applied?payResult.applied.length:0,
        capitalGains:cgResult&&cgResult.applied?cgResult.applied.length:0,taxRules:trResult&&trResult.applied?trResult.applied.length:0,
        fixedDeposits:fdResult&&fdResult.applied?fdResult.applied.length:0,modelSettings:msResult&&msResult.applied?msResult.applied.length:0},
      failed:{categories:catFailed,accounts:acctFailed,holdings:holdFailed,lots:lotFailed,budget:budFailed,
        deductions:dedFailed,taxPayments:payFailed,capitalGains:cgFailed,taxRules:trFailed}
    };
    S.workbookReceipts=[receipt,...(S.workbookReceipts||[])].slice(0,20);
    persist();

    const totalApplied=done.size+(catResult?catResult.applied.length:0)+(acctResult?acctResult.applied.length:0)+(invResult?invResult.applied.length:0)+(lotsResult?lotsResult.applied.length:0)+(budResult?budResult.applied.length:0)+(dedResult&&dedResult.applied?dedResult.applied.length:0)+(payResult&&payResult.applied?payResult.applied.length:0)+(cgResult&&cgResult.applied?cgResult.applied.length:0)+(trResult&&trResult.applied?trResult.applied.length:0);
    resultEl.innerHTML=`<div class="card">
      <h3>Done</h3>
      <div style="font-size:13px;margin-bottom:8px">${totalApplied} change${totalApplied===1?"":"s"} written.</div>
      ${addsLeftover.length?`<div style="font-size:13px;color:var(--neg)">${addsLeftover.length} new entries still queued \u2014 buffer's full. Ask Claude to extend it, then merge again.</div>`:""}
      ${catFailed?`<div style="font-size:13px;color:var(--neg)">${catFailed} category change${catFailed===1?"":"s"} still queued \u2014 couldn't be applied this time.</div>`:""}
      ${acctFailed?`<div style="font-size:13px;color:var(--neg)">${acctFailed} account change${acctFailed===1?"":"s"} still queued \u2014 couldn't be applied this time.</div>`:""}
      ${holdFailed?`<div style="font-size:13px;color:var(--neg)">${holdFailed} holding change${holdFailed===1?"":"s"} still queued \u2014 couldn't be applied this time.</div>`:""}
      ${lotFailed?`<div style="font-size:13px;color:var(--neg)">${lotFailed} lot change${lotFailed===1?"":"s"} still queued \u2014 couldn't be applied this time.</div>`:""}
      ${budFailed?`<div style="font-size:13px;color:var(--neg)">${budFailed} budget change${budFailed===1?"":"s"} still queued \u2014 couldn't be applied this time.</div>`:""}
      ${dedFailed?`<div style="font-size:13px;color:var(--neg)">${dedFailed} deduction change${dedFailed===1?"":"s"} still queued \u2014 couldn't be applied this time.</div>`:""}
      ${payFailed?`<div style="font-size:13px;color:var(--neg)">${payFailed} tax payment change${payFailed===1?"":"s"} still queued \u2014 couldn't be applied this time.</div>`:""}
      ${cgFailed?`<div style="font-size:13px;color:var(--neg)">${cgFailed} capital gains entr${cgFailed===1?"y":"ies"} still queued \u2014 couldn't be applied this time.</div>`:""}
      ${trFailed?`<div style="font-size:13px;color:var(--neg)">${trFailed} tax rules change${trFailed===1?"":"s"} still queued \u2014 couldn't be applied this time.</div>`:""}
      <div style="font-size:12.5px;color:var(--ink3);margin-top:8px">Downloaded <b>${esc(outName)}</b>. Save it over your working copy.</div>
      <button class="btn sm" id="cm_receipt_download" style="width:100%;margin-top:12px">Download merge receipt (JSON)</button>
    </div>`;
    $("#cm_receipt_download").onclick=()=>capDownload(outName.replace(/\.xlsx$/i,"")+"_receipt.json",new TextEncoder().encode(JSON.stringify(receipt,null,2)),"application/json");
    toast("Workbook updated");
    render();
  }catch(err){
    resultEl.innerHTML=`<div class="card"><h3 style="color:var(--neg)">Couldn't merge</h3><div style="font-size:13px">${esc(err.message||String(err))}</div></div>`;
  }finally{
    window.__pechakBusy=false;
  }
}

function renderCapData(){
  if(!$("#capBody"))return;
  const qraw=storageAdapter.getRawItem(CAP_K_QUEUE,"[]"),araw=storageAdapter.getRawItem(CAP_K_ARCH,"{}");
  const archLabels=Object.keys(CAP_ARCH);
  const bytesOf=s=>new Blob([s]).size;
  const suggested=(()=>{const d=new Date();const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return "FY"+String(y).slice(2)+"-"+String(y+1).slice(2);})();
  const pending=pendingChangesSummary(),pendingN=totalPendingCount();
  const receipts=S.workbookReceipts||[];
  const integrity=M.integrity||[];
  const integrityRows=integrity.length
    ?integrity.map(c=>warnbox(`<b>${c.severity==="fail"?"Integrity check failed: ":""}${esc(c.label)}</b><br><span style="font-size:12px">${esc(c.detail)}</span>`)).join("<div style=\"height:8px\"></div>")

  <div class="card"><h3>Data safety</h3>

    <div class="cap-kv"><span class="k">Live data</span><span class="v" id="cd_local_save">Saved on this device</span></div>
    <div class="cap-kv"><span class="k">Workbook changes</span><span class="v">${pendingN?`${pendingN} pending`:"Up to date"}</span></div>
    <div class="cap-kv"><span class="k">Last workbook update</span><span class="v">${S.lastSyncedAt?esc(new Date(S.lastSyncedAt).toLocaleString("en-IN")):"Never"}</span></div>
    <div class="cap-kv"><span class="k">Workbook baseline</span><span class="v" id="cd_workbook_status">Checking\u2026</span></div>
    <div class="cap-kv"><span class="k">Last portable backup</span><span class="v">${S.lastBackupAt?esc(new Date(S.lastBackupAt).toLocaleString("en-IN")):"Never"}</span></div>
  </div>
  <div class="card"><h3>Reconciliation &amp; integrity</h3>
    <div style="font-size:12.5px;color:var(--ink3);margin-bottom:12px">Checks the app can verify from its own data — cash-flow reconciliation, and pending workbook changes that point at an account, category, or holding you've since deleted.</div>
    ${integrityRows}
  </div>
  <div class="card"><h3>Workbook update receipts</h3>
    <div style="font-size:12.5px;color:var(--ink3);margin-bottom:10px">The latest 20 successful updates are kept locally and included in portable backups.</div>
    ${receipts.length?receipts.slice(0,5).map(r=>`<div class="cap-row"><div class="l"><div class="kind">${esc(r.outputName||"Workbook update")}</div><div class="meta">${esc(new Date(r.completedAt).toLocaleString("en-IN"))} \u00b7 ${Object.values(r.applied||{}).reduce((a,b)=>a+(+b||0),0)} applied${r.compatibleDriftConfirmed?" \u00b7 drift confirmed":""}<br><span class="mono">${esc((r.outputFingerprint||"").slice(0,12))}\u2026</span></div></div></div>`).join(""):'<div class="muted" style="font-size:12.5px">No workbook updates recorded yet.</div>'}
  </div>
  <div class="card"><h3>Where this data lives</h3>
    <div class="cap-kv"><span class="k">Storage</span><span class="v">This browser only</span></div>
    <div class="cap-kv"><span class="k">Queue key</span><span class="v">${CAP_K_QUEUE}</span></div>
    <div class="cap-kv"><span class="k">Entries queued</span><span class="v">${CAP_QUEUE.length} (${bytesOf(qraw)} B)</span></div>
    <div class="cap-kv"><span class="k">Archived years</span><span class="v">${archLabels.length} (${bytesOf(araw)} B)</span></div>
  </div>
  <div class="card"><h3>Safety copy (this device)</h3>
    <div style="font-size:12.5px;color:var(--ink3);margin-bottom:12px">Creates a second snapshot in this browser's IndexedDB. It does not update your Excel workbook, create a downloadable file, or protect against clearing all browser data.</div>
    <div class="cap-kv"><span class="k">Last safety copy</span><span class="v" id="cd_lastsync">Checking\u2026</span></div>
    <button class="btn p" id="cd_localsync_save" style="width:100%;margin-top:10px">Save safety copy</button>
    <button class="btn" id="cd_localsync_restore" style="width:100%;margin-top:8px" disabled>Restore safety copy</button>
  </div>
  <div class="card"><h3>Portable backup (JSON)</h3>
    <div style="font-size:12.5px;color:var(--ink3);margin-bottom:12px">Downloads everything on your dashboard right now \u2014 transactions, holdings (incl. lot history), accounts, categories, budget, target mix, plan, every Tax-tab field (tax rules, deductions, capital-gains events, FX rates, tax payments, Schedule FA entries), archived Quick-Add batches, and the cached workbook bytes used for Merge/Export \u2014 as one plain JSON file. Independent of the Excel merge path: doesn't touch your workbook, and can restore on a completely different device or browser without a spreadsheet involved. (Older backups made before this list grew will restore fine \u2014 they just won't have the newer fields to restore.)</div>
    <div class="cap-kv"><span class="k">Last full backup</span><span class="v">${S.lastBackupAt?esc(new Date(S.lastBackupAt).toLocaleString("en-IN")):"Never"}</span></div>
    <div class="cap-kv"><span class="k">Auto-backup</span><span class="v" id="cd_autobackup_status">Checking\u2026</span></div>
    <div class="cap-kv"><span class="k">Transactions</span><span class="v">${(S.txns||[]).length}</span></div>
    <div class="cap-kv"><span class="k">Holdings</span><span class="v">${(S.holdings||[]).length}</span></div>
    <div class="cap-kv"><span class="k">Capital-gains events</span><span class="v">${(S.capGainsEvents||[]).length}</span></div>
    <div class="cap-kv"><span class="k">Tax payments logged</span><span class="v">${(S.taxPayments||[]).length}</span></div>
    <button class="btn" id="cd_backup" style="width:100%;margin-top:10px">&#8613; Export backup</button>
    <div style="margin-top:12px"><label class="btn" for="cd_restore_file" style="width:100%;display:block;text-align:center;cursor:pointer">&#8615; Restore from backup file&hellip;</label>
      <input type="file" id="cd_restore_file" accept="application/json,.json" style="display:none"></div>
    <button class="btn" id="cd_autobackup_enable" style="width:100%;margin-top:10px">Enable automatic backups&hellip;</button>
  </div>
  <div class="card"><h3>Discard pending queue</h3>
    <div style="font-size:12.5px;color:var(--ink3);margin-bottom:12px">Clears every change waiting to be merged into a workbook \u2014 transactions, categories, accounts, holdings, investment lots, budget \u2014 <b>without merging them and without touching your archives</b> below. Use this when a queued change is wrong and you'd rather start clean than merge it.</div>
    <div class="cap-kv"><span class="k">Pending right now</span><span class="v" id="cd_pending_summary">${pendingN?esc(pending.join(", ")):"Nothing queued"}</span></div>
    <button class="btn" id="cd_discard_queue" style="width:100%;margin-top:10px" ${pendingN?"":"disabled"}>Discard pending queue</button>
  </div>
  <div class="card"><h3>Archive &amp; start a new year</h3>
    <div style="font-size:12.5px;color:var(--ink3);margin-bottom:12px">Parks whatever's queued under a year label, then clears the queue. Nothing is deleted \u2014 downloadable below.</div>
    <div class="field"><label>Label</label><input type="text" id="cd_label" value="${suggested}"></div>
    <button class="btn" id="cd_archive" style="width:100%">Archive queue as this year &amp; reset</button>
  </div>
  ${archLabels.length?`<div class="card"><h3>Archived years</h3>${archLabels.map(l=>`<div class="cap-row"><div class="l"><div class="kind">${esc(l)}</div><div class="meta">${CAP_ARCH[l].entries.length} entries \u00b7 ${new Date(CAP_ARCH[l].archivedAt).toLocaleDateString("en-IN")}</div></div><div class="acts" style="margin-top:0"><span data-dl="${esc(l)}">Download</span></div></div>`).join("")}</div>`:""}
  <div class="cap-danger"><h3>Flush all local ledger data</h3>
    <div style="font-size:12.5px;color:var(--ink2);margin-bottom:12px">Deletes <b>every pending queue</b> (transactions, categories, accounts, holdings, investment lots, budget) <b>and every archive</b> from this browser, permanently. Doesn't touch your imported dashboard data (transactions/holdings/accounts/categories/budget/etc. already on the app itself stay untouched \\u2014 this only clears what's queued for merge and what's been archived).</div>
    <div class="field"><label>Type DELETE to confirm</label><input type="text" id="cd_confirm"></div>
    <button class="btn" id="cd_flush" style="width:100%;color:var(--neg);border-color:color-mix(in srgb,var(--neg) 50%,var(--line2))" disabled>Flush everything</button>
  </div>`;
  const localMeta=storageAdapter.getStateMetadata(STORE);
  if(localMeta&&localMeta.writtenAt)$("#cd_local_save").textContent=new Date(localMeta.writtenAt).toLocaleString("en-IN");
  wbCacheGet().then(wb=>{
    const el=$("#cd_workbook_status");if(!el)return;
    el.textContent=wb?`${wb.name||"Workbook"} cached on this device`:"Missing \u2014 choose a workbook when updating";
  });
  $("#cd_localsync_save").onclick=async ()=>{await saveSafetyCopy();renderCapData();};
  $("#cd_backup").onclick=async ()=>{await capDoBackupDownload();renderCapData();};
  (async ()=>{
    const el=$("#cd_autobackup_status");if(!el)return; // screen may have navigated away already
    if(!("showSaveFilePicker" in window)){el.textContent="Not supported in this browser";const btn=$("#cd_autobackup_enable");if(btn)btn.disabled=true;return;}
    const handle=await storageAdapter.getAutoBackupHandle();
    if(!$("#cd_autobackup_status"))return;
    if(!handle){$("#cd_autobackup_status").textContent="Not enabled";return;}
    const perm=await handle.queryPermission({mode:"readwrite"});
    if(!$("#cd_autobackup_status"))return;
    $("#cd_autobackup_status").textContent=perm==="granted"?`Enabled — ${esc(handle.name)}`:"Permission needs renewing";
    const btn=$("#cd_autobackup_enable");if(btn)btn.textContent=perm==="granted"?"Change auto-backup file…":"Re-enable automatic backups…";
  })();
  $("#cd_autobackup_enable").onclick=async ()=>{
    try{
      const existing=await storageAdapter.getAutoBackupHandle();
      if(existing&&(await existing.queryPermission({mode:"readwrite"}))!=="granted"){
        if((await existing.requestPermission({mode:"readwrite"}))==="granted"){
          await writeAutoBackupTo(existing);toast("Automatic backups re-enabled");renderCapData();
        }else toast("Permission wasn't granted");
        return;
      }
      const handle=await window.showSaveFilePicker({suggestedName:"pechak_autobackup.json",
        types:[{description:"Pechak backup",accept:{"application/json":[".json"]}}]});
      await storageAdapter.setAutoBackupHandle(handle);
      await writeAutoBackupTo(handle);
      toast("Automatic backups enabled — first backup saved");renderCapData();
    }catch(e){if(e.name!=="AbortError")toast("Couldn't enable automatic backups: "+e.message);}
  };
  localSyncGet().then(snap=>{
    const el=$("#cd_lastsync");if(!el)return; // screen may have navigated away already

      const btn=$("#cd_localsync_restore");

        const ok=await capRestoreFromBackup(snap);
        if(ok){toast("Safety copy restored");render();renderCapData();}

      el.textContent="Never";

  });
  $("#cd_restore_file").onchange=async (e)=>{
    const f=e.target.files[0];if(!f)return;

      if(ok){toast("Backup restored");render();renderCapData();}
    }catch(err){toast(`Couldn't restore: ${err.message}`);}
    e.target.value="";
  };
  $("#cd_discard_queue").onclick=async ()=>{
    const n=totalPendingCount();
    if(!n){toast("Nothing queued");return;}
    if(!(await capConfirm(`Discard ${pending.join(", ")}?\n\nThese will NOT be merged into any workbook. Your archives below are not affected.`)))return;

  };
  $("#cd_archive").onclick=async ()=>{

    CAP_ARCH[label]={archivedAt:new Date().toISOString(),entries:CAP_QUEUE};
    capPersistArch();CAP_QUEUE=[];capPersistQueue();
    toast(`Archived as ${label}`);renderCapData();
  };
  $$("#capBody [data-dl]").forEach(el=>el.onclick=()=>{const l=el.dataset.dl;capDownload(`archive_${l.replace(/[^a-z0-9-]/gi,"_")}.json`,new TextEncoder().encode(JSON.stringify(CAP_ARCH[l],null,1)),"application/json");});
  $("#cd_confirm").oninput=()=>{$("#cd_flush").disabled=$("#cd_confirm").value!=="DELETE";};
  $("#cd_flush").onclick=async ()=>{
    if(!(await capConfirm("Final check \u2014 permanently erase every pending queue AND every archive from this browser?")))return;
    /* Bug fix: this used to only clear CAP_QUEUE (transactions) despite the
       button's own label/description promising "everything" -- categories,
       accounts, holdings and budget queues silently survived a "flush".
       discardPendingQueues() is the function that actually clears all 5;
       archives/meta still need clearing separately since that function
       deliberately never touches those (it's also used before an import,

/* ===== PRICE REFRESH =====
   Free, no-backend price refresh for any holding that has a symbol filled in.
   Mutual Fund/Index Fund/ELSS -> MFapi.in directly, confirmed CORS-friendly by
   a real browser test against the live site (not assumed). Stock/ETF -> Yahoo
   Finance's unofficial chart endpoint, which that same test confirmed blocks
   direct browser CORS -- routed through a public CORS proxy instead (codetabs
   primary, allorigins fallback). Public proxies come and go, which is exactly
   why there are two, tried in order, rather than a hardcoded single point of
   failure -- swap/add entries in CORS_PROXIES if both ever die.
   Every successful result feeds into holdQueue("editHold",...) -- the EXACT
   same queue path the manual price field already uses, so there's no new
   merge/write-side code at all. `symbol` itself never reaches the workbook:
   invApplyQueue's writeRow only ever reads 9 specifically-named columns, so an
   extra field riding along in a queued object (from the {...h} spreads used
   elsewhere for holdings) is inert as far as the .xlsx is concerned. */
const MF_REFRESH_TYPES=new Set(["Mutual Fund","Index Fund","ELSS"]);
const STOCK_REFRESH_TYPES=new Set(["Stock","ETF"]);
const CORS_PROXIES=[
  u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),
  u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
];
async function fetchViaCorsProxy(url){
  let lastErr;
  for(const wrap of CORS_PROXIES){
    try{
      const res=await fetch(wrap(url));
      if(!res.ok)throw new Error("HTTP "+res.status);
      return await res.json();
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error("Every CORS proxy failed");
}
async function fetchMfNav(schemeCode){
  const res=await fetch(`https://api.mfapi.in/mf/${encodeURIComponent(schemeCode)}`);
  if(!res.ok)throw new Error("HTTP "+res.status);
  const j=await res.json();
  const nav=j&&j.data&&j.data[0]&&parseFloat(j.data[0].nav);
  if(!nav||isNaN(nav))throw new Error("No NAV in response -- check the scheme code");
  return nav;
}
// The user's own Cloudflare Worker (see cloudflare-worker.js) -- confirmed live
// and returning real Yahoo chart JSON via a direct browser test, not assumed.
// Theirs: no shared rate limit with strangers, no third party relaying the
// request, nothing that can quietly grow a paywall. The public CORS-proxy
// chain (fetchViaCorsProxy) is kept as a fallback purely in case the Worker
// itself is ever down -- costs nothing to leave in place, and both routes
// return the identical Yahoo chart JSON shape, so the parsing below never
// needs to know which one actually answered.
const STOCK_PRICE_WORKER_URL="https://ledger-stock-proxy.paritoshp1412.workers.dev/";
async function fetchStockPrice(ticker){
  let j;
  try{
    const res=await fetch(`${STOCK_PRICE_WORKER_URL}?ticker=${encodeURIComponent(ticker)}`);
    if(!res.ok)throw new Error("HTTP "+res.status);
    j=await res.json();
  }catch(e){
    j=await fetchViaCorsProxy(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}`);
  }
  const price=j&&j.chart&&j.chart.result&&j.chart.result[0]&&j.chart.result[0].meta&&j.chart.result[0].meta.regularMarketPrice;
  if(!price)throw new Error("No price in response -- check the ticker (e.g. RELIANCE.NS)");
  return price;
}
async function refreshHoldingPrices(){
  const targets=(S.holdings||[]).map((h,i)=>({h,i})).filter(({h})=>h.symbol&&(MF_REFRESH_TYPES.has(h.type)||STOCK_REFRESH_TYPES.has(h.type)));
  if(!targets.length){toast("No holdings have a symbol set yet \u2014 add one under \u201cSymbol / scheme code\u201d");return;}
  const btn=$("#btnRefreshPrices");if(btn){btn.disabled=true;btn.textContent="Refreshing\u2026";}
  let ok=0;const fails=[];
  for(const {h,i} of targets){
    try{
      const price=MF_REFRESH_TYPES.has(h.type)?await fetchMfNav(h.symbol):await fetchStockPrice(h.symbol);
      S.holdings[i]={...h,price};
      holdQueue("editHold",{oldName:h.name,oldAcct:h.acct,cls:h.cls,type:h.type,name:h.name,acct:h.acct,units:h.units,avg:h.avg,price,minv:h.minv,mval:h.mval});
      ok++;
    }catch(e){fails.push(`${h.name||h.symbol}: ${e.message}`);}
  }
  persist();
  const skipped=(S.holdings||[]).length-targets.length;
  if(S.loaded)render();
  const resultEl=$("#refreshPricesResult");
  if(resultEl){
    const bits=[`${ok} updated`];
    if(fails.length)bits.push(`${fails.length} failed \u2014 ${fails.join("; ")}`);
    if(skipped)bits.push(`${skipped} skipped (no symbol, or not a market-priced type)`);
    resultEl.innerHTML=`<div class="muted" style="font-size:11.5px;margin:6px 0 10px">${esc(bits.join(". "))}.</div>`;
  }
  toast(fails.length?`Refreshed ${ok}, ${fails.length} failed`:`Refreshed ${ok} price${ok===1?"":"s"}`);
}
