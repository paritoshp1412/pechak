      toast("FD updated");
    }else{
      S.fixedDeposits.push({id:capUid(),...rec,source:"app"});
      fdQueue("addFD",{...rec});
      toast("FD added");
    }
    persist();renderInvest();
  };
  $("#fd_cancel").onclick=()=>{fdEditIx=-1;renderInvest();};
  $$("#v-invest [data-fdedit]").forEach(b=>b.onclick=()=>{fdEditIx=+b.dataset.fdedit;renderInvest();window.scrollTo(0,0);});
  $$("#v-invest [data-fddel]").forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.fddel,f=S.fixedDeposits[i];
    if(await capConfirm(`Remove this FD (${f.bank}, \u20b9${fmtN(f.principal)})? This also removes it on your next workbook update.`)){
      const matchKey={bank:f.bank,principal:f.principal,start:f.start};
      S.fixedDeposits.splice(i,1);
      if(fdEditIx===i)fdEditIx=-1;
      fdQueue("removeFD",{matchKey});
      persist();renderInvest();
    }
  });
  if(fdEditIx>=0&&S.fixedDeposits[fdEditIx]){const f=S.fixedDeposits[fdEditIx];
    $("#fd_bank").value=f.bank||"";$("#fd_principal").value=f.principal??"";
    $("#fd_rate").value=f.rate!=null?+(f.rate*100).toFixed(4):"";
    $("#fd_comp").value=String(f.compPerYear||1);
    $("#fd_start").value=f.start||"";$("#fd_maturity").value=f.maturity||"";
    $("#fd_payout").value=f.payout||"Cumulative";$("#fd_status").value=f.status||"Active";
    $("#fd_tds").value=f.tdsPaid??"";$("#fd_senior").checked=!!f.senior;
    $("#fdFormTitle").textContent="Edit Fixed Deposit";$("#fd_add").textContent="Update FD";$("#fd_cancel").style.display="";}
  renderAlloc();
}

/* ===== TAX SUMMARY (Phases 1-3 of the Tax tab) =====
   Ports Tax Summary Steps 1-4 from the workbook: normal income (salary incl.
   RSU/ESPP perquisite, interest, dividends, other, plus capital gains taxed
   @ slab), standard deduction + Chapter VI-A + HRA (Phase 2), slab tax both
   regimes, 87A rebate + the 87A marginal-relief cliff, cess (Step 3), then
   capital gains at special rates -- 111A/112A/other (Step 4, Phase 3, see
   capGainsBreakdown() below). Deliberately NOT included yet: surcharge
   (Phase 4 of the *build plan*, confusingly also often called "Step 5" --
   needs total income incl. gains).
   Capital Gains / Capital Loss transaction categories are deliberately
   excluded from the ordinary income sums below -- real capital gains now
   come from S.capGainsEvents (lot-level, Phase 0) via capGainsBreakdown(),
   not from those categories, which would double-count if folded in too. */
/* Migration guard: S.taxRules may have been persisted by an earlier session
   before the Phase 3 CG matrix existed. Rather than let capGainsBreakdown() blow
   up on a missing .cg, patch it in from the default once, in place. */
function taxRules(){
  return normalizeTaxRules(S.taxRules,TAX_RULES_DEFAULT);
}
/* S.scheduleFA (Phase 7): a dictionary, not a list -- keyed by a stable
   per-lot key ("hold:<lotId>" for a currently-held RSU/ESPP lot, "event:<id>"
   for one sold during the calendar year), storing {peakValue, closingValue}
   in \u20b9 (user-supplied; this app doesn't compute the SBI TTBR conversion
   itself, see scheduleFACandidates()). A dictionary survives the candidate
   list being rebuilt every render (new lots appearing, old ones being sold)
   without losing values already entered for keys that still exist. */
function ensureScheduleFAState(){if(!S.scheduleFA)S.scheduleFA={};}
/* S.taxPayments (Phase 6): the TDS/advance-tax/self-assessment log, one entry per
   payment, tagged with the FY string it belongs to at creation time -- NOT filtered
   by date range, since self-assessment tax is routinely paid months after the FY
   itself ends (before the ITR filing deadline), which a date-range filter would
   silently drop. S.taxSettings holds the Step 6 regime toggle (auto = follow
   whichever regime Steps 1-5 recommend; manual = pinned regardless) and the
   "computed as of" date that drives 234B's running interest clock. */
function ensureTaxPaymentState(){
  if(!S.taxPayments)S.taxPayments=[];
  if(!S.taxSettings)S.taxSettings={asOfDate:null,regimeMode:"auto",regimeManual:"new"};
}
function taxPaymentsForFy(fy){return (S.taxPayments||[]).filter(p=>p.fy===fy);}
function taxFyTxns(){const tr=taxRules();return (S.txns||[]).filter(x=>x.date>=tr.fyStart&&x.date<=tr.fyEnd);}
function slabTax(taxable,bands){return calculateSlabTax(taxable,bands);}
/* Standard published Section 87A marginal-relief rule for incomes just over
   the rebate limit: the extra tax due can never exceed the amount by which
   income exceeds that limit, so the cliff at the threshold is smoothed. The
   workbook's own Tax Summary cell for this was an unevaluated #VALUE! cache
   (no data entered in the template), not a readable formula -- this is the
   published statutory rule, not something read off the sheet. Worth
   re-checking against Tax Summary directly if a real formula ever surfaces. */
function rebateAndRelief(taxableIncome,slabTaxAmt,limit,maxRebate){
  return calculateRebateAndRelief(taxableIncome,slabTaxAmt,limit,maxRebate);
}
/* ===== DEDUCTIONS (Phase 2) =====
   Chapter VI-A section claims + HRA exemption. "regime":"Old" sections count
   only in the old regime; "Both" counts in either (80CCD(2) is the one
   Chapter VI-A section the new regime actually allows -- enforced here by
   which entries get summed per regime, not just by a UI label). */
function deductionsRules(){return S.deductions||DEDUCTIONS_DEFAULT;}
function computeHraExemption(hra){
  return calculateHraExemption(hra);
}
function deductionsBreakdown(regime){
  const d=deductionsRules();
  let chapterVIA=0;
  d.entries.forEach(e=>{
    const applies=regime==="old"?(e.regime==="Old"||e.regime==="Both"):(e.regime==="Both");
    if(applies)chapterVIA+=Math.min(+e.claimed||0,+e.limit||0);
  });
  const hra=regime==="old"?computeHraExemption(d.hra):0;
  return{chapterVIA,hra,total:chapterVIA+hra};
}
function computeTaxRegime(regime,income){
  return computeTaxRegimePure(regime,income,taxRules(),deductionsBreakdown(regime));
}
/* Tax-after-rebate/relief for an arbitrary taxable-income figure, using the
   same slab bands + 87A logic as computeTaxRegime -- factored out so the
   surcharge marginal-relief hypothetical below ("what would tax have been at
   exactly the threshold?") can reuse the real rebate/relief logic instead of
   a bare slabTax() call, which would incorrectly ignore 87A near the ₹12L/5L
   cliff for anyone whose hypothetical taxable income lands there. */
function taxAfterForTaxable(taxable,bands,limit,maxRebate){
  return rebateAndRelief(taxable,slabTax(taxable,bands),limit,maxRebate).taxAfter;
}
/* Surcharge is a flat rate applied once total income crosses a threshold --
   unlike slabTax() above, it is NOT marginal/stacked, it's a cliff: whichever
   band the total falls into supplies the one rate applied to the WHOLE tax
   amount, before marginal relief smooths the cliff itself (see computeSurcharge). */
function flatBandRate(value,bands){
  for(const b of bands)if(value>b[0]&&value<=b[1])return b[2];
  return bands.length?bands[bands.length-1][2]:0;
}
/* The lower boundary of whichever band flatBandRate() matched -- i.e. the
   exact threshold that was just crossed, needed as the anchor point for
   marginal relief below. Same matching logic as flatBandRate() so the two
   can never disagree about which band a value fell into. */
function bandFrom(value,bands){
  for(const b of bands)if(value>b[0]&&value<=b[1])return b[0];
  return bands.length?bands[bands.length-1][0]:0;
}
/* ===== SURCHARGE (Phase 4) =====
   Two things this does that a naive "look up one rate, multiply the total tax"
   version would get wrong, both named explicitly in the build plan's Phase 4
   scope (context-transfer-v10/tax-tab-build-plan.md):
   1. The rate is looked up against TOTAL income (taxable normal income + every
      capital-gains bucket, since gains aren't reduced by deductions but do
      count toward the income tier that decides the surcharge rate) -- not just
      taxable normal income alone.
   2. The 15% cap: surcharge on 111A STCG, 112A LTCG (net of exemption), and
      DIVIDEND income specifically can never exceed 15%, even if the person's
      overall rate (from total income) is 25%. Everything else -- normal slab
      tax, and the "other assets" CG bucket (debt funds, gold, SGB, RSU/ESPP)
      -- gets the FULL rate for their tier, no cap.
   Dividend's own contribution to slab tax isn't a number the sheet hands us
   directly (tax is computed on combined taxable income, not per income head) --
   this uses the standard "marginal contribution" technique (tax on everything,
   minus tax on everything-except-dividend, both at the same slab bands) to
   isolate it, same kind of well-documented-but-not-sheet-confirmed technique
   already used for 87A's relief. Flagged, not hidden.

   MARGINAL RELIEF (built this session, confirmed against the actual statutory
   text -- incometaxindia.gov.in's own tax-rates page -- and cross-checked
   against several independent worked examples, not assumed): "the amount
   payable as income tax and surcharge shall not exceed the total amount
   payable as income-tax on total income of [the threshold] by more than the
   amount of income that exceeds [the threshold]." Implemented as:
     hypotheticalTaxable = actual taxable income, reduced just enough that
       total income (taxable + all CG buckets) would equal the threshold --
       holding the capital-gains amounts FIXED, since those are real, already-
       realized amounts; only the "what if normal income had been lower"
       side of the hypothetical makes sense to vary.
     taxAtThreshold = tax on that hypothetical income (via 87A too, using
       taxAfterForTaxable above), PLUS the actual (unchanged) CG tax -- no
       surcharge, since at the threshold itself you haven't exceeded it.
     maxAllowed = taxAtThreshold + (actual total income \u2212 threshold)
     relief = max(0, actual tax+surcharge \u2212 maxAllowed), taken OFF the
       surcharge specifically (never the base tax), then cess is computed on
       the post-relief total -- "cess is added after marginal relief" per
       every source checked. Comfortably inside a band this computes to
       (near) zero and changes nothing; it only bites right at a threshold. */
function computeSurcharge(regimeResult,income,cg){
  const tr=taxRules();
  const cgOther=Math.max(0,cg.buckets.ltcgOther),cg111A=Math.max(0,cg.buckets.stcg111A),cg112ANet=cg.ltcg112ANet;
  const totalIncomeForSurcharge=regimeResult.taxable+cg111A+cg112ANet+cgOther;
  const rate=flatBandRate(totalIncomeForSurcharge,tr.surchargeSlabs);
  const cappedRate=Math.min(rate,tr.surcharge.capOnSpecialIncome);
  const bands=regimeResult.bands;
  const dividendTaxPortion=Math.max(0,slabTax(regimeResult.taxable,bands)-slabTax(Math.max(0,regimeResult.taxable-income.dividend),bands));
  const taxOnSpecial=Math.min(regimeResult.taxAfter,cg.tax111A+cg.tax112A+dividendTaxPortion);
  const combinedPreCess=regimeResult.taxAfter+cg.totalCgTax;
  const taxOnNormal=Math.max(0,combinedPreCess-taxOnSpecial);
  const surcharge=taxOnNormal*rate+taxOnSpecial*cappedRate;

  const threshold=bandFrom(totalIncomeForSurcharge,tr.surchargeSlabs);
  const hypotheticalTaxable=Math.max(0,threshold-cg111A-cg112ANet-cgOther);
  const taxAtThreshold=taxAfterForTaxable(hypotheticalTaxable,bands,regimeResult.limit,regimeResult.maxRebate)+cg.totalCgTax;
  const maxAllowed=taxAtThreshold+Math.max(0,totalIncomeForSurcharge-threshold);
  const marginalRelief=Math.max(0,(combinedPreCess+surcharge)-maxAllowed);
  const surchargeAfterRelief=Math.max(0,surcharge-marginalRelief);

  const cess=(combinedPreCess+surchargeAfterRelief)*tr.cess;
  const grandTotal=combinedPreCess+surchargeAfterRelief+cess;
  return{totalIncomeForSurcharge,rate,cappedRate,dividendTaxPortion,taxOnSpecial,taxOnNormal,combinedPreCess,
    surcharge,marginalRelief,surchargeAfterRelief,cess,grandTotal,threshold};
}
/* ===== ADVANCE TAX -- SECTIONS 234B/234C (Phase 6) =====
   fyCheckpointDate: TAX_RULES_DEFAULT.advanceTax stores checkpoint dates as bare
   "MM-DD" (they're the same every year); this attaches the right calendar year
   given the FY the checkpoint falls in -- Sep/Dec belong to the FY's start year,
   Mar belongs to the following calendar year (the FY itself runs Apr-Mar). */
function fyCheckpointDate(fyStart,mmdd){
  const fyYear=+String(fyStart).slice(0,4),mm=+String(mmdd).slice(0,2);
  return `${mm>=4?fyYear:fyYear+1}-${mmdd}`;
}
/* Rule 119A: any part of a month counts as a full month. Counts calendar months
   from `fromDateStr` to `toDateStr` inclusive of the starting month -- e.g. 1 Apr
   to any day in Jul is 4 months (Apr, May, Jun, Jul), matching every worked
   example checked against incometaxindia.gov.in's own explainer. */
function monthsInclusive(fromDateStr,toDateStr){
  if(!fromDateStr||!toDateStr)return 0;
  const a=new Date(fromDateStr+"T00:00:00"),b=new Date(toDateStr+"T00:00:00");
  if(b<a)return 0;
  return Math.max(0,(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+1);
}
/* Rule 119A also rounds the amount interest is charged on down to the nearest
   \u20b9100 (fractions of \u20b9100 ignored) before applying the rate -- small, but
   real, and cheap to get right. */
function round119A(amt){return Math.floor(Math.max(0,amt)/100)*100;}
/* computeAdvanceTax: 234B and 234C together, against whichever regime's grand
   total the caller passes in (Step 6 lets the user pick that regime).
   "taxDue"/"assessed tax" = grandTotal - TDS, per both sections' own definitions
   -- Sec 234C's explanation and 234B's "assessed tax" both net out TDS/TCS first.
   NOT netted out (a documented simplification, shown in the UI): relief under
   Sections 89/90/90A/91 (salary-arrears relief, foreign tax credit) -- this app
   has no data for either, so omitting them only matters if they'd actually apply
   to you; if so, these numbers will overstate any shortfall/interest.
   234C's individual (non-company) schedule -- 30%/15Sep, 60%/15Dec, 100%/15Mar,
   no tolerance band -- is Sec 234C(1)(b), confirmed against the statute directly
   (see the advanceTax comment on TAX_RULES_DEFAULT). At each checkpoint:
     - the CG carve-out excuses the part of the shortfall equal to CG tax not yet
       realized as of that checkpoint (Sec 234C(1)'s actual capital-gains proviso,
       not an invented feature) -- computed by re-running capGainsBreakdown()
       restricted to sales up to that date, so gains that genuinely hadn't
       happened yet can't count against you.
     - the proviso requires the excused amount to actually get paid by the next
       checkpoint (or by 31 Mar for the last one) -- approximated here by checking
       whether cumulative payments reach the NEXT checkpoint's required percentage
       on time; a reasonable reading, not a line-by-line rupee trace.
   234B triggers if total advance/self-assessment tax paid by 31 Mar is under 90%
   of assessed tax; if so, interest runs on the ENTIRE shortfall (confirmed by the
   government's own FAQ: "if there is a shortfall... interest is levied on the
   entire amount", not just the gap down to 90%) from 1 Apr of the assessment year
   to `asOfDate` -- a user-entered date, since this app has no notion of "return
   filed"/"regular assessment" to anchor the real statutory end date. */
function computeAdvanceTax(tr,grandTotal,cg,asOfDate){
  ensureTaxPaymentState();
  const ar=tr.advanceTax||TAX_RULES_DEFAULT.advanceTax;
  const payments=taxPaymentsForFy(tr.fy);
  const tds=payments.filter(p=>p.type==="TDS").reduce((s,p)=>s+(+p.amount||0),0);
  const advLike=payments.filter(p=>p.type==="Advance"||p.type==="Self-Assessment");
  const cumPaidBy=d=>advLike.filter(p=>p.date&&p.date<=d).reduce((s,p)=>s+(+p.amount||0),0);
  const taxDue=Math.max(0,grandTotal-tds);

  const cps=ar.checkpoints.map(cp=>({...cp,dateStr:fyCheckpointDate(tr.fyStart,cp.date)}));
  const cgFull=cg.totalCgTax;
  const c234=cps.map((cp,i)=>{
    const required=cp.pct*taxDue,actual=cumPaidBy(cp.dateStr);
    const raw=Math.max(0,required-actual);
    const cgToDate=capGainsBreakdown(cp.dateStr).totalCgTax;
    const cgNotYet=Math.max(0,cgFull-cgToDate);
    const nextDate=i<cps.length-1?cps[i+1].dateStr:tr.fyEnd;
    const nextRequired=i<cps.length-1?cps[i+1].pct*taxDue:taxDue;
    const conditionMet=cumPaidBy(nextDate)>=nextRequired-0.5;
    const excused=conditionMet?Math.min(raw,cgNotYet):0;
    const effective=Math.max(0,raw-excused);
    const interest=round119A(effective)*ar.rate*cp.months;
    return{...cp,required,actual,raw,cgNotYet,excused,effective,interest};
  });
  const total234C=c234.reduce((s,c)=>s+c.interest,0);

  const paidFullYear=cumPaidBy(tr.fyEnd);
  const ninety=ar.thresholdPct90*taxDue;
  const triggered234B=paidFullYear<ninety-0.5;
  const shortfall234B=triggered234B?Math.max(0,taxDue-paidFullYear):0;
  const aprilOfAY=`${String(tr.fyEnd).slice(0,4)}-04-01`; /* fyEnd's calendar year IS the AY's start year */
  const asOf=asOfDate||tr.fyEnd;
  const months234B=triggered234B?monthsInclusive(aprilOfAY,asOf):0;
  const interest234B=round119A(shortfall234B)*ar.rate*months234B;

  const totalPaidAll=tds+advLike.reduce((s,p)=>s+(+p.amount||0),0);
  const netPosition=grandTotal+interest234B+total234C-totalPaidAll;
  return{tds,taxDue,c234,total234C,paidFullYear,ninety,triggered234B,shortfall234B,aprilOfAY,asOf,months234B,
    interest234B,totalPaidAll,netPosition};
}
/* ===== SCHEDULE AL/FA FLAGS (Phase 7) =====
   scheduleFACandidates: Schedule FA runs on the CALENDAR year, not the FY --
   for a FY starting April of year Y, the Schedule FA year that shares the
   same ITR/AY is calendar year Y itself (1 Jan Y-31 Dec Y), since 31 Dec Y
   falls inside that FY (Apr Y-Mar Y+1). Confirmed against the government's
   own Schedule FA table headers ("...calendar year ending as on 31st day of
   December...").
   Gathers every RSU/ESPP lot that needs a Table A3 row: currently-held lots
   (still sitting in a holding's h.lots, acquired on/before the CY end -- if
   it's still held today it was necessarily held at some point during any
   past CY) PLUS lots sold DURING that calendar year (from S.capGainsEvents,
   which is where a fully-consumed lot's record lives once it's gone from
   h.lots). This is NOT claimed exhaustive: a lot bought and fully sold
   within the same calendar year, before this app's own lot-tracking existed,
   could still be missed -- flagged in the Step 7 UI, not hidden. */
function fyCalendarYear(fyStart){return +String(fyStart).slice(0,4);}
function scheduleFACandidates(tr){
  ensureScheduleFAState();
  const caYear=fyCalendarYear(tr.fyStart),caStart=`${caYear}-01-01`,caEnd=`${caYear}-12-31`;
  const out=[];
  let idsAssigned=false;
  (S.holdings||[]).forEach(h=>{
    if(h.type!=="RSU"&&h.type!=="ESPP")return;
    (h.lots||[]).forEach(lot=>{
      if(!lot.id){lot.id="l"+capUid();idsAssigned=true;}
      if(lot.acqDate&&lot.acqDate<=caEnd){
        out.push({key:`hold:${lot.id}`,label:`${h.name} (${h.type}) \u2014 vested ${dstr(lot.acqDate)}`,heldNow:true,acqDate:lot.acqDate});
      }
    });
  });
  (S.capGainsEvents||[]).forEach(e=>{
    if(e.type!=="RSU"&&e.type!=="ESPP")return;
    if(e.saleDate&&e.saleDate>=caStart&&e.saleDate<=caEnd){
      out.push({key:`event:${e.id}`,label:`${e.holdName||e.type} \u2014 vested ${dstr(e.acqDate)}, sold ${dstr(e.saleDate)}`,heldNow:false,acqDate:e.acqDate});
    }
  });
  if(idsAssigned)persist();
  out.sort((a,b)=>String(a.acqDate).localeCompare(String(b.acqDate)));
  return{caYear,caStart,caEnd,candidates:out};
}
/* ===== FIXED DEPOSITS (accrual-basis taxable interest, Sec 194A TDS check) =====
   The Fixed Deposits sheet computes this itself (Value @ As-of, Interest this FY)
   via live formulas -- this mirrors those SAME formulas independently in JS, from
   the data-entry fields only (principal/rate/comp-per-year/dates/payout type), not
   by reading the sheet's computed output. Same principle as every other tax
   function here: the app keeps working with zero workbook. Interest here is
   accrual-basis and entirely independent of S.txns -- if an FD's interest PAYOUT
   was also logged as a Transaction under "Interest Income" (routine for a
   Payout-type FD), that's a separate cash-basis number this does NOT try to net
   out or detect an overlap with; shown as its own line item on purpose rather than
   silently merged, since guessing which transactions are FD-interest-shaped could
   be wrong in either direction. */
function ensureFixedDepositsState(){if(!S.fixedDeposits)S.fixedDeposits=[];}
function ensureModelSettings(){if(!S.modelSettings)S.modelSettings={statementStart:null,asOfDate:null,modelYear:null};}
/* Excel YEARFRAC's default (3rd-arg-omitted) basis is 0 -- US NASD 30/360, NOT
   calendar days/365. The sheet's own Value-@-As-of formula uses bare YEARFRAC(),
   so matching that exact convention (not a calendar approximation) is what makes
   this agree with the sheet's number. Implements the common 30/360 day-31 and
   Feb-adjacent simplification; Excel's full spec has a couple of extra Feb 28/29
   edge cases this doesn't reproduce -- immaterial unless an FD's start or maturity
   lands exactly on a Feb month-end. */
function yearFrac30360(d1Str,d2Str){
  const d1=new Date(d1Str+"T00:00:00"),d2=new Date(d2Str+"T00:00:00");
  let day1=d1.getDate(),day2=d2.getDate();
  if(day1===31)day1=30;
  if(day2===31&&day1===30)day2=30;
  const days=(d2.getFullYear()-d1.getFullYear())*360+(d2.getMonth()-d1.getMonth())*30+(day2-day1);
  return days/360;
}
const dmin=(a,b)=>a<b?a:b,dmax=(a,b)=>a>b?a:b;
/* Mirrors the sheet's J-column exactly: Cumulative compounds at compPerYear;
   Payout stays at principal (interest is paid out each period, not compounded). */
function fdValueAt(fd,asOfStr){
  if(fd.payout==="Cumulative"){
    const yrs=fd.compPerYear*yearFrac30360(fd.start,dmin(asOfStr,fd.maturity));
    return fd.principal*Math.pow(1+fd.rate/fd.compPerYear,yrs);
  }
  return fd.principal;
}
/* Mirrors the sheet's K-column exactly: only the portion of accrual inside BOTH
   the FD's own active window and the active tax FY. Cumulative -> the increase in
   compounded value across that window; Payout -> simple interest, raw days/365
   (not YEARFRAC -- confirmed from the sheet's own K-column cell, not assumed to
   match the Cumulative branch's convention). */
function fdInterestForFY(fd,fyStart,fyEnd){
  const lo=dmax(fyStart,fd.start),hi=dmin(fyEnd,fd.maturity);
  if(hi<=lo)return 0;
  if(fd.payout==="Cumulative")return fdValueAt(fd,hi)-fdValueAt(fd,lo);
  const days=(new Date(hi+"T00:00:00")-new Date(lo+"T00:00:00"))/86400000;
  return fd.principal*fd.rate*Math.max(0,days/365);
}
function fixedDepositsBreakdown(tr){
  ensureFixedDepositsState();
  const fdTds=tr.fdTds||TAX_RULES_DEFAULT.fdTds;
  const rows=(S.fixedDeposits||[]).map(fd=>{
    const interest=fdInterestForFY(fd,tr.fyStart,tr.fyEnd);
    const threshold=fd.senior?fdTds.seniorThreshold:fdTds.threshold;
    return{...fd,interest,threshold,tdsLikely:interest>threshold};
  });
  return{rows,totalInterest:rows.reduce((s,r)=>s+r.interest,0),totalTdsPaid:rows.reduce((s,r)=>s+(r.tdsPaid||0),0)};
}
function taxIncomeHeads(){
  const txns=taxFyTxns();
  const sumCat=names=>txns.filter(x=>names.includes(x.cat)&&txnType(x)==="Income").reduce((s,x)=>s+x.amt,0);
  const cg=capGainsBreakdown();
  const fd=fixedDepositsBreakdown(taxRules());
  return{
    salary:sumCat(["Salary","Bonus","RSU Vest","ESPP Benefit"]),
    interest:sumCat(["Interest Income"]),
    dividend:sumCat(["Dividend"]),
    other:sumCat(["Other Income","Cashback"]),
    slabGains:Math.max(0,cg.buckets.slab), /* Phase 3 -- net short-term gain on "other" assets, taxed as normal income; a net LOSS here is clamped to 0 rather than reducing salary/interest/etc, since capital losses can only offset capital gains, not other income (carry-forward across years is out of scope, matching the workbook) */
    fdAccrued:fd.totalInterest /* accrual-basis FD interest, computed above -- separate from `interest` (transaction-log-based) on purpose, see the block comment above fixedDepositsBreakdown() */
  };
}
/* ===== CAPITAL GAINS TAX (Phase 3, + Phase 3b's RSU/ESPP FX resolution) =====
   Reads S.capGainsEvents (produced by consumeLotsFifo on every real Sell, Phase 0),
   filters to the active FY by saleDate, classifies each event against the CG matrix
   in taxRules().cg, and buckets into the four totals the workbook's Tax Summary Step
   4 uses: @slab, STCG 111A, LTCG 112A (net of the pooled exemption), LTCG other.
   Several kinds of event are deliberately EXCLUDED from every computed total rather
   than guessed at, each with its own visible reason (shown in the Capital Gains
   view) -- this mirrors the exact "never guess, always show the gap" design already
   used for Phase 0's unclassified lots:
     - source==="unclassified": drawn from a holding's undated/uncosted gap (Phase 0).
     - asset type not mapped below (classifyCGAsset returns "unclassified-type"):
       currently anything that isn't listed equity (Stock/ETF, cls Equity), Gold
       (incl. Digital Gold), SGB, or RSU/ESPP. Mutual Fund/Index Fund/ELSS are NOT
       auto-mapped to any bucket here -- real law (Section 50AA + the 2024 Budget)
       splits mutual funds three ways by the fund's OWN equity allocation
       (equity-oriented >=65% equity -> same 111A/112A treatment as listed shares;
       "specified"/debt >65% debt -> always slab, no LT treatment ever, ignoring
       holding period entirely; everything in between -> the same "other" 24-month/
       12.5%-flat/no-exemption rule already coded below) -- a split this app's data
       model has no field for yet (a holding's `type` alone can't say which bucket a
       given fund falls in, and that % isn't even static -- it's the fund's actual
       portfolio mix and can drift). Confirm against the Tax Rules sheet AND decide
       how a holding records its allocation category before mapping these; guessing
       "Mutual Fund" always means one of the three would risk a wrong number in
       either direction.
     - RSU/ESPP with no fx cost basis/proceeds recorded on the event (logged before
       Phase 3b existed, or the fx fields were left blank in the Add-transaction
       overlay -- they're optional, never blocking): "needs-fx-data".
     - RSU/ESPP with fx data recorded but no matching SBI TT/TTBR rate yet in
       S.fxRates for the exact month-end date Rule 115 requires: "missing-fx-rate",
       naming the exact currency+date so it's a one-line fix (Settings -> Tax Rules
       -> SBI TT/TTBR rate table), not a re-run of Phase 3b's research. */
const CG_BUCKETS={SLAB:"slab",EQUITY:"equity",OTHER:"other"};
function classifyCGAsset(type,cls,cg,mfCategory,acqDate){
  if(cls==="Equity"&&(type==="Stock"||type==="ETF"))return{bucket:CG_BUCKETS.EQUITY,ltMonths:cg.equityLtMonths,label:"Listed equity"};
  /* RSU/ESPP: the workbook is explicit these belong in the "other" bucket (24mo LT,
     no exemption) -- same rule as gold/SGB below -- once their gain is actually
     known in \u20b9, which needsFxResolution below handles before this bucket/
     ltMonths pairing is trusted. */
  if(type==="RSU"||type==="ESPP")return{bucket:CG_BUCKETS.OTHER,ltMonths:cg.otherLtMonths,label:"Foreign shares (RSU/ESPP)",needsFxResolution:true};
  if(type==="SGB")return{bucket:CG_BUCKETS.OTHER,ltMonths:cg.sgbLtMonths,label:"SGB"};
  if(cls==="Gold")return{bucket:CG_BUCKETS.OTHER,ltMonths:cg.otherLtMonths,label:"Gold"};
  /* Mutual Fund / Index Fund / ELSS: never inferred from `type` alone (a fund's
     equity allocation is a portfolio fact, not a name) -- classified by
     mfCategory, snapshotted onto the event at sale time from the holding's own
     setting (or set directly on the event later, see capGainsBreakdown).
     Debt/specified funds (Sec 50AA, Finance Act 2023): units acquired on/after
     1-Apr-2023 are ALWAYS short-term at slab, regardless of holding period --
     ltMonths:Infinity achieves that by simply never being reachable. Units of the
     SAME fund acquired BEFORE that date keep the pre-amendment rule instead (24mo
     LT threshold, flat 12.5%, no exemption -- the same "other" LT treatment as
     gold/SGB), confirmed against the Tax Rules sheet's own two-row split
     (CG_Class: "Debt MF (bought >=1Apr23)" vs "...(bought <1Apr23)"). This used to
     treat every Debt-tagged sale as always-slab regardless of acqDate -- correct
     for post-2023 units, but silently overtaxed anyone holding a genuinely
     pre-2023 debt-fund lot long-term, since that path didn't exist at all. */
  if(MF_TYPES.includes(type)){
    if(mfCategory==="Equity")return{bucket:CG_BUCKETS.EQUITY,ltMonths:cg.equityLtMonths,label:"Equity-oriented fund"};
    if(mfCategory==="Debt"){
      if(acqDate&&acqDate<"2023-04-01")return{bucket:CG_BUCKETS.OTHER,ltMonths:cg.otherLtMonths,label:"Debt fund (bought pre-1Apr23)"};
      return{bucket:CG_BUCKETS.OTHER,ltMonths:Infinity,label:"Debt/specified fund"};
    }
    if(mfCategory==="Other")return{bucket:CG_BUCKETS.OTHER,ltMonths:cg.otherLtMonths,label:"Other/hybrid fund"};
    return{bucket:"unclassified-type",ltMonths:null,label:`${type} (no fund category set)`,needsMfCategory:true};
  }
  return{bucket:"unclassified-type",ltMonths:null,label:type||"(no type)"};
}
/* Classifies a Capital-Gains-SHEET-imported event directly against the same
   7-class matrix Tax Rules -> Capital Gains uses (CG_Class), instead of routing
   it through classifyCGAsset()'s app-native type/cls/mfCategory dispatch above --
   the two taxonomies don't map 1:1 (the sheet's own "Foreign/Unlisted Shares" and
   "Real Estate" classes have no equivalent app `type` at all), and the sheet's own
   label is already ground truth for these rows, so re-deriving it through a
   different scheme would just risk a mismatch. classifyCGAsset() itself is
   untouched for every app-native event -- this is a parallel path, only reached
   for events carrying e.sheetClass (set only by the Capital Gains import below). */
function classifyFromSheetClass(sheetClass,cg,acqDate){
  if(sheetClass==="Listed Equity/Equity MF")return{bucket:CG_BUCKETS.EQUITY,ltMonths:cg.equityLtMonths,label:"Listed equity/equity fund"};
  if(sheetClass==="Debt MF (bought >=1Apr23)")return{bucket:CG_BUCKETS.OTHER,ltMonths:Infinity,label:"Debt/specified fund (post-1Apr23)"};
  if(sheetClass==="Debt MF (bought <1Apr23)")return{bucket:CG_BUCKETS.OTHER,ltMonths:cg.otherLtMonths,label:"Debt fund (pre-1Apr23)"};
  if(sheetClass==="Foreign/Unlisted Shares")return{bucket:CG_BUCKETS.OTHER,ltMonths:cg.otherLtMonths,label:"Foreign/unlisted shares"};
  if(sheetClass==="Gold / Gold MF / other")return{bucket:CG_BUCKETS.OTHER,ltMonths:cg.otherLtMonths,label:"Gold"};
  if(sheetClass==="SGB (secondary/premature)")return{bucket:CG_BUCKETS.OTHER,ltMonths:cg.sgbLtMonths,label:"SGB"};
  if(sheetClass==="Real Estate")return{bucket:CG_BUCKETS.OTHER,ltMonths:cg.otherLtMonths,label:"Real estate"};
  return{bucket:"unclassified-type",ltMonths:null,label:`${sheetClass} (imported, unmapped)`};
}
function monthsBetween(d1,d2){
  if(!d1||!d2)return null;
  const a=new Date(d1),b=new Date(d2);
  let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  if(b.getDate()<a.getDate())m--;
  return m;
}
/* ===== PHASE 3B: SBI TT/TTBR RATE TABLE =====
   Rule 115 of the Income-tax Rules fixes the conversion date as the last day of
   the calendar month PRECEDING the event (vesting for cost basis, sale for
   proceeds) -- not the event date itself, and specifically the SBI telegraphic-
   transfer rate, not RBI's reference rate or any generic market FX rate (both
   confirmed by real research this session, not assumed). SBI itself doesn't
   publish a historical archive, so this app doesn't try to live-fetch one from
   any third-party site either -- no such source was confirmed free, stable, and
   CORS-friendly for a static page, and Rule 115's specificity means a generic
   FX API would silently produce a technically wrong number. Instead, S.fxRates
   is a small local table the user populates themselves (one-time CSV import or
   one row at a time, Settings -> Tax Rules), the same "bring your own data, the
   app never guesses" pattern as Phase 0's historical-lots CSV import. */
function monthEndBefore(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr+"T00:00:00");
  const prevMonthEnd=new Date(d.getFullYear(),d.getMonth(),0); /* day 0 of this month = last day of the previous month */
  return localISODate(prevMonthEnd);
}
function fxRateKey(currency,monthEndDateStr){return `${(currency||"USD").toUpperCase()}_${monthEndDateStr}`;}
function getFxRate(currency,eventDateStr){
  const key=fxRateKey(currency,monthEndBefore(eventDateStr));
  const v=(S.fxRates||{})[key];
  return v!=null?v:null;
}
/* CSV import for the rate table -- mirrors importHistoricalLots()'s shape and
   tone exactly. Columns: Currency, Date (the exact month-end date the rate is
   FOR, not the event date -- see the UI note next to the import button),
   Rate. Overwrites any existing entry for the same currency+date (re-importing
   a corrected rate is meant to work, not just additive-only like lots). */
function importFxRates(text){
  const{header,rows}=parseCsvText(text);
  const find=(...names)=>{for(const n of names){const i=header.indexOf(n);if(i>=0)return i;}return -1;};
  const iCcy=find("currency","ccy"),iDate=find("date","month end","monthend"),iRate=find("rate","ttbr","tt buy");
  if(iCcy<0||iDate<0||iRate<0)return{ok:false,msg:"CSV needs Currency, Date and Rate columns."};
  let imported=0,skipped=0;
  rows.forEach(r=>{
    if(!r.some(c=>c&&c.trim()))return;
    const ccy=(r[iCcy]||"").trim().toUpperCase();
    const date=normalizeCsvDate(r[iDate]);
    const rate=+r[iRate]||0;
    if(!ccy||!date||rate<=0){skipped++;return;}
    S.fxRates=S.fxRates||{};
    S.fxRates[fxRateKey(ccy,date)]=rate;
    imported++;
  });
  persist();
  return{ok:true,imported,skipped};
}
function capGainsBreakdown(asOfDate){
  const tr=taxRules(),cg=tr.cg||TAX_RULES_DEFAULT.cg;
  /* asOfDate restricts to sales realized on/before that date -- used by
     computeAdvanceTax() to ask "how much CG tax existed as of this 234C
     checkpoint", so gains realized AFTER the checkpoint can be excused from
     that checkpoint's shortfall (Sec 234C(1)'s capital-gains proviso). The
     no-arg call (every existing caller, Steps 1-5) is unchanged -- it still
     restricts to the full FY via tr.fyEnd exactly as before. */
  const restrictTo=asOfDate||tr.fyEnd;
  /* One-time-per-load migration: events recorded before per-event ids existed
     (this session) get one assigned now, persisted immediately so it's stable
     from here on -- needed so the Capital Gains tab's inline category-setter
     (mfCategory) and any other per-event control has something durable to key
     off of, same spirit as the taxRules().cg migration guard. Only done on the
     canonical full-year call (asOfDate omitted) -- the checkpoint-restricted
     calls run mid-render and must never trigger a persist() of their own. */
  if(!asOfDate){
    let idsAssigned=false;
    (S.capGainsEvents||[]).forEach(e=>{if(!e.id){e.id=capUid();idsAssigned=true;}});
    if(idsAssigned)persist();
  }
  const fyEvents=(S.capGainsEvents||[]).filter(e=>e.saleDate>=tr.fyStart&&e.saleDate<=restrictTo);
  const buckets={slab:0,stcg111A:0,ltcg112A:0,ltcgOther:0};
  const detail=[],excluded=[];
  fyEvents.forEach(e=>{
    if(e.source==="unclassified"){excluded.push({...e,reason:"drawn from undated/uncosted units \u2014 import historical lots or correct acquisition dates (Phase 0 gap)"});return;}
    const cl=e.sheetClass?classifyFromSheetClass(e.sheetClass,cg,e.acqDate):classifyCGAsset(e.type,e.cls,cg,e.mfCategory,e.acqDate);
    if(cl.bucket==="unclassified-type"){
      const reason=cl.needsMfCategory
        ?`no fund category set for this ${e.type} \u2014 set Equity/Debt/Other on the row below, or set a default on the holding`
        :`asset type "${cl.label}" isn't mapped to a CG rule yet \u2014 confirm against the Tax Rules sheet`;
      excluded.push({...e,reason});return;
    }
    let gain;
    if(cl.needsFxResolution){
      if(e.fxCostBasis==null||e.fxProceeds==null){excluded.push({...e,reason:"no foreign-currency amount recorded for this lot/sale \u2014 re-log the Buy/Sell with the original currency amount to include it (Phase 3b)"});return;}
      const ccy=e.fxCurrency||"USD";
      const acqRate=getFxRate(ccy,e.acqDate),saleRate=getFxRate(ccy,e.saleDate);
      if(acqRate==null){excluded.push({...e,reason:`missing SBI TT/TTBR rate for ${ccy} at ${monthEndBefore(e.acqDate)} (needed for cost basis \u2014 add it in Settings \u2192 Tax Rules)`});return;}
      if(saleRate==null){excluded.push({...e,reason:`missing SBI TT/TTBR rate for ${ccy} at ${monthEndBefore(e.saleDate)} (needed for proceeds \u2014 add it in Settings \u2192 Tax Rules)`});return;}
      gain=(e.fxProceeds*saleRate)-(e.fxCostBasis*acqRate);
    }else{
      if(e.costBasis==null){excluded.push({...e,reason:"no cost basis recorded for this lot"});return;}
      gain=e.proceeds-e.costBasis;
    }
    const heldMonths=monthsBetween(e.acqDate,e.saleDate);
    const isLT=heldMonths!=null&&heldMonths>=cl.ltMonths;
    const row={...e,gain,heldMonths,isLT,bucket:cl.bucket,assetLabel:cl.label};
    detail.push(row);
    if(cl.bucket===CG_BUCKETS.EQUITY){if(isLT)buckets.ltcg112A+=gain;else buckets.stcg111A+=gain;}
    else{if(isLT)buckets.ltcgOther+=gain;else buckets.slab+=gain;}
  });
  const ltcg112ANet=Math.max(0,buckets.ltcg112A-cg.ltcgExempt);
  const tax111A=Math.max(0,buckets.stcg111A)*cg.stcgRate;
  const tax112A=ltcg112ANet*cg.ltcgRate;
  const taxOther=Math.max(0,buckets.ltcgOther)*cg.otherLtRate;
  return{buckets,ltcg112ANet,tax111A,tax112A,taxOther,totalCgTax:tax111A+tax112A+taxOther,detail,excluded,cg};
}

      ${adv.c234.map(c=>`<tr><td>${c.label} (${fmtP(c.pct)})</td><td class="n">${fmtN(c.required)}</td><td class="n">${fmtN(c.actual)}</td><td class="n">${fmtN(c.raw)}</td><td class="n">${c.excused>0?fmtN(c.excused):"&ndash;"}</td><td class="n">${fmtN(c.interest)}</td></tr>`).join("")}

    <div class="muted" style="font-size:11px;margin-top:10px">Simplification, flagged rather than hidden: relief under Sections 89/90/90A/91 (foreign tax credit, salary-arrears relief) isn't tracked by this app and is left out of assessed tax/tax due above \u2014 fine for a purely domestic-income filer with no arrears relief; otherwise these numbers will overstate any shortfall and interest.</div>

        return `<tr><td>${esc(c.label)}${c.heldNow?"":' <span class="chip">sold this CY</span>'}</td>

    </tbody></table>
    <div class="muted" style="font-size:11px;margin-top:8px">Exchange-rate convention (SBI TTBR \u2014 not computed here, enter the already-converted &#8377; amount yourself): peak value at the TTBR <i>as of the date the peak occurred</i>; closing value at the TTBR <i>as of 31 Dec ${fa.caYear}</i>.</div>

  <details class="card"><summary style="cursor:pointer;font-weight:600">Show full slab &amp; surcharge breakdown</summary>
    <div class="grid g2" style="margin-top:10px">
      <div><div class="muted" style="font-size:11.5px;margin-bottom:6px">New regime</div><table class="stmt"><thead><tr><th>#</th><th class="n">From</th><th class="n">Up to</th><th class="n">Rate</th></tr></thead><tbody>${bandRows(nw.bands)}</tbody></table></div>
      <div><div class="muted" style="font-size:11.5px;margin-bottom:6px">Old regime</div><table class="stmt"><thead><tr><th>#</th><th class="n">From</th><th class="n">Up to</th><th class="n">Rate</th></tr></thead><tbody>${bandRows(old.bands)}</tbody></table></div>
    </div>
    <div class="muted" style="font-size:11.5px;margin:10px 0 6px">Surcharge tiers (shared, both regimes)</div>
    <table class="stmt"><thead><tr><th>#</th><th class="n">From</th><th class="n">Up to</th><th class="n">Rate</th></tr></thead><tbody>${bandRows(tr.surchargeSlabs)}</tbody></table>
  </details>`;
  /* Step 6 handlers -- every one of these just mutates S and re-renders this
     whole view; the payments log and toggles are small, so a full renderTax()

  $("#tax_regime_mode").onchange=e=>{S.taxSettings.regimeMode=e.target.value;persist();renderTax();};

  if(manualSel)manualSel.onchange=e=>{S.taxSettings.regimeManual=e.target.value;persist();renderTax();};

  $("#tp_add").onclick=()=>{
    const p={id:capUid(),type:"Advance",amount:0,date:tr.fyStart,fy:tr.fy};
    S.taxPayments.push(p);
    payQueue("addPayment",{date:p.date,type:p.type,amount:p.amount,section:p.section||null});
    persist();renderTax();
  };
  $$("#v-tax [data-tp-date]").forEach(el=>el.onchange=()=>{
    const i=+el.dataset.tpDate,p=S.taxPayments[i];
    const matchKey={date:p.date,type:p.type,amount:p.amount,section:p.section||null};
    p.date=el.value;
    payQueue("editPayment",{matchKey,date:p.date,type:p.type,amount:p.amount,section:p.section||null});
    persist();renderTax();
  });
  $$("#v-tax [data-tp-type]").forEach(el=>el.onchange=()=>{
    const i=+el.dataset.tpType,p=S.taxPayments[i];
    const matchKey={date:p.date,type:p.type,amount:p.amount,section:p.section||null};
    p.type=el.value;
    payQueue("editPayment",{matchKey,date:p.date,type:p.type,amount:p.amount,section:p.section||null});
    persist();renderTax();
  });
  $$("#v-tax [data-tp-amount]").forEach(el=>el.onchange=()=>{
    const i=+el.dataset.tpAmount,p=S.taxPayments[i];
    const matchKey={date:p.date,type:p.type,amount:p.amount,section:p.section||null};
    p.amount=+el.value||0;
    payQueue("editPayment",{matchKey,date:p.date,type:p.type,amount:p.amount,section:p.section||null});

  });
  $$("#v-tax [data-tp-remove]").forEach(el=>el.onclick=()=>{

    S.taxPayments.splice(i,1);
    persist();renderTax();
  });
  /* Step 7 FA inputs: keyed dictionary, not an array index -- no re-render
     needed, nothing else on this view derives from these values. */
  $$("#v-tax [data-fa-peak]").forEach(el=>el.onchange=()=>{const k=el.dataset.faPeak;S.scheduleFA[k]=S.scheduleFA[k]||{};S.scheduleFA[k].peakValue=+el.value||0;persist();});
  $$("#v-tax [data-fa-close]").forEach(el=>el.onchange=()=>{const k=el.dataset.faClose;S.scheduleFA[k]=S.scheduleFA[k]||{};S.scheduleFA[k].closingValue=+el.value||0;persist();});
}

/* ===== CAPITAL GAINS (Phase 3, Tax group sibling of Tax Summary/Deductions) =====
   Full detail behind Tax Summary Step 4: the bucketed totals (repeated here for a
   page that stands on its own), every individually-classified sale this FY with its
   holding period and LT/ST call, and -- just as important -- every sale event that
   was deliberately excluded and why, so "some gains are missing" is never a silent
   surprise. Read-only: the numbers here are derived entirely from S.capGainsEvents
   (Phase 0) and taxRules().cg (editable in Settings -> Tax Rules), nothing is
   entered on this page itself. */
function mfCatSelectHtml(row){
  const cur=row.mfCategory||"";
  const opts=[["","\u2014"],["Equity","Equity"],["Debt","Debt"],["Other","Other"]];
  return `<select data-mfcat="${esc(row.id)}" style="font-size:11px;padding:2px 4px;margin-left:6px">
    ${opts.map(([v,l])=>`<option value="${v}" ${v===cur?"selected":""}>${l}</option>`).join("")}
  </select>`;
}
function setEventMfCategory(id,val){
  const e=(S.capGainsEvents||[]).find(x=>x.id===id);
  if(!e)return;
  e.mfCategory=val||null;
  persist();
  if(S.loaded){M=compute();renderTax();renderCapGains();}
}
function renderCapGains(){
  const tr=taxRules();
  const cg=capGainsBreakdown();
  const fmtGain=g=>`<span style="color:${g<0?"var(--neg)":"inherit"}">${fmtN(g)}</span>`;
  const detailRows=cg.detail.length?cg.detail.map(e=>`<tr>
      <td>${esc(e.holdName||"")}</td>
      <td class="muted">${esc(e.assetLabel)}${MF_TYPES.includes(e.type)?mfCatSelectHtml(e):""}</td>
      <td class="n">${e.qty}</td>
      <td class="n">${esc(e.acqDate||"")}</td>
      <td class="n">${esc(e.saleDate||"")}</td>
      <td class="n">${e.heldMonths==null?"&ndash;":e.heldMonths}</td>
      <td class="n">${e.isLT?"LT":"ST"}</td>
      <td class="n">${fmtGain(e.gain)}</td>
    </tr>`).join(""):`<tr><td colspan="8" class="muted" style="text-align:center;padding:16px">No classified sale events this FY yet.</td></tr>`;
  const excludedRows=cg.excluded.length?cg.excluded.map(e=>`<tr>
      <td>${esc(e.holdName||"")}</td>
      <td class="n">${esc(e.saleDate||"")}</td>
      <td class="n">${e.qty}</td>
      <td class="muted">${esc(e.reason)}${MF_TYPES.includes(e.type)?mfCatSelectHtml(e):""}</td>
    </tr>`).join(""):`<tr><td colspan="4" class="muted" style="text-align:center;padding:16px">Nothing excluded \u2014 every sale event this FY was classified and taxed above.</td></tr>`;
  $("#v-capgains").innerHTML=`
  <div class="card" style="margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <div><span class="muted" style="font-size:12px">Financial Year</span> <b>${esc(tr.fy)}</b> <span class="muted">(${esc(tr.ay)})</span></div>
      <div class="muted" style="font-size:11.5px">Matrix editable in Settings &rarr; Tax Rules</div>
    </div>
  </div>
  <div class="grid g4" style="margin-bottom:14px">
    ${kpi("Total capital gains tax",fmtN(cg.totalCgTax),"Step 4, not eligible for 87A rebate")}
    ${kpi("STCG \u2014 111A (equity)",fmtN(cg.buckets.stcg111A),fmtP(cg.cg.stcgRate)+" flat")}
    ${kpi("LTCG \u2014 112A (equity)",fmtN(cg.ltcg112ANet),`net of ${fmtN(cg.cg.ltcgExempt)}, ${fmtP(cg.cg.ltcgRate)} flat`)}
    ${kpi("LTCG \u2014 other assets",fmtN(cg.buckets.ltcgOther),fmtP(cg.cg.otherLtRate)+" flat, no exemption")}
  </div>
  <div class="card" style="margin-bottom:14px"><h3>Bucket totals</h3><table class="stmt"><thead><tr><th></th><th class="n">Net gain</th><th class="n">Tax</th></tr></thead><tbody>
    <tr><td>@ slab (folds into Step 1 income)</td><td class="n">${fmtGain(cg.buckets.slab)}</td><td class="n muted">taxed at slab, in Step 3</td></tr>
    <tr><td>STCG 111A \u2014 listed equity</td><td class="n">${fmtGain(cg.buckets.stcg111A)}</td><td class="n">${fmtN(cg.tax111A)}</td></tr>
    <tr><td>LTCG 112A \u2014 listed equity (net of exemption)</td><td class="n">${fmtGain(cg.ltcg112ANet)}</td><td class="n">${fmtN(cg.tax112A)}</td></tr>
    <tr><td>LTCG \u2014 other assets</td><td class="n">${fmtGain(cg.buckets.ltcgOther)}</td><td class="n">${fmtN(cg.taxOther)}</td></tr>
    <tr class="tot-row"><td>Total (111A + 112A + other)</td><td class="n"></td><td class="n">${fmtN(cg.totalCgTax)}</td></tr>
  </tbody></table>
    <div class="muted" style="font-size:11.5px;margin-top:8px">A net loss within a bucket is shown as negative but doesn't reduce tax elsewhere or carry forward to next year (matching the workbook \u2014 multi-year loss carry-forward isn't modeled).</div>
  </div>
  <div class="card" style="margin-bottom:14px"><h3>Classified sale events \u2014 ${esc(tr.fy)}</h3>
    <div class="muted" style="font-size:11px;margin-bottom:8px">Mutual Fund/Index Fund/ELSS rows carry an Equity/Debt/Other selector \u2014 it edits THIS specific sale's category directly (snapshot-only: doesn't touch the holding's own default, and the holding's default doesn't retroactively touch past sales either).</div>
    <div style="overflow-x:auto"><table class="stmt"><thead><tr><th>Holding</th><th>Asset</th><th class="n">Qty</th><th class="n">Acquired</th><th class="n">Sold</th><th class="n">Held (mo)</th><th class="n">LT/ST</th><th class="n">Gain</th></tr></thead><tbody>${detailRows}</tbody></table></div>
  </div>
  <div class="card"><h3>Excluded from the totals above</h3>
    <div class="muted" style="font-size:11.5px;margin-bottom:10px">Never guessed into a bucket \u2014 each of these needs either more data (import historical lots, fix an acquisition date, set a fund category below) or a feature that isn't built yet (Phase 3b's RSU/ESPP &#8377; conversion; a confirmed CG rule for the asset type).</div>
    <div style="overflow-x:auto"><table class="stmt"><thead><tr><th>Holding</th><th class="n">Sold</th><th class="n">Qty</th><th>Why it's excluded</th></tr></thead><tbody>${excludedRows}</tbody></table></div>
  </div>`;
  $$("#v-capgains [data-mfcat]").forEach(sel=>sel.onchange=()=>setEventMfCategory(sel.dataset.mfcat,sel.value));
}

/* ===== DEDUCTIONS VIEW (Tax group, Phase 2) =====
   Direct-write-on-change, not a working-copy+Save pattern like Tax Rules --
   this is data entry (what was actually claimed this year), not a rarely-
   touched rate master, so edits should feel live: change a field, it's
   saved immediately and Tax Summary's downstream totals update on the next
   render(). Section rows support add/remove for the "law adds a new
   section" case, same reasoning as the slab-band editor, but simpler --
   sections are a flat list, no chaining between rows needed. */
function refreshDeductionsSummary(){
  const d=S.deductions;
  const oldTot=deductionsBreakdown("old"),newTot=deductionsBreakdown("new");
  d.entries.forEach((e,i)=>{const cell=$("#ded_allowed_"+i);if(cell)cell.textContent=fmtNP(Math.min(+e.claimed||0,+e.limit||0));});
  const hraEl=$("#ded_hra_exempt");if(hraEl)hraEl.textContent=fmtNP(computeHraExemption(d.hra));
  const oldKpi=$("#ded_kpi_old");if(oldKpi)oldKpi.textContent=fmtNP(oldTot.total);
  const newKpi=$("#ded_kpi_new");if(newKpi)newKpi.textContent=fmtNP(newTot.total);
  if(S.loaded){M=compute();renderTax();} /* keep Tax Summary live without touching this view's own inputs */
}
let dedEditRows=new Set();
function renderDeductions(){
  if(!S.deductions)S.deductions=JSON.parse(JSON.stringify(DEDUCTIONS_DEFAULT));
  const d=S.deductions;
  const oldTot=deductionsBreakdown("old"),newTot=deductionsBreakdown("new");
  const rows=d.entries.map((e,i)=>{
    const allowed=Math.min(+e.claimed||0,+e.limit||0);
    const editing=dedEditRows.has(i);
    /* Section/Description/Regime are treated as near-permanent identity, not
       something to nudge while entering a claim -- read-only text by default,
       editable only while this row's edit toggle is on. A newly added row
       starts in edit mode (see #ded_add below) since it has nothing to
       protect yet. Limit/Claimed stay always-editable regardless -- that
       distinction was the point of the earlier "editable limits" decision,
       separate from this one. */
    const codeCell=editing?`<input style="width:90px" data-ded-code="${i}" value="${esc(e.code)}">`:`<span>${esc(e.code)}</span>`;
    const descCell=editing?`<input style="width:100%;min-width:150px" data-ded-desc="${i}" value="${esc(e.desc)}">`:`<span class="muted">${esc(e.desc)}</span>`;
    const regimeCell=editing?`<select data-ded-regime="${i}"><option value="Old" ${e.regime==="Old"?"selected":""}>Old</option><option value="Both" ${e.regime==="Both"?"selected":""}>Both</option></select>`:`<span class="chip">${esc(e.regime)}</span>`;
    return `<tr>
      <td>${codeCell}</td>
      <td>${descCell}</td>
      <td>${regimeCell}</td>
      <td><input class="mono n" style="width:78px" data-ded-limit="${i}" type="number" value="${e.limit>=999999999?'':e.limit}" placeholder="${e.limit>=999999999?'no cap':''}"></td>
      <td><input class="mono n" style="width:78px" data-ded-claimed="${i}" type="number" value="${e.claimed||0}"></td>
      <td class="n mono" id="ded_allowed_${i}">${fmtNP(allowed)}</td>
      <td style="white-space:nowrap">
        <span class="act" data-ded-edit="${i}" title="${editing?'Done':'Edit section/description/regime'}">${editing?'&#10003;':'&#9998;'}</span>
        <span class="act del" data-ded-remove="${i}" title="Remove section">&#10005;</span>
      </td>
    </tr>`;
  }).join("");
  $("#v-deductions").innerHTML=`
  <div class="card" style="margin-bottom:14px">
    <h3>Chapter VI-A sections</h3>
    <div class="muted" style="font-size:11.5px;margin:-4px 0 10px">Section, description and regime are locked by default (they're effectively permanent) &mdash; tap &#9998; to edit one. Limit and Claimed are always editable; "Allowed" is capped at the limit automatically.</div>

  </div>`;
  /* Field edits (claimed/limit/regime/HRA numbers) patch derived text in place via

  $$("#v-deductions [data-ded-limit]").forEach(el=>el.onchange=()=>{const i=+el.dataset.dedLimit;d.entries[i].limit=el.value===""?999999999:(+el.value||0);dedQueue("editEntry",{matchCode:d.entries[i].code,limit:d.entries[i].limit});patch();});

    dedEditRows=shifted;

/* ===== TAX RULES (Settings destination) =====
   Editable rate/threshold master, mirroring the workbook's own Tax Rules
   sheet -- one active FY block, edited in place to roll forward, no
   per-year history kept (matches the workbook exactly, per the call not to
   version this). Local-only setting: never queued into any merge/sync path,
   same category as the app's theme choice, not workbook data.

   Slab bands support add/remove, not just editing existing values -- if a
   future budget changes the new regime from 7 bands to 5 or 8, this handles
   it. Bands are edited via a working copy (trWorking) rather than reading
   fixed DOM positions on Save, since the row count itself can change mid-
   edit. Only each band's "to" and "rate" are ever independently stored;
   "from" is always derived (rechainBands: from[i] = to[i-1], from[0] = 0)
   so removing or inserting a band can never leave a gap or overlap. The
   last band's "to" is always forced to the open-ended sentinel (1e12) and
   isn't shown as an editable field -- only earlier bands have a real upper
   boundary to set. */
let trWorking=null;
function rechainBands(bands){
  bands[0][0]=0;
  for(let i=1;i<bands.length;i++)bands[i][0]=bands[i-1][1];
  bands[bands.length-1][1]=1e12;
}
function bandsHtml(prefix){
  const bands=trWorking[prefix+"Slabs"];
  rechainBands(bands);
  return bands.map((b,i)=>{
    const isLast=i===bands.length-1;
    return `<div style="display:flex;gap:6px;align-items:center;margin-bottom:5px">
      <span class="mono muted" style="width:88px;text-align:right">${fmtN(b[0])}</span>
      <span class="muted">&ndash;</span>
      ${isLast?`<span class="muted" style="width:100px">and above</span>`
        :`<input class="mono" style="width:100px" data-band="${prefix}:${i}:to" type="number" value="${b[1]}">`}
      <span class="muted">&#64;</span>
      <input class="mono" style="width:70px" data-band="${prefix}:${i}:rate" type="number" step="0.01" value="${b[2]}">
      <span class="act del" data-band-remove="${prefix}:${i}" title="Remove band" style="${bands.length<=1?'visibility:hidden':''}">&#10005;</span>
    </div>`;
  }).join("")+`<button class="btn" data-band-add="${prefix}" style="width:100%;margin-top:4px">+ Add band</button>`;
}
function redrawBands(prefix){$(`#${prefix}BandsBox`).innerHTML=bandsHtml(prefix);wireBands(prefix);}
function wireBands(prefix){
  $$(`[data-band^="${prefix}:"]`).forEach(el=>{
    el.onchange=()=>{
      const[,i,field]=el.dataset.band.split(":");
      trWorking[prefix+"Slabs"][+i][field==="to"?1:2]=+el.value||0;
      if(field==="to")redrawBands(prefix); /* next band's "from" depends on this */
    };
  });
  $$(`[data-band-remove^="${prefix}:"]`).forEach(el=>{
    el.onclick=()=>{
      const i=+el.dataset.bandRemove.split(":")[1];
      const bands=trWorking[prefix+"Slabs"];
      if(bands.length<=1)return;
      bands.splice(i,1);
      redrawBands(prefix);
    };
  });
  const addBtn=$(`[data-band-add="${prefix}"]`);
  if(addBtn)addBtn.onclick=()=>{
    const bands=trWorking[prefix+"Slabs"];
    const last=bands[bands.length-1];
    const prevFrom=bands.length>1?bands[bands.length-2][0]:0;
    const step=Math.max(last[0]-prevFrom,100000)||400000;
    bands[bands.length-1]=[last[0],last[0]+step,last[2]]; /* the old last band becomes finite */
    bands.push([last[0]+step,1e12,last[2]]);              /* a new open-ended band takes its place */
    redrawBands(prefix);
  };
}
/* Small read-model for the Phase 3b rate-table card -- sorted newest first so
   recently-added/imported rates are visible without scrolling. */
function fxRateTableHtml(){

  }).join("");
  return `<div class="tablewrap"><table><thead><tr><th>Currency</th><th class="n">Month-end date</th><th class="n">Rate</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ===== ALLOCATION VIEW (target mix + path to target) ===== */
function driftChip(d){if(d==null)return `<span class="muted">&ndash;</span>`;
  const tol=(S.plan&&S.plan.tol)||2,on=Math.abs(d)<=tol;
  const col=on?"var(--pos)":(Math.abs(d)>2*tol?"var(--neg)":"var(--warn)");
  const arrow=Math.abs(d)<0.05?"":(d>0?"\u25B2":"\u25BC");
  const txt=on?"on target":(Math.abs(d).toFixed(1)+"pp "+(d>0?"over":"under"));
  return `<span style="color:${col};font-weight:600">${arrow} ${txt}</span>`;}
function okbox(h){return `<div style="padding:11px 13px;border:1px solid color-mix(in srgb,var(--pos) 45%,transparent);background:color-mix(in srgb,var(--pos) 10%,transparent);border-radius:10px;font-size:13px;line-height:1.45">${h}</div>`;}
function warnbox(h){return `<div style="padding:11px 13px;border:1px solid color-mix(in srgb,var(--warn) 48%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:10px;font-size:13px;line-height:1.45">${h}</div>`;}
function renderAlloc(){
  const wrap=$("#allocWrap");if(!wrap)return;
  if(!S.targetMix)S.targetMix=defaultTargets();
  if(!S.plan)S.plan=defaultPlan();
  if(!S.plan.contrib)S.plan.contrib={};if(!S.plan.growth)S.plan.growth={};
  CLS_ORDER.forEach(c=>{if(S.targetMix[c]==null)S.targetMix[c]=0;if(S.plan.contrib[c]==null)S.plan.contrib[c]=0;if(S.plan.growth[c]==null)S.plan.growth[c]=0;});
  if(S.plan.months==null)S.plan.months=36;if(S.plan.tol==null)S.plan.tol=2;
  if(S.plan._v!==2){S.plan.tol=2;S.plan._v=2;}                 // one-time: adopt the 2pp default
  S.plan.contrib.Cash=cashAuto().cash;                          // Cash always = salary - what you invest elsewhere
  const cur=curMixVals(),cp=pctOf(cur),tgt=S.targetMix;
  const tSum=CLS_ORDER.reduce((s,c)=>s+(+tgt[c]||0),0);
  // ---- LEFT: target mix & drift ----
  const tRows=CLS_ORDER.map(c=>{const drift=cp._tot?cp[c]-(+tgt[c]||0):null;
    return `<tr><td><span class="chip ${chipCls(c)}">${c}</span></td>
      <td class="n"><input class="mono tgtIn" data-c="${c}" type="number" min="0" max="100" step="1" value="${+tgt[c]||0}" style="width:72px;text-align:right"></td>
      <td class="n" id="cur-${c}">${cp._tot?cp[c].toFixed(1)+"%":"&ndash;"}</td>
      <td class="n" id="drift-${c}">${driftChip(drift)}</td></tr>`;}).join("");
  const sumNote=tSum===100?`<span class="muted">Targets sum to 100%.</span>`:`<span style="color:var(--warn);font-weight:600">Targets sum to ${tSum}%</span> <span class="muted">&mdash; set them to 100% for a clean read.</span>`;
  const targetCard=`<div class="card">
    <h3>Target mix &amp; drift</h3>
    <div class="muted" style="font-size:12.5px;margin-bottom:12px">Set the share you want in each class. Drift compares your live market-value mix to target; past &plusmn;${S.plan.tol}pp is flagged.</div>
    <table><thead><tr><th>Class</th><th class="n">Target</th><th class="n">Current</th><th class="n">Drift</th></tr></thead><tbody>${tRows}</tbody></table>

    <div class="note" style="margin-top:10px"><span class="muted">Cash auto = take-home ${salTxt} (salary + bonus, not RSU) &minus; monthly spend ${expTxt} &minus; what you invest above. Negative = drawing down reserves.</span></div></div>`;
  // ---- BOTTOM: chart (with the horizon/tolerance controls that drive it), then the now/projected/target bars ----
  const controls=`<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end">
      <label style="text-transform:none;font-size:12px;display:flex;flex-direction:column;gap:7px;color:var(--ink2)">Horizon &middot; <b id="planMonthsLbl" style="color:var(--ink)">${S.plan.months} month${S.plan.months>1?"s":""}</b>
        <input type="range" id="planMonths" min="1" max="120" step="1" value="${S.plan.months}"></label>
      <label style="text-transform:none;font-size:12px;display:flex;flex-direction:column;gap:7px;color:var(--ink2)">Tolerance &plusmn;pp
        <input class="mono" id="planTol" type="number" min="1" max="25" step="1" value="${S.plan.tol}" style="width:70px"></label>
    </div>`;
  wrap.innerHTML=`<div class="grid g2" style="gap:15px;align-items:start">${targetCard}${planCard}</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:14px">
        <h3 style="margin:0">Projected share of each class</h3>${controls}</div>
      <div id="planVerdict" style="margin-bottom:12px"></div><div class="cx" id="planChart"></div></div>
    <div class="card"><h3>Now vs projected vs target</h3><div id="planBars"></div></div>`;
  $$(".tgtIn").forEach(inp=>inp.onchange=()=>{const v=Math.max(0,Math.min(100,Math.round(+inp.value||0)));inp.value=v;S.targetMix[inp.dataset.c]=v;persist();renderAlloc();});
  $$(".plc").forEach(inp=>inp.onchange=()=>{S.plan.contrib[inp.dataset.c]=Math.round(+inp.value||0);inp.value=S.plan.contrib[inp.dataset.c];
    S.plan.contrib.Cash=cashAuto().cash;const cc=$("#cashAutoCell");if(cc)cc.value=Math.round(S.plan.contrib.Cash||0);persist();refreshViz();});
  $$(".plg").forEach(inp=>inp.onchange=()=>{S.plan.growth[inp.dataset.c]=+inp.value||0;persist();refreshViz();});
  $("#planMonths").oninput=e=>{S.plan.months=+e.target.value;$("#planMonthsLbl").innerHTML=S.plan.months+" month"+(S.plan.months>1?"s":"");refreshViz();};
  $("#planMonths").onchange=()=>persist();
  $("#planTol").onchange=e=>{S.plan.tol=Math.max(1,Math.min(25,Math.round(+e.target.value||2)));e.target.value=S.plan.tol;persist();renderAlloc();};
  refreshViz();
}
function refreshViz(){
  if(!$("#planChart"))return;
  S.plan.contrib.Cash=cashAuto().cash;
  const cur=curMixVals(),tgt=S.targetMix||defaultTargets(),tol=(S.plan&&S.plan.tol)||2,months=(S.plan&&S.plan.months)||36;
  const rows=projectMix(cur,S.plan.contrib,S.plan.growth,months),hit=firstConverge(rows,tgt,tol);
  const series=CLS_ORDER.filter(c=>rows.some(r=>r.vals[c]>0)||(tgt[c]||0)>0||(S.plan.contrib[c]||0)!==0).map(c=>({cls:c,color:clsColor(c),data:rows.map(r=>r.pct[c])}));
  drawCx("planChart",w=>projChart(w,months,series,tgt,tol,hit));
  const endRow=rows[rows.length-1],endVals=endRow.vals,tgtVals={};CLS_ORDER.forEach(c=>tgtVals[c]=tgt[c]||0);
  const bars=$("#planBars");if(bars)bars.innerHTML=`<div class="grid g2" style="gap:14px 22px">
     <div><div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px">Now</div>${miniStack(cur)}</div>
     <div><div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px">Projected &middot; +${months}mo</div>${miniStack(endVals)}</div>
     <div><div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px">Target</div>${miniStack(tgtVals)}</div>
     <div class="legend" style="align-items:center">${CLS_ORDER.map(c=>`<span><b style="background:${clsColor(c)}"></b>${c}</span>`).join("")}</div></div>`;
  const tot0=CLS_ORDER.reduce((s,c)=>s+(cur[c]||0),0),anyContrib=CLS_ORDER.some(c=>(S.plan.contrib[c]||0)!==0);
  let vhtml;
  if(tot0<1&&!anyContrib)vhtml=warnbox("Add a holding or a monthly contribution to project a path.");
  else if(hit===0)vhtml=okbox(`You're already within &plusmn;${tol}pp of your target mix.`);
  else if(hit>0)vhtml=okbox(`At this plan, your mix reaches within &plusmn;${tol}pp of target in about <b>${hit} month${hit>1?"s":""}</b> &mdash; around <b>${addMonths(hit)}</b>.`);
  else{const wg=worstGap(endRow,tgt);vhtml=warnbox(`This plan doesn't reach &plusmn;${tol}pp of target within ${months} month${months>1?"s":""}. Largest remaining gap: <b>${wg.cls}</b> ${Math.abs(wg.gap).toFixed(1)}pp ${wg.gap>0?"over":"under"}. Add more to the lagging classes, sell down the over-weight ones, or lengthen the horizon.`);}
  const v=$("#planVerdict");if(v)v.innerHTML=vhtml;
}

function renderTrends(){
  const{IS}=M,m=IS.months;
  const curM=ym(new Date());
  const cm=m.filter(x=>x!==curM);            // complete months (drop ongoing current month)
  const sm=cm.length?cm:m;                   // months to chart
  const excluded=m.length!==sm.length;
  const core=sm.map(x=>IS.rec[x]?((IS.rec[x]-IS.exp[x])/IS.rec[x]*100):null);
  const all=sm.map(x=>IS.rev[x]?(IS.net[x]/IS.rev[x]*100):null);
  const avgCore=mean(core.filter(v=>v!=null)),avgAll=mean(all.filter(v=>v!=null));
  const avgSpend=mean(sm.map(x=>IS.exp[x]||0));
  const avgOf=obj=>mean(sm.map(x=>obj[x]||0));

    <div class="legend"><span><b style="background:var(--accent)"></b>Core &middot; avg ${avgCore.toFixed(1)}%</span><span><b style="background:var(--blue)"></b>Incl. windfall &middot; avg ${avgAll.toFixed(1)}%</span><span class="muted">dashed = average</span></div></div>
    <div class="card"><h3>Monthly spend${note}</h3><div class="cx" id="tSpend"></div>
    <div class="legend"><span><b style="background:var(--neg)"></b>Total expenses</span><span><b style="background:var(--rule)"></b>Average ${fmtNP(avgSpend)}/mo</span></div></div>
    </div>
    <div class="card"><h3>Category spend over time <span class="muted" style="font-size:11px">&middot; click a category to expand sub-categories</span></h3><div class="tablewrap"><table class="stmt">
    <thead><tr><th class="srt" data-cs="cat">Category</th>${m.map(x=>`<th class="srt n" data-cs="${x}">${x.slice(2)}</th>`).join("")}<th class="srt n" data-cs="avg">Avg/mo</th><th class="srt n" data-cs="total">Total</th></tr></thead>
    <tbody id="spendBody"></tbody>
    <tfoot><tr class="tot-row"><td>Total expenses</td>${m.map(x=>`<td class="n">${fmtN(IS.exp[x])}</td>`).join("")}<td class="n">${fmtN(avgSpend)}</td><td class="n">${fmtN(IS.exp._t)}</td></tr></tfoot></table></div>
    <div class="legend">Avg/mo excludes the in-progress current month.</div></div>`;
  // subcategory breakdown per expense category
  const subBreak={};
  IS.expRows.forEach(r=>{const subs={};S.txns.forEach(x=>{if(x.cat===r.cat&&txnType(x)==="Expense"){const s=x.sub||"(no sub-category)",mn=ym(x.date);subs[s]=subs[s]||{_t:0};subs[s][mn]=(subs[s][mn]||0)+x.amt;subs[s]._t+=x.amt;}});
    subBreak[r.cat]=Object.entries(subs).map(([sub,mm])=>({sub,mm})).sort((a,b)=>b.mm._t-a.mm._t);});
  const skey=(r)=>sortCat.col==="cat"?r.cat.toLowerCase():sortCat.col==="avg"?avgOf(r.m):sortCat.col==="total"?r.m._t:(r.m[sortCat.col]||0);
  const drawSpend=()=>{const rowsD=IS.expRows.filter(r=>r.m._t>0);
    const sorted=[...rowsD].sort((a,b)=>{const va=skey(a),vb=skey(b);return (typeof va==="string"?va.localeCompare(vb):va-vb)*sortCat.dir;});
    let html="";sorted.forEach(r=>{const subs=subBreak[r.cat]||[],open=expandedCats.has(r.cat),canExp=subs.length>0;
      const caret=canExp?`<span class="exp-toggle" data-cat="${r.cat}">${open?"\u25be":"\u25b8"}</span>`:`<span class="exp-toggle" style="opacity:.25">\u25b8</span>`;
      html+=`<tr><td>${caret}${r.cat}</td>${m.map(x=>`<td class="n">${r.m[x]?fmtN(r.m[x]):'<span class=muted>&middot;</span>'}</td>`).join("")}<td class="n">${fmtN(avgOf(r.m))}</td><td class="n">${fmtN(r.m._t)}</td></tr>`;
      if(open)subs.forEach(s=>{html+=`<tr class="sub-detail"><td>${s.sub}</td>${m.map(x=>`<td class="n">${s.mm[x]?fmtN(s.mm[x]):'<span class=muted>&middot;</span>'}</td>`).join("")}<td class="n">${fmtN(avgOf(s.mm))}</td><td class="n">${fmtN(s.mm._t)}</td></tr>`;});});
    $("#spendBody").innerHTML=html;
    $$("#spendBody .exp-toggle[data-cat]").forEach(t=>t.onclick=()=>{const c=t.dataset.cat;expandedCats.has(c)?expandedCats.delete(c):expandedCats.add(c);drawSpend();});};
  $$('#v-trends th[data-cs]').forEach(th=>th.onclick=()=>{const c=th.dataset.cs;sortCat.dir=(sortCat.col===c)?-sortCat.dir:1;sortCat.col=c;

  drawSpend();
  drawCx("tSave",w=>multiLine(w,sm,[{name:"Core",data:core,color:"var(--accent)"},{name:"Incl.",data:all,color:"var(--blue)"}],{pct:true,h:196,smooth:true,avg:[{v:avgCore,color:"var(--accent)"},{v:avgAll,color:"var(--blue)"}]}));
  drawCx("tSpend",w=>columnAvg(w,sm,sm.map(x=>IS.exp[x]),avgSpend,"var(--neg)",196));

function renderBudget(){

  const totB=rows.reduce((s,r)=>s+r.monthly,0),totA=rows.reduce((s,r)=>s+r.actual,0),totV=totA-totB;

    <div class="grid g3" style="margin-bottom:14px">
      ${kpi("Budget",fmtN(totB),"per month")}
      ${kpi("Actual",fmtN(totA),budgetSel==="avg"?"avg / month":budgetSel)}
      ${kpi(totV>0?"Over budget":"Under budget",fmtN(Math.abs(totV)),totV>0?"spending above plan":"headroom left",totV>0?"neg":"pos", "budgetVariance")}</div>
    <div class="card"><div class="tablewrap"><table class="stmt">
      <thead><tr><th>Category</th><th class="n">Budget</th><th class="n">Actual</th><th class="n">Variance</th><th style="width:22%">Used</th><th class="n">% of budget</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${r.cat}${r.essdisc?` <span class="chip ${chipCls(r.essdisc)}">${r.essdisc}</span>`:""}</td>
        <td class="n">${fmtN(r.monthly)}</td><td class="n">${fmtN(r.actual)}</td>
        <td class="n ${r.varr>0?'neg':'pos'}">${r.varr>0?'+':''}${fmtN(r.varr)}</td>
        <td>${bar(r)}</td><td class="n ${r.actual>r.monthly?'neg':''}">${r.monthly?Math.round(r.pct*100)+'%':'&ndash;'}</td></tr>`).join("")}
        <tr class="tot-row"><td>Total</td><td class="n">${fmtN(totB)}</td><td class="n">${fmtN(totA)}</td><td class="n ${totV>0?'neg':'pos'}">${totV>0?'+':''}${fmtN(totV)}</td><td></td><td class="n">${totB?Math.round(totA/totB*100)+'%':'&ndash;'}</td></tr>

   ${grp("Liquidity",[["Liquid assets",fmtN(R.liquid),"","Bank + cash available now"],["Avg monthly expense",fmtN(R.avgMo),"","Total expenses \u00f7 months of data"],["Runway",R.runway?R.runway.toFixed(1)+" mo":"&ndash;",R.runway>=6?"pos":"warn","Months covered with no income"],["Current ratio",R.curRatio!=null?R.curRatio.toFixed(2)+"&times;":"&ndash;","","Current assets \u00f7 current liabilities"]])}
