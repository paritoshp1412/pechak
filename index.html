   ${grp("Profitability",[["Net saved (annual)",fmtN(M.IS.net._t),cls(M.IS.net._t),"Revenue \u2212 expenses"],["Savings rate \u2014 core",fmtP(R.saveCore),"","Excl. windfalls \u2014 your true habit"],["Savings rate \u2014 incl. windfall",fmtP(R.saveAll),"","Flattered by bonuses & RSUs"]])}
   ${grp("Returns & efficiency",[["Portfolio return",fmtP(R.ret),cls(R.ret),"Gain \u00f7 cost (not time-weighted)"],["Unrealised gain",fmtN(M.portCur-M.portInv),cls(M.portCur-M.portInv),"Current value \u2212 cost"],["Unclaimed reimbursements",fmtN(R.empRecv),R.empRecv>0?"warn":"","Cash sitting with employer"],["Reimbursement DSO",R.dso!=null?Math.round(R.dso)+" days":"&ndash;","","Days your cash sits unclaimed"]])}
  </div>`;
}

/* ===== CHARTS ===== */
function fmtC(x){if(x==null||isNaN(x))return"";const n=Math.abs(x);let s;
  if(n>=1e7)s=(x/1e7).toFixed(n>=1e8?0:1)+"Cr";else if(n>=1e5)s=(x/1e5).toFixed(n>=1e6?0:1)+"L";
  else if(n>=1e3)s=(x/1e3).toFixed(0)+"k";else s=String(Math.round(x));return s;}
const _MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function moLbl(y){const p=String(y).split("-");return _MON[(+p[1]||1)-1]||y;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function localISODate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function _rgb(c){try{const el=document.createElement("span");el.style.color=c;el.style.display="none";document.body.appendChild(el);const mm=getComputedStyle(el).color.match(/\d+/g);el.remove();return mm?mm.map(Number):[128,128,128];}catch(e){return[128,128,128];}}
function idealText(c){const a=_rgb(c);return (0.299*a[0]+0.587*a[1]+0.114*a[2])>150?"#0b0d12":"#ffffff";}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return m*p;}
function chipCls(n){return ({Equity:"t-eq",Debt:"t-debt",Gold:"t-gold",Cash:"t-cash",Other:"t-other",Essential:"t-ess",Discretionary:"t-disc"})[n]||"";}
function clsColor(c){return ({Equity:"var(--t-eq)",Debt:"var(--t-debt)",Gold:"var(--t-gold)",Cash:"var(--t-cash)",Other:"var(--t-other)"})[c]||"var(--t-other)";}
function drawCx(id,fn){const el=$("#"+id);if(!el)return;const w=Math.max(280,Math.round(el.clientWidth||(el.parentNode&&el.parentNode.clientWidth)||520));el.innerHTML=fn(w);}

/* grouped columns, direct value labels */
function groupedBars(w,months,series){
  const h=250,m={t:26,r:14,b:26,l:12},pw=w-m.l-m.r,ph=h-m.t-m.b;
  const all=[];series.forEach(s=>s.data.forEach(v=>{if(v!=null)all.push(v);}));
  const max=niceMax(Math.max(1,...all)),y0=m.t+ph,n=months.length||1,gw=pw/n;
  const bw=Math.min(24,gw/(series.length+.7)),gap=Math.min(5,bw*.2),tw=series.length*bw+(series.length-1)*gap;
  let s=`<line x1="${m.l}" y1="${y0}" x2="${(m.l+pw).toFixed(1)}" y2="${y0}" style="stroke:var(--line2)" stroke-width="1"/>`;
  months.forEach((mm,g)=>{const cx=m.l+gw*(g+.5);
    series.forEach((se,i)=>{const v=se.data[g]||0,bh=Math.max(0,v/max*ph),x=cx-tw/2+i*(bw+gap),y=y0-bh;
      s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" style="fill:${se.color}"/>`;
      if(v>0&&bw>=11)s+=`<text class="cx-v" x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" style="fill:${se.color}">${fmtC(v)}</text>`;});
    s+=`<text class="cx-x" x="${cx.toFixed(1)}" y="${(y0+15).toFixed(1)}">${moLbl(mm)}</text>`;});
  let lx=m.l;let leg='';series.forEach(se=>{leg+=`<rect x="${lx.toFixed(1)}" y="5" width="9" height="9" rx="2" style="fill:${se.color}"/><text class="cx-lg" x="${(lx+13).toFixed(1)}" y="13">${esc(se.name)}</text>`;lx+=13+se.name.length*6.6+18;});
  return `<svg class="cx-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">${leg}${s}</svg>`;}

/* single column series + average rule */
function columnAvg(w,months,data,avg,color,h){
  h=h||250;const m={t:24,r:54,b:26,l:12},pw=w-m.l-m.r,ph=h-m.t-m.b;
  const max=niceMax(Math.max(1,...data.filter(v=>v!=null),avg||0)),y0=m.t+ph,n=months.length||1,gw=pw/n,bw=Math.min(30,gw*.56);
  let s=`<line x1="${m.l}" y1="${y0}" x2="${(m.l+pw).toFixed(1)}" y2="${y0}" style="stroke:var(--line2)" stroke-width="1"/>`;
  months.forEach((mm,g)=>{const v=data[g]||0,cx=m.l+gw*(g+.5),bh=Math.max(0,v/max*ph),x=cx-bw/2,y=y0-bh;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" style="fill:${color}"/>`;
    if(v>0)s+=`<text class="cx-v" x="${cx.toFixed(1)}" y="${(y-5).toFixed(1)}" style="fill:var(--ink2)">${fmtC(v)}</text>`;
    s+=`<text class="cx-x" x="${cx.toFixed(1)}" y="${(y0+15).toFixed(1)}">${moLbl(mm)}</text>`;});
  if(avg!=null&&avg>0){const ay=y0-avg/max*ph;
    s+=`<line x1="${m.l}" y1="${ay.toFixed(1)}" x2="${(m.l+pw).toFixed(1)}" y2="${ay.toFixed(1)}" style="stroke:var(--rule)" stroke-width="1.4" stroke-dasharray="6 4"/>`;
    s+=`<text class="cx-end" x="${(m.l+pw+6).toFixed(1)}" y="${(ay+3.5).toFixed(1)}" style="fill:var(--rule)">avg ${fmtC(avg)}</text>`;}
  return `<svg class="cx-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">${s}</svg>`;}

/* smooth Catmull-Rom spline through points -> cubic bezier path */
function spline(pts){if(!pts.length)return"";if(pts.length<3)return"M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L");
  let d="M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;}
  return d;}
/* multi-line, smooth, end labels + average rules */
function multiLine(w,xs,series,opt){opt=opt||{};const h=opt.h||250,m={t:22,r:70,b:26,l:14},pw=w-m.l-m.r,ph=h-m.t-m.b;
  const vals=[];series.forEach(s=>s.data.forEach(v=>{if(v!=null)vals.push(v);}));(opt.avg||[]).forEach(a=>{if(a.v!=null)vals.push(a.v);});
  let lo=Math.min(...vals,0),hi=Math.max(...vals,1);if(lo===hi)hi=lo+1;const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const X=i=>m.l+(xs.length<=1?pw/2:pw*i/(xs.length-1)),Y=v=>m.t+ph-(v-lo)/(hi-lo)*ph;
  let s=`<line x1="${m.l}" y1="${(m.t+ph).toFixed(1)}" x2="${(m.l+pw).toFixed(1)}" y2="${(m.t+ph).toFixed(1)}" style="stroke:var(--line2)" stroke-width="1"/>`;
  (opt.avg||[]).forEach(a=>{if(a.v==null)return;const y=Y(a.v);
    s+=`<line x1="${m.l}" y1="${y.toFixed(1)}" x2="${(m.l+pw).toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:${a.color}" stroke-width="1.1" stroke-dasharray="5 4" opacity=".5"/>`;});
  xs.forEach((xx,i)=>{s+=`<text class="cx-x" x="${X(i).toFixed(1)}" y="${(m.t+ph+15).toFixed(1)}">${moLbl(xx)}</text>`;});
  const ends=[];
  series.forEach(se=>{const runs=[];let cur=[];
    se.data.forEach((v,i)=>{if(v==null){if(cur.length){runs.push(cur);cur=[];}return;}cur.push([X(i),Y(v),v]);});
    if(cur.length)runs.push(cur);
    let d='';runs.forEach(r=>{d+=(opt.smooth?spline(r):("M"+r.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L")))+" ";});
    s+=`<path d="${d}" fill="none" style="stroke:${se.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const pts=runs.flat();pts.forEach(p=>{s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" style="fill:var(--surface);stroke:${se.color}" stroke-width="1.6"/>`;});
    const last=pts[pts.length-1];if(last){const lab=opt.pct?last[2].toFixed(1)+"%":fmtC(last[2]);ends.push({x:last[0]+8,y:last[1],c:se.color,txt:esc(se.name)+" "+lab});}});
  ends.sort((a,b)=>a.y-b.y);const gp=13;for(let i=1;i<ends.length;i++){if(ends[i].y-ends[i-1].y<gp)ends[i].y=ends[i-1].y+gp;}
  ends.forEach(e=>{const yy=Math.max(m.t+8,Math.min(h-4,e.y+3.5));s+=`<text class="cx-end" x="${e.x.toFixed(1)}" y="${yy.toFixed(1)}" style="fill:${e.c}">${e.txt}</text>`;});
  return `<svg class="cx-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">${s}</svg>`;}

/* horizontal 100% stacked bar + legend */
function stackH(items){items=items.filter(it=>it.value>0);const tot=items.reduce((a,b)=>a+b.value,0)||1;
  let seg='',leg='';
  items.forEach(it=>{const p=it.value/tot*100;
    seg+=`<div class="sh-seg" style="width:${p}%;background:${it.color}" title="${esc(it.label)}">${p>=9?`<span style="color:${idealText(it.color)}">${p.toFixed(0)}%</span>`:''}</div>`;
    leg+=`<div class="sh-row"><span class="sh-sw" style="background:${it.color}"></span><span class="sh-lb">${esc(it.label)}</span><span class="sh-vl mono">${fmtN(it.value)}</span><span class="sh-pc mono">${p.toFixed(1)}%</span></div>`;});
  return `<div class="sh"><div class="sh-bar">${seg}</div><div class="sh-leg">${leg}</div></div>`;}

/* ===== ALLOCATION: TARGET MIX + PATH-TO-TARGET ===== */
const CLS_ORDER=["Equity","Debt","Gold","Cash","Other"];
/* current market-value of each class from live holdings */
function curMixVals(){const v={};CLS_ORDER.forEach(c=>v[c]=0);(M.holds||[]).forEach(h=>{if(v[h.cls]!=null)v[h.cls]+=h.current;});return v;}
function pctOf(vals){const tot=CLS_ORDER.reduce((s,c)=>s+(vals[c]||0),0)||0;const p={};CLS_ORDER.forEach(c=>p[c]=tot?(vals[c]||0)/tot*100:0);p._tot=tot;return p;}
/* default target = current mix rounded to 100 (falls back to a plain split when portfolio is empty) */
function defaultTargets(){const p=pctOf(curMixVals());let t={};if(p._tot>0){CLS_ORDER.forEach(c=>t[c]=Math.round(p[c]));}else{t={Equity:60,Debt:20,Gold:10,Cash:5,Other:5};}
  const sum=CLS_ORDER.reduce((s,c)=>s+t[c],0);if(sum!==100&&sum>0){const big=CLS_ORDER.slice().sort((a,b)=>t[b]-t[a])[0];t[big]+=100-sum;}return t;}
function defaultPlan(){const c={},g={};CLS_ORDER.forEach(x=>{c[x]=0;g[x]=0;});return{contrib:c,growth:g,months:36,tol:2,_v:2};}
/* average monthly "salary" for the cash plan: Salary + Bonus, never RSU (RSU vests as shares, not take-home cash) */
function avgSalary(){if(!(M&&M.IS&&M.IS.incRows&&M.months&&M.months.length))return 0;const n=M.months.length;let tot=0;
  M.IS.incRows.forEach(r=>{const c=(r.cat||"").toLowerCase();if(/rsu/.test(c))return;if(/salary|bonus/.test(c))tot+=(r.m&&r.m._t)||0;});return tot/n;}
/* Cash monthly contribution auto-fills to: average take-home (salary+bonus) - what you invest elsewhere - average monthly spend */
function cashAuto(){const sal=avgSalary(),exp=(M&&M.R&&isFinite(M.R.avgMo))?M.R.avgMo:0,
  others=["Equity","Debt","Gold","Other"].reduce((s,c)=>s+(+(S.plan&&S.plan.contrib&&S.plan.contrib[c])||0),0);
  return{sal,exp,cash:sal-others-exp};}
/* step the portfolio forward month by month; contributions may be negative (selling down); a class can't go below 0 */
function projectMix(start,contrib,growth,months){const vals={};CLS_ORDER.forEach(c=>vals[c]=start[c]||0);const rows=[];
  for(let t=0;t<=months;t++){if(t>0)CLS_ORDER.forEach(c=>{vals[c]=Math.max(0,vals[c]*(1+(growth[c]||0)/100/12)+(contrib[c]||0));});
    const tot=CLS_ORDER.reduce((s,c)=>s+vals[c],0)||1;const pct={};CLS_ORDER.forEach(c=>pct[c]=vals[c]/tot*100);
    rows.push({t,vals:{...vals},pct,tot});}return rows;}
/* first month index where every class sits within tol of its target; -1 if never within horizon */
function firstConverge(rows,targets,tol){for(let i=0;i<rows.length;i++){if(CLS_ORDER.every(c=>Math.abs(rows[i].pct[c]-(targets[c]||0))<=tol))return i;}return -1;}
/* biggest remaining gap at a given row (for the "not reached" verdict) */
function worstGap(row,targets){let w={cls:null,gap:0};CLS_ORDER.forEach(c=>{const d=row.pct[c]-(targets[c]||0);if(Math.abs(d)>Math.abs(w.gap))w={cls:c,gap:d};});return w;}
function addMonths(n){const d=new Date();d.setMonth(d.getMonth()+n);return _MON[d.getMonth()]+" "+d.getFullYear();}

/* pct-share trajectories toward target bands */
function projChart(w,nMonths,series,targets,tol,hitM){
  const h=272,m={t:16,r:82,b:26,l:34},pw=w-m.l-m.r,ph=h-m.t-m.b,HI=100;
  const X=i=>m.l+(nMonths<=0?pw/2:pw*i/nMonths),Y=v=>m.t+ph-(v/HI)*ph;
  let s="";
  [0,25,50,75,100].forEach(g=>{const y=Y(g);s+=`<line x1="${m.l}" y1="${y.toFixed(1)}" x2="${(m.l+pw).toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)" stroke-width="1" opacity="${g===0?"1":".5"}"/><text class="cx-x" x="${(m.l-7).toFixed(1)}" y="${(y+3.4).toFixed(1)}" text-anchor="end">${g}</text>`;});
  const step=nMonths<=12?3:nMonths<=36?6:12;for(let t=0;t<=nMonths;t+=step)s+=`<text class="cx-x" x="${X(t).toFixed(1)}" y="${(m.t+ph+15).toFixed(1)}">${t===0?"now":"+"+t}</text>`;
  series.forEach(se=>{const tg=targets[se.cls];if(tg==null)return;const y=Y(tg),yb1=Y(Math.min(HI,tg+tol)),yb2=Y(Math.max(0,tg-tol));
    s+=`<rect x="${m.l}" y="${Math.min(yb1,yb2).toFixed(1)}" width="${pw.toFixed(1)}" height="${Math.abs(yb2-yb1).toFixed(1)}" style="fill:${se.color}" opacity=".07"/>`;
    s+=`<line x1="${m.l}" y1="${y.toFixed(1)}" x2="${(m.l+pw).toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:${se.color}" stroke-width="1.1" stroke-dasharray="4 4" opacity=".75"/>`;});
  if(hitM>0){const xh=X(hitM);s+=`<line x1="${xh.toFixed(1)}" y1="${m.t}" x2="${xh.toFixed(1)}" y2="${(m.t+ph).toFixed(1)}" style="stroke:var(--rule)" stroke-width="1.3" stroke-dasharray="2 3"/><text class="cx-end" x="${xh.toFixed(1)}" y="${(m.t-4).toFixed(1)}" text-anchor="middle" style="fill:var(--rule)">on target +${hitM}mo</text>`;}
  const ends=[];
  series.forEach(se=>{const pts=se.data.map((v,i)=>[X(i),Y(v),v]);
    s+=`<path d="${spline(pts)}" fill="none" style="stroke:${se.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last=pts[pts.length-1];ends.push({x:last[0]+7,y:last[1],c:se.color,txt:se.cls+" "+last[2].toFixed(0)+"%"});});
  ends.sort((a,b)=>a.y-b.y);const gp=13;for(let i=1;i<ends.length;i++){if(ends[i].y-ends[i-1].y<gp)ends[i].y=ends[i-1].y+gp;}
  ends.forEach(e=>{const yy=Math.max(m.t+6,Math.min(h-4,e.y+3.5));s+=`<text class="cx-end" x="${e.x.toFixed(1)}" y="${yy.toFixed(1)}" style="fill:${e.c}">${esc(e.txt)}</text>`;});
  return `<svg class="cx-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">${s}</svg>`;}

/* compact stacked bar (no legend) for the now / projected / target comparison */
function miniStack(vals){const items=CLS_ORDER.map(c=>({label:c,value:vals[c]||0,color:clsColor(c)})).filter(i=>i.value>0);
  const tot=items.reduce((a,b)=>a+b.value,0)||1;
  return `<div class="sh-bar" style="height:26px">${items.map(it=>{const p=it.value/tot*100;return `<div class="sh-seg" style="width:${p}%;background:${it.color}" title="${esc(it.label)} ${p.toFixed(0)}%">${p>=11?`<span style="color:${idealText(it.color)}">${p.toFixed(0)}</span>`:""}</div>`;}).join("")}</div>`;}

/* ===== EXPORT =====
   Export is no longer a from-scratch, lossy SheetJS rebuild (4 sheets, no
   Class/Liquidity/Cash flag, Categories/Budget/Target Mix/Plan silently dropped).
   It's now the exact same operation as Merge -- real byte-preserving XML surgery
   applying whatever's queued onto the cached workbook bytes -- just without making
   you pick the file: it jumps straight to the review screen using the saved
   workbook, falling back to the picker (once) if nothing's cached yet. */
$("#btnExport").onclick=async ()=>{
  if(!S.loaded){toast("Import data first");return;}
  const total=CAP_QUEUE.length+CAT_QUEUE.length+ACCT_QUEUE.length+HOLD_QUEUE.length+LOT_QUEUE.length+BUD_QUEUE.length+DED_QUEUE.length+PAY_QUEUE.length+CG_QUEUE.length+TR_QUEUE.length+FD_QUEUE.length+MS_QUEUE.length;
  if(!total){toast("Nothing queued to export \u2014 add or edit entries first");return;}
  const cached=await wbCacheGet();
  capUseDifferentFile=!cached;
  switchCapTab("merge");
  await renderCapMerge();
  if(cached)await capReviewMerge(cached.bytes,cached.name);
  else toast("No saved workbook yet \u2014 choose your file once");
};

/* ===== CLEAR CACHE ===== */
// Every localStorage key this app writes, named explicitly rather than matched by
// STORE prefix -- CAP_K_QUEUE/CAT_K_QUEUE/ACCT_K_QUEUE/HOLD_K_QUEUE/BUD_K_QUEUE/
// CAP_K_ARCH/CAP_K_META use their own "*_v1" naming, not STORE's "ledger_app_v7"
// prefix, so the old prefix-filter silently never matched them: every pending
// queue and every archived batch survived a "Clear cache" untouched, which is
// exactly why a supposedly-cleared load could still show old data. Caught by
// checking the actual key names against the actual filter, not by assuming the
// filter was exhaustive because it looked like it should be.
// STORE's atomic-write envelope (storageAdapter.setStateAtomic) also leaves a
// "__prev" previous-known-good copy and, transiently, a "__staging" key behind
// -- both need to go on a real reset or they'd survive a "Clear cache" untouched.
const ALL_APP_LS_KEYS=()=>[STORE,STORE+"__prev",STORE+"__staging",LOCAL_SYNC_LS_KEY,CAP_K_QUEUE,CAP_K_ARCH,CAP_K_META,CAT_K_QUEUE,ACCT_K_QUEUE,HOLD_K_QUEUE,LOT_K_QUEUE,BUD_K_QUEUE,DED_K_QUEUE,PAY_K_QUEUE,CG_K_QUEUE,TR_K_QUEUE,FD_K_QUEUE,MS_K_QUEUE];
$("#btnClear").onclick=async ()=>{
  if(!(await capConfirm("Clear this device's saved data?\n\nThis wipes the cached workbook (including the saved copy used for Merge/Export), every pending queue, archived batches, target mix and plan from local storage, and reloads the app. Export first if you want a copy \u2014 nothing is sent anywhere."))) return;
  try{
    ALL_APP_LS_KEYS().forEach(k=>storageAdapter.removeItem(k));
    // theme (STORE+"_theme_v2") is deliberately NOT in that list -- appearance choice survives a reset.
  }catch(e){}
  await wbCacheClear();
  location.reload();
};

/* ===== NAV / THEME / PERSIST ===== */
/* ---- Top-level screens. Reports and Settings are each represented in the nav
   (sidebar + drawer) as an expandable group rather than a landing page with its own
   in-page tab switcher -- picking a sub-item there navigates straight to that
   destination. Categories/Accounts/Budget stay clubbed together under one
   destination ("settings", labelled "Categories & Budget" in the nav) since they're
   three related editors; Appearance and Workbook are each a single, separate

          new:fixture.incomes.map(income=>slabTax(income,rules.newSlabs)),
          old:fixture.incomes.map(income=>slabTax(income,rules.oldSlabs))
        });
      }
      if(fixture.operation==="regimes"){
        return rounded(Object.fromEntries(fixture.cases.map(item=>{
          const income={...zeroIncome,...item.income};
          return[item.name,computeTaxRegime(item.regime,income)];
        })));
      }
      if(fixture.operation==="capitalGains"){
        const result=capGainsBreakdown();
        return rounded({buckets:result.buckets,ltcg112ANet:result.ltcg112ANet,tax111A:result.tax111A,
          tax112A:result.tax112A,taxOther:result.taxOther,totalCgTax:result.totalCgTax,excluded:result.excluded.length});
      }
      if(fixture.operation==="surcharge"){
        const income={...zeroIncome,...fixture.income};
        const cg=fixture.cg||{buckets:{stcg111A:0,ltcgOther:0},ltcg112ANet:0,tax111A:0,tax112A:0,totalCgTax:0};
        return rounded(computeSurcharge(computeTaxRegime(fixture.regime,income),income,cg));
      }
      if(fixture.operation==="advanceTax"){
        const cg=capGainsBreakdown();
        const result=computeAdvanceTax(taxRules(),fixture.grandTotal,cg,fixture.asOfDate);
        return rounded({taxDue:result.taxDue,c234:result.c234.map(({date,pct,required,actual,effective,interest})=>({date,pct,required,actual,effective,interest})),
          total234C:result.total234C,triggered234B:result.triggered234B,shortfall234B:result.shortfall234B,
          months234B:result.months234B,interest234B:result.interest234B});
      }
      if(fixture.operation==="scheduleAL"){
        const income={...zeroIncome,...fixture.income};
        const cg=fixture.cg||{buckets:{stcg111A:0,ltcgOther:0},ltcg112ANet:0,tax111A:0,tax112A:0,totalCgTax:0};
        const result=computeSurcharge(computeTaxRegime(fixture.regime,income),income,cg);
        return rounded({totalIncome:result.totalIncomeForSurcharge,threshold:taxRules().alThreshold,required:result.totalIncomeForSurcharge>taxRules().alThreshold});
      }
      if(fixture.operation==="fixedDeposits"){
        const result=fixedDepositsBreakdown(taxRules());
        return rounded({totalInterest:result.totalInterest,rows:result.rows.map(({bank,senior,interest,threshold,tdsLikely})=>({bank,senior,interest,threshold,tdsLikely}))});
      }
      throw new Error(`Unknown tax fixture operation: ${fixture.operation}`);
    },
    backupRoundTrip(){
      const parsed=capParseBackupFile(JSON.stringify(capStateBackupObj()));
      return {format:parsed._backup.format,transactions:parsed.txns.length,holdings:parsed.holdings.length,
        queues:Object.fromEntries(Object.entries(queueCounts()).map(([k])=>[k,parsed[{
          transactions:"capQueue",categories:"catQueue",accounts:"acctQueue",holdings:"holdQueue",
          lots:"lotQueue",budget:"budQueue",deductions:"dedQueue",taxPayments:"payQueue",
          capitalGains:"cgQueue",taxRules:"trQueue",fixedDeposits:"fdQueue",modelSettings:"msQueue"
        }[k]].length]))};
    },
    async explanationSnapshot(){
      renderOverview();renderInvest();renderStatements();renderBudget();renderTax();
      const counts={
        overview:$$('#v-overview [data-explain]').length,
        investments:$$('#v-invest [data-explain]').length,
        statements:$$('#v-statements [data-explain]').length,
        budget:$$('#v-budget [data-explain]').length,
        tax:$$('#v-tax [data-explain]').length
      };
      await openExplanation("tax");
      const labels=$$("#calcBody .k").map(x=>x.textContent.trim());
      const status=$$("#calcBody .chip").map(x=>x.textContent.trim());
      const body=$("#calcBody").textContent.replace(/\s+/g," ").trim();
      $("#calcOverlay").classList.remove("on");
      return{counts,labels,status,hasVersion:body.includes(APP_VERSION),hasRules:body.includes(taxRules().fy)};
    },
    transactionUxSnapshot(){
      S.transactionTemplates=[{id:"fixture-template",name:"Fixture rent",favorite:true,kind:"Spend - Bank/Cash",from:"Primary Bank",to:EXT,amt:25000,cat:"Housing",sub:"Rent",com:""}];
      S.txnDraft={date:"2026-09-20",kind:"Spend - Bank/Cash",from:"Primary Bank",to:EXT,amt:1234,cat:"Food",sub:"Groceries",com:"Draft"};
      openAddOverlay();
      const restored={amount:$("#c_amt").value,comment:$("#c_com").value,templateButtons:$$("[data-template]").length};
      $("#c_kind").value="Transfer - Between My Accounts";$("#c_kind").onchange();
      const progressive={categoryHidden:$("#c_cat_wrap").style.display==="none",effect:$("#c_effect").textContent};
      const backup=capStateBackupObj();
      closeAddOverlay();
      return{restored,progressive,backupTemplates:backup.transactionTemplates.length,backupHasDraft:Boolean(backup.txnDraft)};
    },
    async driftReviewSnapshot(){
      setQueues({capQueue:[{id:"drift-txn",action:"add",createdAt:"2026-09-01T00:00:00.000Z",date:"2026-09-01",kind:"Spend - Bank/Cash",from:"Primary Bank",to:EXT,amt:10,cat:"Food",sub:"",com:"Drift check"}]});
      S.workbookBaselineFingerprint="different-baseline";
      goToView("data");$("#v-data").innerHTML='<div id="cm_result"></div>';
      const source=new Uint8Array(await documentAdapter.fetchBundledAsset("./template.xlsx"));
      await capReviewMerge(source,"external-copy.xlsx");
      const result={warning:/differs from Pechak's last known baseline/.test($("#cm_result").textContent),
        requiresConfirmation:Boolean($("#cm_drift_confirm")),confirmDisabled:Boolean($("#cm_confirm")&&$("#cm_confirm").disabled),
        fingerprintShown:/Source fingerprint/.test($("#cm_result").textContent)};
      S.workbookBaselineFingerprint=null;setQueues({});
      return result;
    },
    receiptSnapshot(){
      const receipt=(S.workbookReceipts||[])[0];
      return receipt?{count:S.workbookReceipts.length,hasSource:/^[a-f0-9]{64}$/.test(receipt.sourceFingerprint||""),
        hasOutput:/^[a-f0-9]{64}$/.test(receipt.outputFingerprint||""),appliedFamilies:Object.keys(receipt.applied||{}).length,
        backupCount:(capStateBackupObj().workbookReceipts||[]).length}:null;
    },
    navigationSnapshot(){
      const labels=$$("#mobileNav button").map(x=>x.textContent.trim());
      renderStatements();
      const firstCell=$("#v-statements .stmt td:first-child:not([colspan])");
      const sectionCell=$("#v-statements .stmt .sec-row td[colspan]");
      const tableColumns={firstWidth:Math.round(firstCell.getBoundingClientRect().width),
        firstWrap:getComputedStyle(firstCell).whiteSpace,sectionSticky:getComputedStyle(sectionCell).position==="sticky"};
      goToView("budget");
      const planActive=Boolean($("#mobileNav [data-mobile-v=plan].on"));
      goToView("taxrules");
      const taxActive=Boolean($("#mobileNav [data-mobile-v=tax].on"));
      const deepLink=location.hash;
      goToView("overview",{history:false});history.replaceState({view:"overview"},"",location.pathname+location.search);
      return{labels,planActive,taxActive,deepLink,planHubLinks:$$("[data-plan-go]").map(x=>x.dataset.planGo),tableColumns,
        minTarget:parseFloat(getComputedStyle($("#mobileNav [data-mobile-v=overview]")).minHeight)};
    },
    prepareAllQueueMerge(){
      const createdAt="2026-09-01T00:00:00.000Z";
      const event={id:"fixture-cg-event",cls:"Equity",type:"Stock",holdName:"Fixture Sale",acct:"Fixture Broker",
        qty:2,costBasis:1000,acqDate:"2025-01-10",saleDate:"2026-09-01",proceeds:1400,source:"ledger"};
      S.capGainsEvents=[...(S.capGainsEvents||[]),event];
      setQueues({
        capQueue:[{id:"merge-txn",action:"add",createdAt,date:"2026-09-01",kind:"Spend - Bank/Cash",from:"Primary Bank",to:EXT,amt:1250,cat:"Food",sub:"Groceries",com:"Fixture merge"}],
        catQueue:[{id:"merge-cat",action:"addCat",createdAt,name:"Fixture Category",applies:"Expense",fixvar:"Variable",essdisc:"Discretionary",incclass:""}],
        acctQueue:[{id:"merge-acct",action:"addAcct",createdAt,name:"Fixture Account",cls:"Asset",liq:"Current",kind:"Bank",open:1234}],
        holdQueue:[{id:"merge-hold",action:"addHold",createdAt,cls:"Equity",type:"Stock",name:"Fixture Holding",acct:"Fixture Broker",units:2,avg:500,price:700,minv:null,mval:null,symbol:"FIXTURE"}],
        lotQueue:[{id:"merge-lot",action:"addLot",createdAt,holdName:"Fixture Holding",acct:"Fixture Broker",acqDate:"2025-01-10",qty:2,costPerUnit:500,source:"Test"}],
        budQueue:[{id:"merge-budget",action:"editBufferMonths",createdAt,months:8}],
        dedQueue:[{id:"merge-ded",action:"editEntry",createdAt,matchCode:"80C",code:"80C",desc:"Fixture 80C",regime:"Old",limit:150000,claimed:25000}],
        payQueue:[{id:"merge-pay",action:"addPayment",createdAt,date:"2026-06-15",type:"Advance",section:"",payer:"Fixture",incomeHead:"Salary",amount:1000}],
        cgQueue:[{id:"merge-cg",action:"addEvent",createdAt,eventId:event.id}],
        trQueue:[{id:"merge-tax",action:"save",createdAt,rules:clone(taxRules())}],
        fdQueue:[{id:"merge-fd",action:"addFD",createdAt,bank:"Fixture FD Bank",principal:50000,rate:.07,compPerYear:4,start:"2026-04-01",maturity:"2027-04-01",payout:"Cumulative",status:"Active",tdsPaid:0}],
        msQueue:[{id:"merge-model",action:"save",createdAt,settings:{statementStart:"2026-04-01",asOfDate:"2026-09-21",modelYear:2026}}]
      });
      M=compute();render();
      return queueCounts();
    },
    async dataJourneySnapshot(){
      const before=queueCounts();
      const workbookBefore=await wbCacheGet();
      await saveSafetyCopy();
      const safety=await localSyncGet();
      let backupDownload=null;
      const originalDownload=documentAdapter.downloadFile;
      documentAdapter.downloadFile=(name,bytes,type)=>{backupDownload={name,type,bytes:new Uint8Array(bytes)};};
      try{await capDoBackupDownload();}finally{documentAdapter.downloadFile=originalDownload;}
      capTab="data";goToView("data");
      const tabs=$$("#v-data [data-cap]").map(x=>x.textContent.trim());
      const headings=$$("#v-data .card h3").map(x=>x.textContent.trim());
      const backup=JSON.parse(new TextDecoder().decode(backupDownload.bytes));
      return {
        labels:{button:$("#dataSafetyText").textContent.trim(),tabs,headings},
        safetyCopy:{saved:Boolean(safety&&(safety.savedAt||safety.syncedAt)),queueCountsUnchanged:JSON.stringify(before)===JSON.stringify(queueCounts())},
        portableBackup:{namePattern:/^ledger_backup_\d{4}-\d{2}-\d{2}\.json$/.test(backupDownload.name),
          mime:backupDownload.type,format:backup._backup.format,includesWorkbook:Boolean(backup.workbook)},
        workbookUntouched:workbookBefore==null&&(await wbCacheGet())==null
      };
    },
    async importWorkbook(bytesB64){
      const bytes=b64ToBytes(bytesB64);
      await importWB(bytes.buffer);
      M=compute();render();
      return {transactions:S.txns.length,accounts:S.accounts.length,holdings:S.holdings.length,
        lots:(S.lots||[]).length,fixedDeposits:S.fixedDeposits.length};
    },
    async reviewInvalidWorkbook(bytes){
      goToView("data");$("#v-data").innerHTML='<div id="cm_result"></div>';
      await capReviewMerge(new Uint8Array(bytes),"invalid.xlsx");
      return ($("#cm_result")&&$("#cm_result").textContent||"").replace(/\s+/g," ").trim();
    },
    async mergeBundledWorkbook(){
      const source=new Uint8Array(await documentAdapter.fetchBundledAsset("./template.xlsx"));
      let downloaded=null;
      const originalDownload=documentAdapter.downloadFile;
      documentAdapter.downloadFile=(name,bytes,type)=>{downloaded={name,bytes:new Uint8Array(bytes),type};};
      try{
        goToView("data");$("#v-data").innerHTML='<div id="cm_result"></div>';
        await capReviewMerge(source,"template.xlsx");
        const confirm=$("#cm_confirm");
        if(!confirm)throw new Error(($("#cm_result")&&$("#cm_result").textContent)||"Merge review did not produce a confirmation");
        await confirm.onclick();
        if(!downloaded)throw new Error("Merge did not produce a workbook download");
        return {source:await workbookSignature(source),output:await workbookSignature(downloaded.bytes),
          remainingQueues:queueCounts(),mime:downloaded.type};
      }finally{documentAdapter.downloadFile=originalDownload;}
    }
  };
}
if(!goldenTestMode&&"serviceWorker" in navigator){window.addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const showUpdateBanner=worker=>{
      const banner=$("#updateReadyBanner");
      if(!banner)return;
      banner.classList.add("show");
      $("#updateReadyGo").onclick=()=>{
        if(window.__pechakBusy){toast("Finish the current import/merge first, then update.");return;}
        banner.classList.remove("show");
        worker.postMessage({type:"SKIP_WAITING"});
      };
      $("#updateReadyClose").onclick=()=>banner.classList.remove("show");
    };
    // A worker may already be sitting in "waiting" from a previous page load.
    if(reg.waiting)showUpdateBanner(reg.waiting);
    reg.addEventListener("updatefound",()=>{
      const nw=reg.installing;
      if(!nw)return;
      nw.addEventListener("statechange",()=>{
        if(nw.state==="installed"&&navigator.serviceWorker.controller)showUpdateBanner(nw);
      });
    });
  }).catch(()=>{});
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(reloading)return;
    reloading=true;
    location.reload();
  });
});}
</script>
